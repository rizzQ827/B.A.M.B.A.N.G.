  return sendCommand(cmd);
}
async function holdWake(){ try { if('wakeLock' in navigator && document.visibilityState === 'visible' && !ENG.wake){ ENG.wake = await navigator.wakeLock.request('screen'); ENG.wake.addEventListener('release', () => { ENG.wake = null; }); } } catch(e){} }
document.addEventListener('visibilitychange', () => { if(ENG.on) holdWake(); });

/* ---------- jalankan ---------- */
async function waitFor(ms, label){
  ENG.nextAt = Date.now() + ms; ENG.current = label; pushEngine(true); paintChrome();
  let lastCmd = Date.now(), lastBeat = Date.now();
  while(Date.now() < ENG.nextAt && !ENG.stop){
    await sleep(1000);
    if(Date.now() - lastCmd > 5000){ lastCmd = Date.now(); await checkCommand(); if(ENG.paused || ENG.stop) break; }
    if(Date.now() - lastBeat > 20000){ lastBeat = Date.now(); pushEngine(true); }
  }
  ENG.nextAt = null;
}
function setNow(txt){ ENG.current = txt; pushEngine(); paintChrome(); const el = $('#engNow'); if(el) el.textContent = txt; }
async function engineRun(scope, by){
  if(ENG.on){ toast('Mesin sudah jalan'); return; }
  if(ENG.role === 'none'){ toast('Tab ini bukan mesin'); return; }
  if(!pendingCount(scope)){ toast('Tidak ada yang perlu diproses'); ENG.current = ''; pushEngine(true); return; }
  Object.assign(ENG, {on:true, paused:false, stop:false, stopBy:'', scope, current:'Menyiapkan…', message:'', nextAt:null, saved:0, failed:0, done:0, failStreak:0, tries:{}, skip:new Set(), revDone:0, curAcc:scope.kind === 'akun' ? scope.account_id : null});
  ENG.role = 'jalan';
  const run = await dbInsert('run_logs', {account_id:ENG.curAcc, started_at:new Date().toISOString(), notes:'Mesin otomatis', posts_processed:0}, 'Gagal mencatat sesi');
  ENG.runId = run && run[0] ? run[0].id : null;
  holdWake();
  const n = pendingCount(scope);
  await pushEngine(true);
  await sb.from('engine_state').update({session_started_at:new Date().toISOString()}).eq('owner', USER.id);
  logAct('mesin', 'info', `Mesin mulai${by && by !== DEVICE ? ` (perintah dari ${by})` : ''}: ${n} pekerjaan${scope.kind === 'akun' ? ` untuk ${handleOf(scope.account_id)}` : ' di semua antrean'}.`, {account_id:ENG.curAcc});
  paintChrome(); bump('engine');
  let reason = 'selesai', note = '';
  try {
    while(!ENG.stop){
      await checkCommand();
      if(ENG.stop) break;
      if(ENG.paused){
        ENG.current = 'Dijeda'; pushEngine(true); paintChrome();
        let k = 0;
        while(ENG.paused && !ENG.stop){ await sleep(2000); k++; if(k % 3 === 0) await checkCommand(); if(k % 10 === 0) pushEngine(true); }
        continue;
      }
      const job = nextJob();
      if(!job){ note = 'Antrean habis'; break; }
      if(job.kind === 'limit'){ reason = 'limit'; note = `Batas harian Instagram tercapai (${S.settings.ig_daily_limit} postingan). Dilanjutkan besok`; break; }
      if(job.kind === 'wait'){ await waitFor(Math.max(1000, job.until - Date.now()), 'Jeda antar akun Instagram'); continue; }
      const res = await doJob(job);
      paintChrome(); bump('engine');
      if(res.action === 'stop'){ reason = res.reason || 'error'; note = res.msg; logAct('mesin', 'error', res.msg, {account_id:ENG.curAcc}); break; }
      if(res.action === 'pause'){ ENG.paused = true; ENG.message = res.msg; logAct('mesin', 'warn', `Mesin dijeda: ${res.msg}`, {account_id:ENG.curAcc}); notify('jeda', 'Mesin BAMBANG dijeda', res.msg); continue; }
      if(res.action === 'retry'){ await waitFor(res.wait, res.label || 'Menunggu sebelum mencoba lagi'); continue; }
      if(ENG.stop) break;
      const nx = nextJob();
      if(nx && (nx.kind === 'q' || nx.kind === 'revisi' || nx.kind === 'ulang') && res.ig) await waitFor(rand(GAP[0], GAP[1]), 'Jeda aman sebelum postingan berikutnya');
    }
  } catch(e){ reason = 'error'; note = `Error tak terduga: ${e.message || e}`; console.error(e); logAct('mesin', 'error', note, {account_id:ENG.curAcc}); }
  await engineFinish(reason, note || ENG.stopBy || 'Dihentikan');
}
async function engineFinish(reason, note){
  const moved = /pindah/i.test(note);
  const msg = `${note}. ${ENG.saved} catatan${ENG.failed ? `, ${ENG.failed} gagal` : ''}.`;
  if(ENG.runId) dbUpdate('run_logs', ENG.runId, {ended_at:new Date().toISOString(), stopped_reason:reason, posts_processed:ENG.saved, notes:`Mesin otomatis · ${note}${ENG.failed ? ` · ${ENG.failed} gagal` : ''}`});
  if(!moved) logAct('mesin', reason === 'error' ? 'error' : 'info', `Mesin berhenti: ${msg}`, {account_id:ENG.curAcc});
  if(!moved){
    if(reason === 'error') notify('berhenti', 'Mesin BAMBANG berhenti', msg);
    else if(!/Dihentikan/.test(note)) notify('selesai', reason === 'limit' ? 'Batas harian Instagram tercapai' : 'Antrean BAMBANG selesai', msg);
    if(ENG.revDone) notify('revisi', 'Revisi selesai', `${ENG.revDone} catatan hasil revisi siap dibandingkan.`);
  }
  Object.assign(ENG, {on:false, paused:false, nextAt:null, current:'', message:msg, busyPost:null, curAcc:null, scope:null});
  if(ENG.role !== 'none') ENG.role = 'siaga';
  try { if(ENG.wake) await ENG.wake.release(); } catch(e){}
  if(!moved) await pushEngine(true);
  paintChrome(); bump('engine');
}
async function doJob(job){
  if(job.kind === 'collect') return collectJob(accById(job.id));
  if(job.kind === 'thumbs'){ ENG.extra.shift(); return thumbsJob(accById(job.id)); }
  return processPost(job);
}
function igErr(err, label, tries){
  if(/login/i.test(err)){ ENG.health.ig = 'login'; ENG.health.ig_at = new Date().toISOString(); return {action:'pause', msg:'Instagram minta login. Buka instagram.com di Chrome ini, login, lalu klik Lanjutkan.'}; }
  if(/membatasi|terlalu cepat|HTTP 429|wait a few/i.test(err)){ ENG.health.ig = 'limit'; logAct('mesin', 'warn', `Instagram meminta jeda. Mesin menunggu 15 menit (sampai ${clock(Date.now() + IG_LIMIT_WAIT)}).`); return {action:'retry', wait:IG_LIMIT_WAIT, label:'Instagram meminta jeda'}; }
  if(/diperbarui|tidak menjawab|Muat ulang/i.test(err)) return {action:'pause', msg:`Extension bermasalah: ${err}`};
  return null;
}

  await dbUpdate('accounts', acc.id, {collect_status:'mengumpulkan', collect_note:null});

    r = await extCall('ig-profile', {username:user, sb:await sbCreds(), thumbs:true, reels:true, skipThumbs:[...known]}, t => setNow(`${acc.handle} · ${t}`), 30 * 60000);
  } catch(e){ r = {ok:false, error:e.message}; }

    const err = r.error || 'tidak ada keterangan';

    await dbUpdate('accounts', acc.id, {collect_status:'gagal', collect_note:err.slice(0, 200)});

  await dbUpdate('accounts', acc.id, {collect_status:'selesai', collect_note:r.reels_error ? `Tab Reels tidak terbaca: ${r.reels_error}` : null, full_name:pf.full_name || acc.full_name,
    ig_user_id:pf.id, pp_path:pf.pp_path || acc.pp_path, profile_post_count:pf.post_count, profile_url:pf.profile_url, last_collected_at:new Date().toISOString(), last_checked_at:new Date().toISOString()});
  await fillThumbs(r.items);
  logAct('mesin', 'ok', `${acc.handle}: ${r.items.length} link terkumpul (${added} baru${r.reels_added ? `, ${r.reels_added} dari tab Reels` : ''}).`, {account_id:acc.id});
  ENG.done++;
  return {action:'next'};
}

async function fillThumbs(items){
  const by = new Map(items.filter(i => i.thumb_path).map(i => [i.code, i.thumb_path]));
  const posts = S.posts.filter(p => p.ig_code && by.has(p.ig_code) && p.thumb_path !== by.get(p.ig_code));
  for(const p of posts) await dbUpdate('posts', p.id, {thumb_path:by.get(p.ig_code)});
  const qs = S.queue.filter(q => q.ig_code && by.has(q.ig_code) && q.thumb_path !== by.get(q.ig_code));
  for(const q of qs) await dbUpdate('link_queue', q.id, {thumb_path:by.get(q.ig_code)});
  return posts.length;
}
/* masukkan link hasil extension ke antrean (urut dari paling lama) */
async function addLinks(accId, items, source){
  const existing = S.queue.filter(q => q.account_id === accId);
  let pos = existing.reduce((m, q) => Math.max(m, q.position || 0), 0);
  const fresh = items.filter(i => !qByUrl(i.url)).sort((a, b) => (a.taken_at || '').localeCompare(b.taken_at || ''));
  const rows = fresh.map(i => { const post = postByUrl(i.url);
    return {account_id:accId, url:i.url, position:++pos, pinned:!!i.pinned, status:post ? 'selesai' : 'antri', post_id:post ? post.id : null, source, ig_code:i.code || igCode(i.url),
      taken_at:i.taken_at || null, media_type:i.type || null, thumb_path:i.thumb_path || null, platform:'Instagram'}; });
  if(!rows.length) return 0;
  const ok = await dbInsert('link_queue', rows, 'Gagal menyimpan antrean');
  return ok ? rows.filter(r => r.status === 'antri').length : 0;
}
/* cek postingan baru (ringan) untuk akun tertentu atau semua yang dipantau */
async function checkNew(accIds, opts = {}){
  if(!canHost()){ toast('Cek postingan baru butuh extension di laptop'); return 0; }
  const list = (accIds ? accIds.map(accById) : S.accounts.filter(a => a.watched && (opts.daily ? a.daily_check : true))).filter(a => a && a.platform === 'Instagram' && igUser(a.handle));
  const results = []; let total = 0;
  const wasCur = ENG.current;
  for(const a of list){
    ENG.current = `Cek postingan baru ${a.handle}…`; pushEngine(true); paintChrome(); bump('engine');
    try {
      const known = [...new Set([...S.queue.filter(q => q.account_id === a.id).map(q => q.ig_code), ...S.posts.filter(p => p.account_id === a.id).map(p => p.ig_code)].filter(Boolean))];
      const r = await extCall('ig-check-new', {username:igUser(a.handle), user_id:a.ig_user_id || null, known, sb:await sbCreds(), pp:!a.pp_path}, t => setNow(`${a.handle} · ${t}`), 10 * 60000);
      if(!r.ok) throw new Error(r.error);
      const n = await addLinks(a.id, r.items, 'cek_baru');
      const patch = {last_checked_at:new Date().toISOString(), ig_user_id:r.user_id || a.ig_user_id};
      if(r.profile && r.profile.pp_path) patch.pp_path = r.profile.pp_path;
      await dbUpdate('accounts', a.id, patch);
      results.push({account_id:a.id, n, items:r.items.slice(-3)}); total += n;
      ENG.health.ig = 'ok'; ENG.health.ig_at = new Date().toISOString();
    } catch(e){
      results.push({account_id:a.id, n:0, error:e.message});
      if(/login/i.test(e.message)){ ENG.health.ig = 'login'; break; }
      if(/membatasi|429/i.test(e.message)){ ENG.health.ig = 'limit'; break; }
    }
    if(list.length > 1) await sleep(rand(4000, 8000));
  }
  ENG.current = ENG.on ? wasCur : '';
  ENG.lastCheck = {at:new Date().toISOString(), results, total, daily:!!opts.daily};
  const errs = results.filter(r => r.error);
  logAct('mesin', errs.length && !total ? 'warn' : 'ok', `${opts.daily ? 'Cek harian' : 'Cek postingan baru'}: ${total} postingan baru dari ${results.length} kreator${errs.length ? ` (${errs.length} gagal: ${errs[0].error})` : ''}.`);
  pushEngine(true); paintChrome(); bump('engine');
  return total;
}

/* ---------- satu postingan: extension → Gemini → simpan ---------- */
async function invokeGemini(body){
  try {
    const {data, error} = await sb.functions.invoke('gemini-read', {body});
    if(error){
      let d = null; try { d = await error.context.json(); } catch(_){}
      const st = error.context && error.context.status;
      return d && d.error ? d : {ok:false, stage:'server', kind:(!st || st >= 500) ? 'busy' : 'other', error:`${error.message}${st ? ` (HTTP ${st})` : ''}`};
    }
    return data;
  } catch(e){ return {ok:false, stage:'server', kind:'busy', error:e.message || String(e)}; }
}
async function failJob(job, label, why){
  ENG.failed++; ENG.failStreak++; ENG.done++;
  if(job.kind === 'q') await dbUpdate('link_queue', job.id, {status:'gagal', note:why.slice(0, 200)});
  else ENG.skip.add(job.id);
  logAct('mesin', 'error', `${label} gagal: ${why}`, {account_id:ENG.curAcc, post_id:job.kind !== 'q' ? job.id : null});
  if(ENG.failStreak >= 3) return {action:'pause', msg:'3 pekerjaan berturut-turut gagal. Kemungkinan ada masalah umum (login Instagram, koneksi, atau Gemini). Cek Aktivitas, lalu klik Lanjutkan.'};
  return {action:'next'};
}
async function cleanupCopies(force = false){
  if(!force && Date.now() - ENG.lastClean < 10 * 60000) return;
  ENG.lastClean = Date.now();
  const st = S.settings || {}; const keepMs = (st.video_keep_days || 14) * 864e5;
  const drop = S.posts.filter(p => hasCopy(p) && ((st.video_delete_on_check && p.check_status === 'sudah') || (p.video_saved_at && Date.now() - Date.parse(p.video_saved_at) > keepMs)));
  for(const p of drop) await dropCopy(p);
}
async function dropCopy(p){
  if(!hasCopy(p)) return;
  await sb.storage.from('tmp-media').remove(p.video_paths).catch(() => {});
  await dbUpdate('posts', p.id, {video_paths:null, video_bytes:null, video_saved_at:null});
}
const copiesUsed = () => S.posts.reduce((s, p) => s + (hasCopy(p) ? (p.video_bytes || 0) : 0), 0);
async function decideKeep(bytes){
  if(!bytes) return false;
  await cleanupCopies();
  const cap = (S.settings.video_cap_mb || 700) * 1048576;
  if(bytes > cap) return false;
  let used = copiesUsed();
  if(used + bytes > cap){
    const old = S.posts.filter(hasCopy).sort((a, b) => String(a.video_saved_at).localeCompare(String(b.video_saved_at)));
    for(const p of old){ if(used + bytes <= cap) break; used -= p.video_bytes || 0; await dropCopy(p); }
  }
  return used + bytes <= cap;
}
async function processPost(job){
  const post0 = job.kind !== 'q' ? postById(job.id) : null;
  const q0 = job.kind === 'q' ? qById(job.id) : null;
  if(!post0 && !q0) return {action:'next'};
  const url = post0 ? post0.original_url : q0.url;
  let acc = accById(post0 ? post0.account_id : q0.account_id);
  ENG.curAcc = acc ? acc.id : null;
  const dTxt = igDate(url) ? ` (${fmtD(igDate(url))})` : '';
  const label = post0 ? `${job.kind === 'revisi' ? 'Revisi' : 'Proses ulang'} "${titleOf(post0)}"` : `${acc ? acc.handle + ' ' : ''}#${q0.position || '?'}${dTxt}`;
  const tries = ENG.tries[job.key] = ENG.tries[job.key] || {busy:0, other:0, model:0};
  const t0 = Date.now();
  ENG.busyPost = post0 ? post0.id : null;
  let paths = []; let usedIg = false;
  try {
    let creds; try { creds = await sbCreds(); } catch(e){ return {action:'stop', reason:'error', msg:e.message}; }
    let body = {source_url:url, purpose:job.kind === 'revisi' ? 'revisi' : job.kind === 'ulang' ? 'ulang' : 'baru'}, meta = null, fetched = null;
    if(isIG(url)){
      if(!EXT.ready) return {action:'pause', msg:'Extension BAMBANG Helper tidak terdeteksi. Pastikan terpasang dan aktif, muat ulang halaman ini, lalu klik Lanjutkan.'};
      setNow(`${label} · mengambil dari Instagram…`);
      let r;
      try { r = await extCall('ig-fetch', {url, sb:creds, thumb:!(post0 && post0.thumb_path), pp:!acc || !acc.pp_path}, t => setNow(`${label} · ${t}`), 180000); }
      catch(e){ r = {ok:false, error:e.message}; }
      usedIg = true; await bumpIg();
      if(!r.ok){
        const err = r.error || 'tidak ada keterangan';
        const h = igErr(err); if(h) return h;
        if(/dihapus|tidak ditemukan|kosong|private|bukan link|tidak punya file/i.test(err)) return {...await failJob(job, label, err), ig:true};
        if(++tries.other < 2){ logAct('mesin', 'warn', `${label}: ${err}. Dicoba lagi 1 menit lagi.`, {account_id:ENG.curAcc}); return {action:'retry', wait:60000, label:'Mencoba lagi postingan yang sama'}; }
        return {...await failJob(job, label, err), ig:true};
      }
      ENG.health.ig = 'ok'; ENG.health.ig_at = new Date().toISOString();
      meta = r.meta; paths = r.paths || []; fetched = r;
      if(!acc && meta.username){
        acc = S.accounts.find(a => a.platform === 'Instagram' && lc(a.handle) === lc(meta.username));
        if(!acc){
          const made = await dbInsert('accounts', {handle:meta.username, platform:'Instagram', profile_url:`https://www.instagram.com/${meta.username.replace(/^@/, '')}/`, full_name:meta.full_name || null,
            ig_user_id:meta.user_id || null, pp_path:r.pp_path || null, watched:!!(q0 && q0.make_target), collect_status:q0 && q0.make_target ? 'menunggu' : 'selesai'}, 'Gagal membuat kreator');
          acc = made && made[0];
        } else if(q0 && q0.make_target && !acc.watched) await dbUpdate('accounts', acc.id, {watched:true, collect_status:'menunggu'});
        if(acc && q0){ const pos = S.queue.filter(x => x.account_id === acc.id).reduce((m, x) => Math.max(m, x.position || 0), 0) + 1; await dbUpdate('link_queue', q0.id, {account_id:acc.id, position:pos}); }
        ENG.curAcc = acc ? acc.id : null;
      } else if(acc && r.pp_path && !acc.pp_path) await dbUpdate('accounts', acc.id, {pp_path:r.pp_path});
      const keep = await decideKeep(r.bytes || 0);
      body = {...body, storage_paths:paths, kreator:meta.username || (acc && acc.handle) || '-', platform:'Instagram', jenis:meta.type, caption:meta.caption || '', copy_key:meta.shortcode || igCode(url), keep_video:keep};
    } else if(isYT(url)){
      body = {...body, youtube_url:url, kreator:acc ? acc.handle : '-', platform:'YouTube', jenis:'video', caption:''};
    } else {
      return await failJob(job, label, 'platform ini belum didukung mesin (baru Instagram & YouTube)');
    }
    const ser = post0 && post0.series_id ? serById(post0.series_id) : null;
    if(ser){ body.series = ser.name; if(post0.part_number) body.part = post0.part_number; }
    if(job.kind === 'revisi'){
      body.revision_notes = (post0.revision_notes || []).map(n => ({pos:n.pos, text:n.text}));
      try { body.previous_md = await getMd(post0.id); } catch(e){}
    }
    setNow(`${label} · Gemini sedang membaca…`);
    const res = await invokeGemini(body);
    paths = []; // server menghapus/menyimpan file titipan setelah membacanya
    if(!res || !res.ok){
      const kind = res && res.kind || 'other'; const err = (res && res.error) || 'tidak ada jawaban';
      ENG.health.gemini = kind; ENG.health.gemini_at = new Date().toISOString();
      if(res && res.stage === 'input' && /login|Sesi/i.test(err)) return {action:'stop', reason:'error', msg:'Sesi login habis. Muat ulang halaman lalu login lagi.'};
      if(kind === 'busy'){
        const w = BUSY_WAIT[tries.busy];
        if(w == null) return {action:'pause', msg:'Gemini penuh terus setelah dicoba beberapa kali. Coba Lanjutkan beberapa saat lagi.'};
        tries.busy++;
        logAct('mesin', 'warn', `Gemini sedang penuh. ${label} dicoba lagi pukul ${clock(Date.now() + w)}.`, {account_id:ENG.curAcc});
        return {action:'retry', wait:w, label:'Gemini penuh, menunggu'};
      }
      if(kind === 'quota'){
        logAct('mesin', 'warn', `Kuota Gemini gratis habis. Dicoba lagi tiap 30 menit (berikutnya ${clock(Date.now() + QUOTA_WAIT)}). Reset harian ${clock(nextResetMs())} WIB.`, {account_id:ENG.curAcc});
        return {action:'retry', wait:QUOTA_WAIT, label:'Kuota Gemini habis, menunggu'};
      }
      if(kind === 'key' || (res && res.stage === 'config')) return {action:'stop', reason:'error', msg:`Masalah API key Gemini: ${err}`};
      if(kind === 'model' && tries.model++ < 1) return {action:'retry', wait:5000, label:'Memperbarui daftar model Gemini'};
      return {...await failJob(job, label, err), ig:usedIg};
    }
    ENG.health.gemini = 'ok'; ENG.health.gemini_at = new Date().toISOString();
    const out = await saveResult(job, res, meta, fetched, acc, label, (Date.now() - t0) / 1000);
    return {...out, ig:usedIg};
  } finally {
    ENG.busyPost = null;
    if(paths.length) sb.storage.from('tmp-media').remove(paths).catch(() => {});
  }
}
async function saveResult(job, res, meta, fetched, acc, label, secs){
  const md = res.md; const m = parseMD(md);
  let series_id = null;
  if(m.series && acc){
    let s = seriesOf(acc.id).find(x => lc(x.name) === lc(m.series));
    if(!s){ const made = await dbInsert('series', {account_id:acc.id, name:m.series}, 'Gagal membuat series'); s = made && made[0]; }
    series_id = s ? s.id : null;
  }
  const firstLine = String(meta && meta.caption || '').split('\n').map(x => x.trim()).find(Boolean) || '';
  const title = m.title || firstLine.slice(0, 80) || 'Tanpa judul';
  const fields = {md_content:md, title, title_slug:m.title_slug || slugify(title).split('-').slice(0, 6).join('-'), tags:m.tags || [], summary:m.inti || null,
    media_type:m.jenis || (meta && meta.type) || null, duration_s:m.duration || (meta && meta.duration ? Math.round(meta.duration) : null), has_visual:!!m.has_visual, visual_notes:m.visual_notes || null,
    risk:computeRisk(md, res.prompt_version), prompt_version:res.prompt_version || null, model:res.model || null, tokens_in:res.tokens_in ?? null, tokens_out:res.tokens_out ?? null,

  if(res.copy_paths && res.copy_paths.length){ fields.video_paths = res.copy_paths; fields.video_bytes = res.bytes || (fetched && fetched.bytes) || null; fields.video_saved_at = new Date().toISOString(); }
  let postId;
  if(job.kind === 'revisi' || job.kind === 'ulang'){
    const p = postById(job.id); if(!p) return {action:'next'};
    const notes = (p.revision_notes || []).map(n => `${n.pos ? `[${n.pos}] ` : ''}${n.text}`).join('; ');
    Object.assign(fields, job.kind === 'revisi'
      ? {check_status:'belum', is_revision_result:true, revision_count:(p.revision_count || 0) + 1, job:null, job_at:null, revision_notes:[], version_note:`Revisi ke-${(p.revision_count || 0) + 1}: ${notes || 'tanpa catatan'}`.slice(0, 500)}
      : {check_status:'belum', is_revision_result:false, job:null, job_at:null, version_note:'Proses ulang dari nol'});
    if(!p.series_id && series_id){ fields.series_id = series_id; fields.part_number = m.part || null; }
    if(meta && meta.post_date && !p.post_date) fields.post_date = meta.post_date;
    if(!await dbUpdate('posts', p.id, fields, 'Gagal menyimpan catatan')) return {action:'pause', msg:'Gagal menyimpan ke database. Cek koneksi internet, lalu klik Lanjutkan.'};
    postId = p.id;
    if(job.kind === 'revisi') ENG.revDone++;
  } else {
    const q = qById(job.id); const url = q ? q.url : '';
    const dup = postByUrl(url);
    if(dup){ postId = dup.id; }
    else {
      const row = {...fields, account_id:acc ? acc.id : null, series_id, part_number:series_id ? (m.part || null) : null, platform:acc ? acc.platform : (isYT(url) ? 'YouTube' : 'Instagram'),
        post_date:(meta && meta.post_date) || igDate(url) || null, original_url:url, ig_code:igCode(url), version_note:'awal', check_status:'belum'};
      if(!row.account_id){
        let yt = S.accounts.find(a => a.platform === row.platform && a.handle === '@' + row.platform.toLowerCase());
        if(!yt){ const made = await dbInsert('accounts', {handle:'@' + row.platform.toLowerCase(), platform:row.platform, watched:false}); yt = made && made[0]; }
        row.account_id = yt ? yt.id : null;
        if(yt && q) await dbUpdate('link_queue', q.id, {account_id:yt.id});
      }
      const made = await dbInsert('posts', row, 'Gagal menyimpan catatan');
      if(!made) return {action:'pause', msg:'Gagal menyimpan ke database. Cek koneksi internet, lalu klik Lanjutkan.'};

  const audio = m.audio && /tidak terdengar/i.test(m.audio) ? ' · audio tidak terdengar' : '';
  logAct('mesin', 'ok', `${label} tersimpan: "${title}"${audio}${job.kind === 'revisi' ? ' · hasil revisi siap dibandingkan' : (postById(postId) && (postById(postId).theme_ids || []).length ? '' : ' · menunggu tema')}.`, {post_id:postId, account_id:acc ? acc.id : null});
  return {action:'next'};
}

   ========================================================= */
let SMART_TXT = '', SMART_SRC = 'satuan', SMART_TARGET = new Set();
function parseSmart(txt){
  const out = []; const seen = new Set();
  String(txt || '').split(/[\s,]+/).map(s => s.trim()).filter(Boolean).forEach(tok => {
    let t = tok.replace(/[.;)]+$/, '');
    if(/^https?:\/\//i.test(t) || /instagram\.com|youtu/i.test(t)){
      if(!/^https?:/i.test(t)) t = 'https://' + t;
      if(isIG(t)){ const code = igCode(t); const url = `https://www.instagram.com/${/\/(reel|reels|tv)\//i.test(t) ? 'reel' : 'p'}/${code}/`; const k = 'ig:' + code; if(!seen.has(k)){ seen.add(k); out.push({kind:'post', url, code, platform:'Instagram'}); } return; }
      if(isYT(t)){ const k = ukey(t); if(!seen.has(k)){ seen.add(k); out.push({kind:'post', url:t, platform:'YouTube'}); } return; }
      const u = igUser(t); if(u && /instagram\.com/i.test(t)){ const k = '@' + u; if(!seen.has(k)){ seen.add(k); out.push({kind:'target', user:u}); } return; }
      out.push({kind:'bad', raw:tok}); return;
    }
    if(/^@/.test(t)){ const u = igUser(t); if(u){ const k = '@' + u; if(!seen.has(k)){ seen.add(k); out.push({kind:'target', user:u}); } return; } }
    if(t.length > 1) out.push({kind:'bad', raw:tok});
  });
  return out.map(x => {
    if(x.kind === 'target'){
      const a = S.accounts.find(a => a.platform === 'Instagram' && lc(a.handle) === '@' + x.user);
      x.acc = a || null;
      x.state = !a ? 'baru' : a.collect_status === 'menunggu' || a.collect_status === 'mengumpulkan' ? 'menunggu' : a.watched ? 'dipantau' : 'jadikan';
    } else if(x.kind === 'post'){
      const p = postByUrl(x.url), q = qByUrl(x.url);
      x.state = p ? 'catatan' : q ? 'antre' : 'baru';
    }
    return x;
  });
}

function geminiStats(){
  const since = lastResetMs();
  const rows = S.usage.filter(u => Date.parse(u.created_at) >= since && u.kind !== 'fps');
  const ok = rows.filter(u => u.ok);
  const byModel = {}; ok.forEach(u => { byModel[u.model] = (byModel[u.model] || 0) + 1; });
  const tokens = ok.reduce((s, u) => s + (u.tokens_total || 0), 0);
  const quota = rows.filter(u => u.kind === 'quota').length;
  const recentBusy = S.usage.some(u => u.kind === 'busy' && Date.now() - Date.parse(u.created_at) < 10 * 60000);
  const limits = S.settings && S.settings.gemini_limits || {};
  const top = Object.entries(byModel).sort((a, b) => b[1] - a[1])[0];
  const topModel = top ? top[0] : Object.keys(limits)[0];
  const lim = topModel && limits[topModel] ? limits[topModel].limit : null;
  return {rows, ok:ok.length, fail:rows.length - ok.length, byModel, tokens, quota, recentBusy, topModel, lim, perNote:ok.length ? Math.round(tokens / ok.length) : 0};
}
function geminiCard(withChart){

  const models = Object.entries(g.byModel).sort((a, b) => b[1] - a[1]);
  let chart = '';
  if(withChart){
    const now = Date.now(); const buckets = Array.from({length:24}, () => ({ok:0, f:0}));
    S.usage.forEach(u => { const h = Math.floor((now - Date.parse(u.created_at)) / 3600e3); if(h >= 0 && h < 24){ const b = buckets[23 - h]; u.ok ? b.ok++ : b.f++; } });
    const max = Math.max(1, ...buckets.map(b => b.ok + b.f));
    chart = `<div class="lbl mt12">24 jam terakhir</div><div class="chart" role="img" aria-label="Grafik panggilan Gemini per jam">${buckets.map(b => `<i style="height:${(b.ok + b.f) / max * 100}%" title="${b.ok} berhasil, ${b.f} gagal" class="${b.f && !b.ok ? 'f' : ''}"></i>`).join('')}</div><div class="chart-x"><span>${clock(now - 23 * 3600e3)}</span><span>sekarang</span></div>`;
  }
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="lbl">Gemini · hari ini</span><span class="xs muted">reset ${clock(nextResetMs())} WIB · ${durTxt(left / 1000)} lagi</span></div>

    <div style="display:flex;flex-direction:column;gap:6px">${bar}</div>
    <div>${models.map(([m, n]) => `<div class="kv" style="border-top:1px solid var(--line2);min-height:36px;align-items:center"><span class="mono xs">${esc(m)}</span><span>${n}</span></div>`).join('')}
      <div class="kv" style="border-top:1px solid var(--line2);min-height:36px;align-items:center"><span>Token terpakai</span><span>${g.tokens >= 1e6 ? (g.tokens / 1e6).toFixed(2).replace('.', ',') + ' jt' : num(g.tokens)}${g.perNote ? ` · ±${num(Math.round(g.perNote / 1000))} rb/catatan` : ''}</span></div></div>

let SEARCH = {q:'', res:null, busy:false};

  if(isWide() && ROUTE.name === 'pustaka'){ const q = new URLSearchParams(ROUTE.q); q.set('c', id); return `#pustaka${ROUTE.parts.length ? '/' + ROUTE.parts.join('/') : ''}?${q}`; }

};
function prow(p, opt = {}){
  const risk = (p.risk || []).filter(r => r !== 'versi_lama' || opt.showOld);
  return `<a class="prow" href="${noteHref(p.id)}">${thumbHtml(p)}<span class="grow">
    <span class="t">${esc(titleOf(p))}</span>
    ${opt.snippet ? `<span class="s" data-snip>${esc(opt.snippet)}</span>` : p.summary ? `<span class="s">${esc(p.summary)}</span>` : ''}
    <span class="m">${statusBadge(p)}${opt.noAcc ? '' : `<span>${esc(handleOf(p.account_id))}</span>·`}<span>${fmtD(p.post_date)}</span>${p.part_number && p.series_id ? `<span>· part ${p.part_number}</span>` : ''}${!(p.theme_ids || []).length ? '<span class="badge cl">menunggu tema</span>' : ''}${p.job ? `<span class="badge warn">${p.job === 'revisi' ? 'antre revisi' : 'antre ulang'}</span>` : ''}${risk.length && opt.risk !== false ? `<span class="tag">${risk.map(r => RISK_LABEL[r]).join(' · ')}</span>` : ''}</span></span></a>`;
}
function filterPosts(q){
  const f = q.get('f'), acc = q.get('acc'), risk = q.get('risk'), copy = q.get('copy');
  const d = todayWIB();
  let list = S.posts.filter(p => {
    if(acc && p.account_id !== acc) return false;
    if(f === 'belum' && p.check_status !== 'belum') return false;
    if(f === 'revisi' && p.check_status !== 'revisi') return false;
    if(f === 'sudah' && p.check_status !== 'sudah') return false;
    if(f === 'hasil' && !(p.is_revision_result && p.check_status === 'belum')) return false;
    if(f === 'tema' && (p.theme_ids || []).length) return false;
    if(f === 'baru' && !(p.processed_at && new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Jakarta'}).format(new Date(p.processed_at)) === d)) return false;
    if(risk && !(p.risk || []).includes(risk)) return false;
    if(copy && !hasCopy(p)) return false;
    return true;
  });
  return list.sort((a, b) => (b.post_date || '').localeCompare(a.post_date || ''));
}

async function setStatus(p, st){
  const patch = {check_status:st, checked_at:st === 'sudah' ? new Date().toISOString() : null};
  if(st !== 'belum') patch.is_revision_result = false;
  if(st === 'sudah'){ patch.risk = (p.risk || []).filter(r => r !== 'cek_laptop'); if(p.job === 'revisi'){ patch.job = null; } patch.revision_notes = []; }
  if(!await dbUpdate('posts', p.id, patch, 'Gagal mengubah status')) return false;
  if(st === 'sudah' && S.settings && S.settings.video_delete_on_check && hasCopy(p)) dropCopy(p);
  logAct('kamu', st === 'sudah' ? 'ok' : st === 'revisi' ? 'warn' : 'info', `"${titleOf(p)}" ditandai ${STATUS[st][0]}.`, {post_id:p.id, account_id:p.account_id});
  return true;
}
async function addRevision(p, pos, text){
  const notes = [...(p.revision_notes || []), {pos:pos || null, text, at:new Date().toISOString()}];
  if(!await dbUpdate('posts', p.id, {revision_notes:notes, check_status:'revisi', is_revision_result:false, checked_at:null}, 'Gagal menyimpan catatan revisi')) return false;
  logAct('kamu', 'warn', `Minta Revisi: "${titleOf(p)}"${pos ? ` di ${pos}` : ''} — ${text.slice(0, 120)}`, {post_id:p.id, account_id:p.account_id});
  return true;
}

async function ensureTheme(path){
  const [tn, sn] = path.split(/\s*(?:>|›)\s*/).map(x => (x || '').trim());
  if(!tn) return null;
  let T = thByName(tn);
  if(T && T.parent_id && !sn) return T.id;
  if(!T){ const r = await dbInsert('themes', {name:tn, parent_id:null}, 'Gagal membuat tema'); T = r && r[0]; if(!T) return null; }
  if(!sn) return T.id;
  let Sb = thByName(sn);
  if(Sb) return Sb.id;
  const r = await dbInsert('themes', {name:sn, parent_id:T.parent_id || T.id}, 'Gagal membuat subtema');
  return r && r[0] ? r[0].id : null;
}

   RUANG CEK — video/carousel diputar di kiri, MD di kanan, sinkron per penanda

const SESI_KEY = 'bambang-sesi';
function getSesi(){ try { return JSON.parse(sessionStorage.getItem(SESI_KEY) || 'null'); } catch(e){ return null; } }
function setSesi(s){ try { if(s) sessionStorage.setItem(SESI_KEY, JSON.stringify(s)); else sessionStorage.removeItem(SESI_KEY); } catch(e){} }
let CEK = null;   // {id, media:[{url,video}], slide, video el}
function cekKeys(e){
  if(ROUTE.name !== 'cek' || !CEK) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
  if(e.key === 'Escape'){ if(typing) document.activeElement.blur(); else $('#cekClose') && $('#cekClose').click(); return; }
  if(typing) return;
  const v = CEK.video;
  if(e.key === ' ' && v){ e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); if(v) v.currentTime = Math.max(0, v.currentTime - 5); else slideGo(-1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); if(v) v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 5); else slideGo(1); }
  else if(e.key === '1'){ e.preventDefault(); $('#cekOk') && $('#cekOk').click(); }
  else if(e.key === '2'){ e.preventDefault(); const i = $('#cekNote'); if(i && i.value.trim()) $('#cekRev').click(); else if(i) i.focus(); }
}
document.addEventListener('keydown', cekKeys);
function curPos(){
  if(!CEK) return '';
  if(CEK.video) return mmss(CEK.video.currentTime);
  if(CEK.media && CEK.media.length > 1) return `Slide ${CEK.slide + 1}`;
  return '';
}
function highlight(){
  const box = $('#cekMd'); if(!box || !CEK) return;
  let el = null;
  if(CEK.video){

    $$('.seg[data-t]', box).forEach(s => { if(+s.dataset.t <= t + 0.3) el = s; });
    const lbl = $('#cekPosLbl'); if(lbl) lbl.textContent = `Apa yang salah? (dicatat di ${mmss(t)})`;
  } else if(CEK.media && CEK.media.length){
    const n = CEK.slide + 1;
    el = $(`.seg[data-slide="${n}"]`, box);
    const lbl = $('#cekPosLbl'); if(lbl) lbl.textContent = `Apa yang salah? (dicatat di Slide ${n})`;

function slideGo(d){
  if(!CEK || !CEK.media) return;

  drawStage(); highlight();
}
function drawStage(){
  const st = $('#stage'); if(!st || !CEK) return;
  const m = CEK.media[CEK.slide];
  CEK.video = null;
  if(!m){ st.innerHTML = 'Tidak ada media'; return; }
  if(m.video){
    st.innerHTML = `<video id="cekVid" src="${esc(m.url)}" playsinline preload="auto"></video>`;
    const v = $('#cekVid'); CEK.video = v;
    v.addEventListener('timeupdate', () => { highlight(); const r = $('#cekRange'); if(r && !r.matches(':active')) r.value = v.currentTime; const c = $('#cekCur'); if(c) c.textContent = mmss(v.currentTime); });
    v.addEventListener('loadedmetadata', () => { const r = $('#cekRange'); if(r) r.max = v.duration || 0; const d = $('#cekDur'); if(d) d.textContent = mmss(v.duration); if(CEK.seek != null){ v.currentTime = CEK.seek; CEK.seek = null; } });
    v.addEventListener('play', () => { const b = $('#cekPlay'); if(b){ b.innerHTML = icon('pause'); b.setAttribute('aria-label', 'Jeda'); } });
    v.addEventListener('pause', () => { const b = $('#cekPlay'); if(b){ b.innerHTML = icon('play'); b.setAttribute('aria-label', 'Putar'); } });
    v.addEventListener('click', () => v.paused ? v.play() : v.pause());
  } else {
    st.innerHTML = `<img src="${esc(m.url)}" alt="Slide ${CEK.slide + 1}">`;
  }
  if(CEK.media.length > 1) st.insertAdjacentHTML('beforeend', `<button class="nav l" aria-label="Slide sebelumnya" data-sl="-1">${icon('back')}</button><button class="nav r" aria-label="Slide berikutnya" data-sl="1">${icon('next')}</button>`);
  $$('[data-sl]', st).forEach(b => b.onclick = e => { e.stopPropagation(); slideGo(+b.dataset.sl); });
  const ctrl = $('#cekCtrl');
  if(ctrl) ctrl.innerHTML = m.video
    ? `<button class="play" id="cekPlay" aria-label="Putar">${icon('play')}</button><span id="cekCur">00:00</span><input type="range" id="cekRange" min="0" max="0" step="0.1" value="0" aria-label="Posisi video"><span id="cekDur">--:--</span>${CEK.media.length > 1 ? `<span>${CEK.slide + 1}/${CEK.media.length}</span>` : ''}`
    : `<span style="flex:1;text-align:center">Slide ${CEK.slide + 1} dari ${CEK.media.length}</span>`;
  const pb = $('#cekPlay'); if(pb) pb.onclick = () => { const v = CEK.video; if(v) v.paused ? v.play() : v.pause(); };
  const rg = $('#cekRange'); if(rg) rg.oninput = () => { if(CEK.video) CEK.video.currentTime = +rg.value; };
}
async function loadMedia(p){

async function refetchVideo(p, msgEl){

    const r = await extCall('ig-fetch', {url:p.original_url, sb:await sbCreds(), thumb:!p.thumb_path}, t => set(t), 180000);
    if(!r.ok) throw new Error(r.error || 'gagal');
    await bumpIg();

    set('Menyimpan salinan…');
    const k = await invokeGemini({action:'keep', storage_paths:r.paths, copy_key:igCode(p.original_url)});
    if(!k || !k.ok) throw new Error((k && k.error) || 'gagal menyimpan salinan');
    const patch = {video_paths:k.copy_paths, video_bytes:r.bytes || null, video_saved_at:new Date().toISOString(), risk:(p.risk || []).filter(x => x !== 'cek_laptop')};
    if(r.thumb_path) patch.thumb_path = r.thumb_path;

}

  const tree = temas();
  return techHead('Atur tema') + `<div class="page mt12"><p class="small muted" style="margin:0;line-height:1.5">Biasanya dikerjakan Katalogis. Subtema berlabel <span class="badge warn">tipis</span> berisi kurang dari 2 catatan: kandidat digabung.</p>
    <div class="btns mt12"><button class="btn light" data-act="th-new">${icon('mulai')} Tema utama baru</button></div></div>
    ${tree.map(t => { const subs = subsOf(t.id); return `<div class="rcard mx mt12" style="padding:6px 0"><div class="row" style="border:0"><span class="grow"><b style="font:700 16px var(--f-title)">${esc(t.name)}</b> <span class="xs muted">${postsInTheme(t.id).length} catatan${t.description ? ' · ' + esc(t.description) : ''}</span></span><button class="btn" data-act="th-edit" data-id="${t.id}">Atur</button><button class="btn icon" data-act="th-new" data-parent="${t.id}" aria-label="Subtema baru">${icon('mulai')}</button></div>
      ${subs.map(s => { const n = postsInTheme(s.id).length; return `<div class="row"><span class="grow" style="padding-left:14px">${esc(s.name)} <span class="xs muted">${n}</span>${n < 2 ? ' <span class="badge warn">tipis</span>' : ''}</span><button class="btn" data-act="th-edit" data-id="${s.id}">Atur</button></div>`; }).join('')}</div>`; }).join('') || '<div class="empty">Belum ada tema.</div>'}`;
}
ACTIONS['th-new'] = b => {
  const parent = b.dataset.parent || null;
  openSheet(`<h3>${parent ? `Subtema baru di ${esc(thById(parent).name)}` : 'Tema utama baru'}</h3><label class="fld"><span>Nama</span><input id="thNm"></label><label class="fld"><span>Deskripsi <em class="help">(opsional)</em></span><input id="thDs"></label><button class="btn pri block" id="thOk">Simpan</button>`, s => {
    $('#thOk', s).onclick = async () => { const name = $('#thNm', s).value.trim(); if(!name) return; if(thByName(name)){ toast('Nama sudah dipakai (nama tema harus unik)'); return; }
      if(await dbInsert('themes', {name, parent_id:parent, description:$('#thDs', s).value.trim() || null})){ sheet.close(); render(true); } };
  });
};
ACTIONS['th-edit'] = b => {
  const t = thById(b.dataset.id); if(!t) return;
  const n = postsInTheme(t.id).length; const hasSubs = subsOf(t.id).length > 0;
  const targets = S.themes.filter(x => x.id !== t.id && (t.parent_id ? true : !x.parent_id)).sort((a, c) => thPath(a).localeCompare(thPath(c), 'id'));
  openSheet(`<h3>${esc(thPath(t))}</h3><p class="xs muted" style="margin:0">${n} catatan</p>
    <label class="fld"><span>Nama</span><input id="teNm" value="${esc(t.name)}"></label>
    <label class="fld"><span>Deskripsi</span><input id="teDs" value="${esc(t.description || '')}"></label>
    ${t.parent_id ? `<label class="fld"><span>Pindah ke tema</span><select id="tePr">${temas().map(x => `<option value="${x.id}" ${x.id === t.parent_id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>` : ''}
    <button class="btn pri block" id="teSave">Simpan</button>
    <hr class="sep"><label class="fld"><span>Gabungkan ke <em class="help">(catatan dipindah, ${t.parent_id ? 'subtema' : 'tema'} ini dihapus)</em></span><select id="teMg"><option value="">— pilih —</option>${targets.map(x => `<option value="${x.id}">${esc(thPath(x))}</option>`).join('')}</select></label>
    <button class="btn block" id="teMerge">Gabungkan</button>
    <button class="btn wout block" id="teDel" ${hasSubs ? 'disabled title="Pindahkan subtemanya dulu"' : ''}>Hapus${n ? ` (${n} catatan kehilangan tema ini)` : ''}</button>`, s => {
    $('#teSave', s).onclick = async () => { const name = $('#teNm', s).value.trim(); const d = thByName(name); if(!name || (d && d.id !== t.id)){ toast('Nama kosong atau sudah dipakai'); return; }
      const patch = {name, description:$('#teDs', s).value.trim() || null}; if($('#tePr', s)) patch.parent_id = $('#tePr', s).value;
      if(await dbUpdate('themes', t.id, patch)){ sheet.close(); render(true); } };
    $('#teMerge', s).onclick = async () => {
      const to = $('#teMg', s).value; if(!to) return;
      const ps = S.posts.filter(p => (p.theme_ids || []).includes(t.id));
      for(const p of ps) await setPostThemes(p.id, [...new Set(p.theme_ids.map(x => x === t.id ? to : x))]);
      for(const sb2 of subsOf(t.id)) await dbUpdate('themes', sb2.id, {parent_id:to});
      await sb.from('package_themes').delete().eq('theme_id', t.id);
      if(await dbDelete('themes', t.id)){ logAct('kamu', 'info', `Tema "${t.name}" digabung ke "${thPath(thById(to))}" (${ps.length} catatan).`); sheet.close(); render(true); }
    };
    $('#teDel', s).onclick = async () => {
      await sb.from('post_themes').delete().eq('theme_id', t.id); await sb.from('package_themes').delete().eq('theme_id', t.id);
      S.posts.forEach(p => { if((p.theme_ids || []).includes(t.id)) p.theme_ids = p.theme_ids.filter(x => x !== t.id); });
      if(await dbDelete('themes', t.id)){ sheet.close(); render(true); }
    };
  });
};

/* ---------- paket / ZIP ---------- */
function paketPage(){
  if(!S.packages){ loadExtra('packages').then(() => { if(ROUTE.name === 'claude') render(true); }); return techHead('Paket / ZIP') + '<div class="empty"><span class="spin"></span></div>'; }
  const pk = S.packages;
  const pkgPosts = k => S.posts.filter(p => { const set = postThemeSet(p); return (!k.theme_ids.length || k.theme_ids.some(id => set.has(id))) && (k.include_unvalidated || p.check_status === 'sudah'); });
  PKG_POSTS = pkgPosts;
  return techHead('Paket / ZIP') + `<div class="page mt12"><p class="small muted" style="margin:0;line-height:1.5">Paket ZIP berisi catatan + indeks tema/kreator/series, siap dibuka di Obsidian atau diunggah ke Claude.</p>
    <div class="btns mt12"><button class="btn light" data-act="zip-all">${icon('down')} Semua catatan (${S.posts.length})</button><button class="btn" data-act="zip-checked">${icon('down')} Hanya Sudah Dicek (${S.posts.filter(p => p.check_status === 'sudah').length})</button><button class="btn" data-act="pkg-edit">${icon('mulai')} Paket baru</button></div></div>
    ${pk.map(k => `<div class="rcard mx mt12" style="padding:16px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b style="font:700 17px var(--f-title)">${esc(k.name)}</b>${k.description ? `<div class="xs muted">${esc(k.description)}</div>` : ''}</div><button class="btn" data-act="pkg-edit" data-id="${k.id}">Atur</button></div>
      <div class="xs muted mt8">${k.theme_ids.map(id => esc(thPath(thById(id)))).join(', ') || 'semua tema'} · ${pkgPosts(k).length} catatan${k.include_unvalidated ? '' : ' (hanya Sudah Dicek)'}</div>
      <button class="btn light mt12" data-act="pkg-zip" data-id="${k.id}">${icon('down')} Export ZIP</button></div>`).join('')}`;
}
let PKG_POSTS = () => [];
ACTIONS['zip-all'] = b => exportZip(S.posts, {name:'Semua Catatan', filter:'semua catatan'}, b);
ACTIONS['zip-checked'] = b => exportZip(S.posts.filter(p => p.check_status === 'sudah'), {name:'Sudah Dicek', filter:'hanya catatan Sudah Dicek'}, b);
ACTIONS['pkg-zip'] = b => { const k = S.packages.find(x => x.id === b.dataset.id); exportZip(PKG_POSTS(k), {name:k.name, description:k.description, filter:`tema ${k.theme_ids.map(t => thPath(thById(t))).join(', ') || 'semua'}`}, b); };
ACTIONS['pkg-edit'] = b => {
  const k = b.dataset.id ? S.packages.find(x => x.id === b.dataset.id) : null;
  const sel = new Set(k ? k.theme_ids : []);
  openSheet(`<h3>${k ? 'Atur paket' : 'Paket baru'}</h3>
    <label class="fld"><span>Nama</span><input id="pkN" value="${esc(k ? k.name : '')}" placeholder="contoh: Bahan ebook tombol"></label>
    <label class="fld"><span>Tujuan <em class="help">(ikut dibaca Claude)</em></span><input id="pkD" value="${esc(k && k.description || '')}"></label>
    <div class="lbl">Tema</div><div style="max-height:36dvh;overflow:auto" id="pkT">${temas().map(t => `<label class="chk" style="font-weight:600"><input type="checkbox" value="${t.id}" ${sel.has(t.id) ? 'checked' : ''}>${esc(t.name)}</label>${subsOf(t.id).map(s => `<label class="chk" style="padding-left:24px"><input type="checkbox" value="${s.id}" ${sel.has(s.id) ? 'checked' : ''}>${esc(s.name)}</label>`).join('')}`).join('')}</div>
    <label class="chk"><input type="checkbox" id="pkU" ${!k || k.include_unvalidated ? 'checked' : ''}>Ikutkan yang belum Sudah Dicek</label>
    <div class="btns">${k ? '<button class="btn wout" id="pkDel">Hapus</button>' : ''}<button class="btn pri grow" id="pkOk">Simpan</button></div>`, s => {
    $('#pkOk', s).onclick = async () => {
      const name = $('#pkN', s).value.trim(); if(!name){ toast('Isi nama'); return; }
      const ids = $$('#pkT input:checked', s).map(i => i.value);
      const rec = {name, description:$('#pkD', s).value.trim() || null, include_unvalidated:$('#pkU', s).checked};
      let pid = k && k.id;
      if(k){ const {error} = await sb.from('packages').update(rec).eq('id', k.id); if(error){ fail('Gagal', error); return; } Object.assign(k, rec); }
      else { const {data, error} = await sb.from('packages').insert(rec).select().single(); if(error){ fail('Gagal', error); return; } pid = data.id; S.packages.push({...data, theme_ids:[]}); }
      await sb.from('package_themes').delete().eq('package_id', pid);
      if(ids.length) await sb.from('package_themes').insert(ids.map(t => ({package_id:pid, theme_id:t})));
      S.packages.find(x => x.id === pid).theme_ids = ids;
      sheet.close(); render(true);
    };
    const d = $('#pkDel', s); if(d) d.onclick = async () => { await sb.from('package_themes').delete().eq('package_id', k.id); await sb.from('packages').delete().eq('id', k.id); S.packages = S.packages.filter(x => x.id !== k.id); sheet.close(); render(true); };
  });
};

/* =========================================================
   MASUK & MULAI
   ========================================================= */
function showAuth(on){ $('#authScreen').hidden = !on; $('#app').hidden = on; }
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('#authBtn'), msg = $('#authMsg');
  btn.disabled = true; btn.textContent = 'Masuk…'; msg.textContent = '';
  const {error} = await sb.auth.signInWithPassword({email:$('#authEmail').value.trim(), password:$('#authPass').value});
  btn.disabled = false; btn.textContent = 'Masuk';
  if(error) msg.textContent = /invalid/i.test(error.message) ? 'Email atau password salah.' : error.message;
};
/* dari menu Bagikan (PWA): ?share=1&u=...&t=... → #share */
(function(){
  const q = new URLSearchParams(location.search);
  if(q.has('share') || q.has('u') || q.has('t')){
    const n = new URLSearchParams(); if(q.get('u')) n.set('u', q.get('u')); if(q.get('t')) n.set('t', [q.get('title'), q.get('t')].filter(Boolean).join(' '));
    history.replaceState(null, '', location.pathname + '#share?' + n.toString());
  }
})();
async function enterApp(session){
  USER = session.user;
  showAuth(false);
  $('#view').innerHTML = '<div class="empty"><span class="spin"></span> Memuat rak…</div>';
  try { await loadAll(); }
  catch(err){ setSync('error', err.message); $('#view').innerHTML = `<div class="empty"><b>Gagal memuat data</b>${esc(err.message)}<br><button class="btn mt12" onclick="location.reload()">Coba lagi</button></div>`; return; }
  BOOTED = true;
  subscribeRealtime();
  render();
  if(EXT.ready) engineBoot();
  else setTimeout(() => { if(!EXT.ready) paintChrome(); }, 1500);
}
sb.auth.onAuthStateChange((event, session) => {
  if(event === 'SIGNED_OUT' || !session){ USER = null; BOOTED = false; S = emptyState(); MD.clear(); if(RT){ sb.removeChannel(RT); RT = null; } ENG.role = 'none'; showAuth(true); return; }
  if((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && (!USER || USER.id !== session.user.id || !BOOTED)) setTimeout(() => enterApp(session), 0);
});
/* muat ulang ringan saat tab kembali dilihat setelah lama (realtime bisa terputus di HP) */
let hiddenAt = 0;
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'hidden'){ hiddenAt = Date.now(); return; }
  if(BOOTED && hiddenAt && Date.now() - hiddenAt > 5 * 60000 && !ENG.on){ try { await loadAll(); subscribeRealtime(); render(true); } catch(e){} }
});

</script>
