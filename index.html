/* =========================================================
   EXTENSION BAMBANG Helper — jembatan lewat window.postMessage
   ========================================================= */
const EXT = {ready:false, version:null, old:false, progress:{}};
const verNum = v => String(v||'0').split('.').map(Number).reduce((s,n,i) => s + (n||0) * [10000,100,1][i], 0);
window.addEventListener('message', e => {
  if(e.source !== window || !e.data || e.data.source !== 'bambang-ext') return;
  if(e.data.type === 'hello'){ EXT.ready = true; EXT.version = e.data.version; EXT.old = verNum(e.data.version) < verNum('0.2.0'); paintExt(); if(S) { renderBerandaLive(); if(view === 'antrian') renderQueuePanel(); } }
  if(e.data.type === 'progress' && EXT.progress[e.data.id]) EXT.progress[e.data.id](e.data.text);
});
function extCall(type, payload, onProgress, timeout = 240000){
  return new Promise((resolve, reject) => {
    const id = uid(); payload = {...payload, progressId:id};
    if(onProgress) EXT.progress[id] = onProgress;
    const done = () => { window.removeEventListener('message', on); clearTimeout(t); delete EXT.progress[id]; };
    const on = e => { if(e.source !== window || !e.data || e.data.source !== 'bambang-ext' || e.data.id !== id || e.data.type === 'progress') return; done(); resolve(e.data); };
    window.addEventListener('message', on);
    const t = setTimeout(() => { done(); reject(new Error(`Extension tidak menjawab (lebih dari ${Math.round(timeout/60000)} menit)`)); }, timeout);
    window.postMessage({source:'bambang-page', id, type, payload}, location.origin);
  });
}
function paintExt(){
  const c = $('#extChip'); if(!c) return;
  if(EXT.ready){ c.className = 'ext on'; c.textContent = EXT.old ? `Extension v${EXT.version} · perlu update` : `Extension v${EXT.version} aktif`; }
  else { c.className = 'ext'; c.textContent = 'Mode pantau'; c.title = 'Extension BAMBANG Helper tidak ada di browser ini. Kamu tetap bisa memantau dan memberi perintah ke mesin di laptop.'; }
}

/* claim = ambil alih baris status mesin (saat mulai). Selain itu hanya memperbarui kalau baris masih milik tab ini,
   supaya tab lama tidak merebut kembali mesin yang sudah dipindah. */
async function pushEngine(force = false, claim = false){
  if(!USER) return;
  if(!force && !claim && Date.now() - ENG.lastPush < 4000) return;
  ENG.lastPush = Date.now();
  const qs = ENG.accId ? queueStats(ENG.accId) : {selesai:0, total:0};
  const row = {owner:USER.id, status: ENG.on ? (ENG.paused ? 'jeda' : 'jalan') : 'mati', account_id:ENG.accId, tab_id:TAB_ID, device:DEVICE,
    current:ENG.current || null, message:ENG.message || null, done:qs.selesai, total:qs.total,
    next_at: ENG.nextAt ? new Date(ENG.nextAt).toISOString() : null, heartbeat_at:new Date().toISOString(), updated_at:new Date().toISOString()};
  S.engine = {...(S.engine || {}), ...row};
  try {
    if(claim){ await sb.from('engine_state').upsert({...row, command:null}, {onConflict:'owner'}); return; }
    const {data, error} = await sb.from('engine_state').update(row).eq('owner', USER.id).eq('tab_id', TAB_ID).select('owner');
    if(!error && data && !data.length && ENG.on){ ENG.stop = true; ENG.stopBy = 'Mesin dipindahkan ke tab/perangkat lain'; }
  } catch(e){}
}
async function refreshEngineState(){
  try { const {data} = await sb.from('engine_state').select('*').maybeSingle(); S.engine = data || null; } catch(e){}
}
function applyCmd(cmd, remote){
  const src = remote ? ' dari perangkat lain' : '';
  if(cmd === 'jeda' && !ENG.paused){ ENG.paused = true; ENG.message = `Dijeda${src}.`; logAct('kamu', 'info', `Mesin dijeda${src}.`, {account_id:ENG.accId}); }
  else if(cmd === 'lanjut' && ENG.paused){ ENG.paused = false; ENG.message = ''; ENG.failStreak = 0; ENG.tries = {}; logAct('kamu', 'info', `Mesin dilanjutkan${src}.`, {account_id:ENG.accId}); }
  else if(cmd === 'stop'){ ENG.stop = true; ENG.paused = false; ENG.stopBy = `Dihentikan${src}`; }
  pushEngine(true); paintEngineBox();
}
async function checkCommand(){
  try {
    const {data, error} = await sb.from('engine_state').select('command,tab_id,status').maybeSingle();
    if(error || !data) return;
    if(data.tab_id && data.tab_id !== TAB_ID){ ENG.stop = true; ENG.stopBy = 'Mesin dipindahkan ke tab/perangkat lain'; return; }
    if(data.command){
      await sb.from('engine_state').update({command:null}).eq('owner', USER.id);
      applyCmd(data.command, true);
    }
  } catch(e){}
}
async function engineControl(cmd){
  if(ENG.on){ applyCmd(cmd, false); return; }
  const ev = engView();
  if(ev.status === 'mati'){ toast('Mesin tidak sedang jalan'); return; }
  if(cmd === 'stop' && !confirm('Hentikan mesin di laptop?')) return;
  const {error} = await sb.from('engine_state').update({command:cmd}).eq('owner', USER.id);
  if(error){ toast('Gagal mengirim perintah: ' + error.message); return; }
  logAct('kamu', 'info', `Perintah "${cmd === 'jeda' ? 'jeda' : cmd === 'lanjut' ? 'lanjutkan' : 'hentikan'}" dikirim ke mesin dari ${DEVICE}.`);
  toast('Perintah terkirim. Berlaku dalam beberapa detik.');
}
async function holdWake(){ try { if('wakeLock' in navigator && document.visibilityState === 'visible' && !ENG.wake) { ENG.wake = await navigator.wakeLock.request('screen'); ENG.wake.addEventListener('release', () => { ENG.wake = null; }); } } catch(e){} }
document.addEventListener('visibilitychange', () => { if(ENG.on) holdWake(); });

async function engineStart(accId){
  if(ENG.on){ toast('Mesin sudah jalan'); return; }
  const a = accById(accId); if(!a) return;
  if(!canRunHere(accId)){ toast(EXT.old ? 'Update extension ke v0.2 dulu' : 'Mesin butuh extension BAMBANG Helper di Chrome laptop'); return; }
  await refreshEngineState();
  const e = S.engine;
  if(e && e.status !== 'mati' && e.tab_id !== TAB_ID && e.heartbeat_at && Date.now() - Date.parse(e.heartbeat_at) < 150000){
    if(!confirm(`Mesin sepertinya sedang jalan di ${e.device || 'perangkat lain'}. Pindahkan ke tab ini? Mesin yang lama akan berhenti sendiri.`)) return;
  }
  const qs = queueStats(accId);
  const re = S.posts.filter(p => p.account_id === accId && p.reprocess).length;
  if(!qs.antri && !re){ toast('Tidak ada link yang perlu diproses'); return; }
  Object.assign(ENG, {on:true, paused:false, stop:false, stopBy:'', accId, current:'Menyiapkan…', message:'', nextAt:null, busy:false, saved:0, failed:0, failStreak:0, tries:{}, skipRe:new Set()});
  const run = {id:uid(), account_id:accId, started_at:new Date().toISOString(), ended_at:null, reason:'selesai', count:0, notes:'Mesin otomatis'};
  S.runs.push(run); ENG.runId = run.id; save();
  holdWake();
  await pushEngine(true, true);
  logAct('mesin', 'info', `Mesin mulai memproses ${a.handle}: ${qs.antri} link antri${re ? `, ${re} proses ulang` : ''}.`, {account_id:accId});
  updateCounts(); renderBerandaLive(); if(view === 'antrian') renderQueuePanel();
  engineLoop();
}
function nextJob(accId){
  const re = S.posts.find(p => p.account_id === accId && p.reprocess && !ENG.skipRe.has(p.id));
  if(re) return {kind:'re', id:re.id, key:'re:' + re.id};
  const q = queueStats(accId).next;
  return q ? {kind:'q', id:q.id, key:'q:' + q.id} : null;
}
async function waitFor(ms, label){
  ENG.nextAt = Date.now() + ms; ENG.current = label; pushEngine(true); paintEngineBox();
  let lastCmd = Date.now(), lastBeat = Date.now();
  while(Date.now() < ENG.nextAt && !ENG.stop){
    await sleep(1000);
    if(Date.now() - lastCmd > 5000){ lastCmd = Date.now(); await checkCommand(); if(ENG.paused || ENG.stop) break; }
    if(Date.now() - lastBeat > 20000){ lastBeat = Date.now(); pushEngine(true); }
  }
  ENG.nextAt = null;
}
async function engineLoop(){
  let reason = 'selesai', note = '';
  try {
    while(!ENG.stop){
      await checkCommand();
      if(ENG.stop) break;
      if(ENG.paused){
        ENG.current = 'Dijeda'; pushEngine(true); paintEngineBox();
        let n = 0;
        while(ENG.paused && !ENG.stop){ await sleep(2000); n++; if(n % 3 === 0) await checkCommand(); if(n % 10 === 0) pushEngine(true); }
        continue;
      }
      const job = nextJob(ENG.accId);
      if(!job){ note = 'Antrian habis'; break; }
      const res = await processJob(job);
      paintEngineBox(); renderBerandaLive(); updateCounts();
      if(res.action === 'stop'){ reason = res.reason || 'error'; note = res.msg; logAct('mesin', 'error', res.msg, {account_id:ENG.accId}); break; }
      if(res.action === 'pause'){ ENG.paused = true; ENG.message = res.msg; logAct('mesin', 'warn', `Mesin dijeda: ${res.msg}`, {account_id:ENG.accId}); continue; }
      if(res.action === 'retry'){ await waitFor(res.wait, res.label || 'Menunggu sebelum mencoba lagi'); continue; }
      if(ENG.stop) break;
      if(nextJob(ENG.accId)) await waitFor(rand(GAP[0], GAP[1]), 'Jeda aman sebelum link berikutnya');
    }
  } catch(e){ reason = 'error'; note = `Error tak terduga: ${e.message || e}`; console.error(e); logAct('mesin', 'error', note, {account_id:ENG.accId}); }
  await engineFinish(reason, note || ENG.stopBy || 'Dihentikan');
}
async function engineFinish(reason, note){
  const a = accById(ENG.accId);
  const run = S.runs.find(r => r.id === ENG.runId);
  if(run) Object.assign(run, {ended_at:new Date().toISOString(), reason, count:ENG.saved, notes:`Mesin otomatis · ${note}${ENG.failed ? ` · ${ENG.failed} gagal` : ''}`});
  await save();
  const msg = `${note}. ${ENG.saved} catatan baru${ENG.failed ? `, ${ENG.failed} link gagal` : ''}.`;
  if(!/pindah/i.test(note)) logAct('mesin', reason === 'error' ? 'error' : 'info', `Mesin berhenti (${a ? a.handle : '?'}): ${msg}`, {account_id:ENG.accId});
  const moved = /pindah/i.test(note);
  Object.assign(ENG, {on:false, paused:false, busy:false, nextAt:null, current:'', message:msg});
  try { if(ENG.wake) await ENG.wake.release(); } catch(e){}
  if(!moved) await pushEngine(true);
  else await refreshEngineState();
  paintEngineBox(); renderBerandaLive(); updateCounts(); if(view === 'antrian') renderQueuePanel(); if(view === 'log') renderLog();
}

async function invokeGemini(body){
  try {
    const {data, error} = await sb.functions.invoke('gemini-read', {body});
    if(error){
      let d = null; try { d = await error.context.json(); } catch(_){}
      const st = error.context && error.context.status;
      return d && d.error ? d : {ok:false, stage:'server', kind: (!st || st >= 500) ? 'busy' : 'other', error: `${error.message}${st ? ` (HTTP ${st})` : ''}`};
    }
    return data;
  } catch(e){ return {ok:false, stage:'server', kind:'busy', error:e.message || String(e)}; }
}
function markQueue(job, status, note){
  if(job.kind !== 'q') { ENG.skipRe.add(job.id); return; }
  const q = S.queue.find(x => x.id === job.id); if(q) Object.assign(q, {status, note: note || null});
}
async function failJob(job, label, why){
  ENG.failed++; ENG.failStreak++;
  markQueue(job, 'gagal', why.slice(0, 200));
  await save();
  logAct('mesin', 'error', `${label} gagal: ${why}`, {account_id:ENG.accId});
  if(ENG.failStreak >= 3) return {action:'pause', msg:'3 link berturut-turut gagal. Kemungkinan ada masalah umum (login Instagram, koneksi, atau Gemini). Cek pesan di Aktivitas, lalu klik Lanjutkan.'};
  return {action:'next'};
}
async function processJob(job){
  const acc = accById(ENG.accId);
  const post0 = job.kind === 're' ? postById(job.id) : null;
  const q0 = job.kind === 'q' ? S.queue.find(x => x.id === job.id) : null;
  if(!post0 && !q0) return {action:'next'};
  const url = post0 ? post0.original_url : q0.url;
  const dTxt = igDate(url) ? ` (${fmtD(igDate(url))})` : '';
  const label = post0 ? `Proses ulang "${post0.title}"` : `#${q0.position}${dTxt}`;
  const tries = ENG.tries[job.key] = ENG.tries[job.key] || {busy:0, other:0, model:0};
  const t0 = Date.now();
  ENG.busy = true;
  let paths = [];
  try {
    const {data:{session}} = await sb.auth.getSession();
    if(!session) return {action:'stop', reason:'error', msg:'Sesi login habis. Muat ulang halaman lalu login lagi.'};
    let body = {source_url:url}, meta = null;
    if(isIG(url)){
      if(!EXT.ready) return {action:'pause', msg:'Extension BAMBANG Helper tidak terdeteksi. Pastikan terpasang dan aktif, muat ulang halaman ini, lalu klik Lanjutkan.'};
      setNow(`${label} · mengambil dari Instagram…`);
      let r;
      try { r = await extCall('ig-fetch', {url, sb:{url:SB_URL, key:SB_KEY, token:session.access_token, uid:session.user.id}}, t => setNow(`${label} · ${t}`), 180000); }
      catch(e){ r = {ok:false, error:e.message}; }
      if(!r.ok){
        const err = r.error || 'tidak ada keterangan';
        if(/login/i.test(err)) return {action:'pause', msg:'Instagram minta login. Buka instagram.com di Chrome ini, login, lalu klik Lanjutkan.'};
        if(/membatasi|terlalu cepat|HTTP 429|wait a few/i.test(err)){ logAct('mesin', 'warn', `Instagram meminta jeda. Mesin menunggu 15 menit (sampai ${clock(Date.now() + IG_LIMIT_WAIT)}).`, {account_id:ENG.accId}); return {action:'retry', wait:IG_LIMIT_WAIT, label:'Instagram meminta jeda'}; }
        if(/diperbarui|tidak menjawab|Muat ulang/i.test(err)) return {action:'pause', msg:`Extension bermasalah: ${err}`};
        if(/dihapus|tidak ditemukan|kosong|private|bukan link|tidak punya file/i.test(err)) return await failJob(job, label, err);
        if(++tries.other < 2){ logAct('mesin', 'warn', `${label}: ${err}. Dicoba lagi 1 menit lagi.`, {account_id:ENG.accId}); return {action:'retry', wait:60000, label:'Mencoba lagi link yang sama'}; }
        return await failJob(job, label, err);
      }
      meta = r.meta; paths = r.paths || [];
      body = {...body, storage_paths:paths, kreator:meta.username || acc.handle, platform:'Instagram', caption:meta.caption || ''};
    } else if(isYT(url)){
      body = {...body, youtube_url:url, kreator:acc.handle, platform:'YouTube', caption:''};
    } else {
      return await failJob(job, label, 'platform ini belum didukung mesin (baru Instagram & YouTube)');
    }
    const ser = post0 && post0.series_id ? serById(post0.series_id) : null;
    if(ser){ body.series = ser.name; if(post0.part_number) body.part = post0.part_number; }
    setNow(`${label} · Gemini sedang membaca…`);
    const res = await invokeGemini(body);
    paths = []; // server menghapus file titipan setelah membacanya
    if(!res || !res.ok){
      const kind = res && res.kind || 'other'; const err = (res && res.error) || 'tidak ada jawaban';
      if(res && res.stage === 'input' && /login|Sesi/i.test(err)) return {action:'stop', reason:'error', msg:'Sesi login habis. Muat ulang halaman lalu login lagi.'};
      if(kind === 'busy'){
        const w = BUSY_WAIT[tries.busy];
        if(w == null) return {action:'pause', msg:'Gemini penuh terus setelah dicoba beberapa kali. Coba Lanjutkan beberapa saat lagi.'};
        tries.busy++;
        logAct('mesin', 'warn', `Gemini sedang penuh. ${label} dicoba lagi pukul ${clock(Date.now() + w)}.`, {account_id:ENG.accId});
        return {action:'retry', wait:w, label:'Gemini penuh, menunggu'};
      }
      if(kind === 'quota'){
        logAct('mesin', 'warn', `Kuota Gemini gratis habis. Mesin mencoba lagi tiap 30 menit (berikutnya pukul ${clock(Date.now() + QUOTA_WAIT)}). Biasanya pulih sekitar jam 14.00–15.00 WIB.`, {account_id:ENG.accId});
        return {action:'retry', wait:QUOTA_WAIT, label:'Kuota Gemini habis, menunggu'};
      }
      if(kind === 'key' || (res && res.stage === 'config')) return {action:'stop', reason:'error', msg:`Masalah API key Gemini: ${err}`};
      if(kind === 'model' && tries.model++ < 1) return {action:'retry', wait:5000, label:'Memperbarui daftar model Gemini'};
      return await failJob(job, label, err);
    }
    return await saveResult(job, res, meta, label, (Date.now() - t0) / 1000);
  } finally {
    ENG.busy = false;
    if(paths.length) sb.storage.from('tmp-media').remove(paths).catch(() => {});
  }
}
async function saveResult(job, res, meta, label, secs){
  const acc = accById(ENG.accId);
  const md = res.md; const m = parseMD(md);
  let series_id = null;
  if(m.series){
    let s = seriesOf(acc.id).find(x => lc(x.name) === lc(m.series));
    if(!s){ s = {id:uid(), account_id:acc.id, name:m.series, description:''}; S.series.push(s); }
    series_id = s.id;
  }
  const firstLine = String(meta && meta.caption || '').split('\n').map(x => x.trim()).find(Boolean) || '';
  const title = m.title || firstLine.slice(0, 80) || 'Tanpa judul';
  const title_slug = m.title_slug || slugify(title).split('-').slice(0,6).join('-');
  let postId;
  if(job.kind === 're'){
    const p = postById(job.id); if(!p) return {action:'next'};
    Object.assign(p, {md_content:md, title, title_slug, tags:m.tags || p.tags, has_visual:!!m.has_visual, visual_notes:m.visual_notes || '', processed_at:new Date().toISOString(), reprocess:false, validated:false});
    if(!p.series_id && series_id){ p.series_id = series_id; p.part_number = m.part || null; }
    if(meta && meta.post_date && !p.post_date) p.post_date = meta.post_date;
    postId = p.id;
  } else {
    const q = S.queue.find(x => x.id === job.id);
    const url = q ? q.url : '';
    const dup = postByUrl(url);
    if(dup) postId = dup.id;
    else {
      postId = uid();
      S.posts.push({id:postId, account_id:acc.id, series_id, part_number: series_id ? (m.part || null) : null, platform:acc.platform,
        post_date:(meta && meta.post_date) || igDate(url) || null, processed_at:new Date().toISOString(), original_url:url, title, title_slug,
        tags:m.tags || [], theme_ids:[], has_visual:!!m.has_visual, visual_notes:m.visual_notes || '', md_content:md, validated:false, reprocess:false});
    }
    if(q) Object.assign(q, {status:'selesai', post_id:postId, note:null});
  }
  const ok = await save();
  if(!ok) return {action:'pause', msg:'Gagal menyimpan ke database. Cek koneksi internet, lalu klik Lanjutkan.'};
  ENG.saved++; ENG.failStreak = 0; ENG.durs.push(secs);
  const run = S.runs.find(r => r.id === ENG.runId); if(run){ run.count = ENG.saved; save(); }
  const p = postById(postId);
  const audio = m.audio && /tidak terdengar/i.test(m.audio) ? ' · audio tidak terdengar' : '';
  const themed = p && (p.theme_ids||[]).length;
  logAct('mesin', 'ok', `${label} tersimpan: "${title}"${audio}. ${job.kind === 're' ? (themed ? 'Catatan lama diganti, tema lama dipertahankan.' : 'Catatan lama diganti, menunggu tema.') : 'Menunggu tema.'}`, {post_id:postId, account_id:acc.id});
  return {action:'next'};
}

async function logAct(actor, level, text, extra = {}){
  if(!USER) return;
  const row = {actor, level, text:String(text).slice(0, 600), account_id: extra.account_id && accById(extra.account_id) ? extra.account_id : null, post_id: extra.post_id || null};
  try {

    if(error && row.post_id){ row.post_id = null; ({data, error} = await sb.from('activity').insert(row).select().single()); }
    if(!error && data) addActivity(data);
  } catch(e){}
}
function addActivity(r){
  if(!S || S.activity.some(x => x.id === r.id)) return;
  S.activity.unshift(r);
  S.activity.sort((a,b) => String(b.created_at).localeCompare(String(a.created_at)));
  if(S.activity.length > 200) S.activity.length = 200;
  renderFeed();
}

const emptyState = () => ({accounts:[], series:[], themes:[], posts:[], packages:[], runs:[], queue:[], activity:[], engine:null});
const isoTs = v => v ? new Date(v).toISOString() : null;

/* bentuk data aplikasi → baris tabel database */
function rowsOf(st){
  const t = {};
  t.accounts = st.accounts.map(a => ({id:a.id, handle:a.handle, platform:a.platform, profile_url:a.profile_url||null}));
  t.series = st.series.map(s => ({id:s.id, account_id:s.account_id, name:s.name, description:s.description||null}));
  t.themes = st.themes.map(x => ({id:x.id, name:x.name, parent_id:x.parent_id||null, description:x.description||null}));
  t.posts = st.posts.map(p => ({id:p.id, account_id:p.account_id, series_id:p.series_id||null, part_number:p.part_number||null, platform:p.platform,
    original_url:p.original_url, post_date:p.post_date||null, processed_at:isoTs(p.processed_at), title:p.title||'', title_slug:p.title_slug||null,
    tags:p.tags||[], md_content:p.md_content, has_visual:!!p.has_visual, visual_notes:p.visual_notes||null, validated:!!p.validated, reprocess:!!p.reprocess}));
  t.packages = st.packages.map(k => ({id:k.id, name:k.name, description:k.description||null, include_unvalidated:!!k.include_unvalidated}));
  t.run_logs = st.runs.map(r => ({id:r.id, account_id:r.account_id, started_at:isoTs(r.started_at), ended_at:isoTs(r.ended_at), stopped_reason:r.reason, posts_processed:r.count||0, notes:r.notes||null}));
  const postIds = new Set(st.posts.map(p => p.id));
  t.link_queue = st.queue.map(q => ({id:q.id, account_id:q.account_id, url:q.url, position:q.position, pinned:!!q.pinned, status:q.status, note:q.note||null, post_id: q.post_id && postIds.has(q.post_id) ? q.post_id : null}));
  t.post_themes = []; st.posts.forEach(p => (p.theme_ids||[]).forEach(th => t.post_themes.push({post_id:p.id, theme_id:th})));
  t.package_themes = []; st.packages.forEach(k => (k.theme_ids||[]).forEach(th => t.package_themes.push({package_id:k.id, theme_id:th})));
  return t;
}
const keyOf = (table, r) => table === 'post_themes' ? r.post_id+'|'+r.theme_id : table === 'package_themes' ? r.package_id+'|'+r.theme_id : r.id;
function snapshot(rows){ const s = {}; for(const [tb, arr] of Object.entries(rows)){ s[tb] = new Map(arr.map(r => [keyOf(tb,r), JSON.stringify(r)])); } return s; }
let LAST = null;

async function fetchAll(table, order){
  const out = []; const step = 1000;
  for(let from = 0; ; from += step){
    let q = sb.from(table).select('*').range(from, from + step - 1);
    if(order) q = q.order(order, {ascending:true});
    const {data, error} = await q; if(error) throw error;
    out.push(...data); if(data.length < step) break;
  }
  return out;
}
async function loadAll(){
  setSync('loading');
  const [acc, ser, th, po, pt, pk, pkt, rl, lq, act, eng] = await Promise.all([
    fetchAll('accounts','created_at'), fetchAll('series','created_at'), fetchAll('themes','created_at'), fetchAll('posts','processed_at'),
    fetchAll('post_themes'), fetchAll('packages','created_at'), fetchAll('package_themes'), fetchAll('run_logs','started_at'), fetchAll('link_queue','position'),
    sb.from('activity').select('*').order('created_at', {ascending:false}).limit(120),
    sb.from('engine_state').select('*').maybeSingle()]);
  const s = emptyState();

  s.series = ser.map(x => ({id:x.id, account_id:x.account_id, name:x.name, description:x.description||''}));
  s.themes = th.map(x => ({id:x.id, name:x.name, parent_id:x.parent_id||null, description:x.description||''}));
  const ptBy = {}; pt.forEach(r => (ptBy[r.post_id] = ptBy[r.post_id] || []).push(r.theme_id));
  s.posts = po.map(p => ({id:p.id, account_id:p.account_id, series_id:p.series_id||null, part_number:p.part_number||null, platform:p.platform,
    original_url:p.original_url, post_date:p.post_date||'', processed_at:isoTs(p.processed_at), title:p.title||'', title_slug:p.title_slug||'',
    tags:p.tags||[], md_content:p.md_content||'', has_visual:!!p.has_visual, visual_notes:p.visual_notes||'', validated:!!p.validated, reprocess:!!p.reprocess,
    theme_ids: ptBy[p.id] || []}));
  const pkBy = {}; pkt.forEach(r => (pkBy[r.package_id] = pkBy[r.package_id] || []).push(r.theme_id));
  s.packages = pk.map(k => ({id:k.id, name:k.name, description:k.description||'', include_unvalidated:!!k.include_unvalidated, theme_ids: pkBy[k.id] || []}));
  s.runs = rl.map(r => ({id:r.id, account_id:r.account_id, started_at:isoTs(r.started_at), ended_at:isoTs(r.ended_at), reason:r.stopped_reason||'selesai', count:r.posts_processed||0, notes:r.notes||''}));
  s.queue = lq.map(q => ({id:q.id, account_id:q.account_id, url:q.url, position:q.position, pinned:!!q.pinned, status:q.status||'antri', note:q.note||null, post_id:q.post_id||null}));
  s.activity = act.error ? (S ? S.activity : []) : (act.data || []);
  s.engine = eng.error ? (S ? S.engine : null) : (eng.data || null);
  if(ENG.on && s.engine) s.engine = {...s.engine, tab_id:TAB_ID};

  LAST = snapshot(rowsOf(S));
  setSync('ok');

/* bandingkan data sekarang dengan yang terakhir tersimpan, kirim bedanya saja */
async function doSync(){
  if(!USER || !LAST) return true;
  const cur = rowsOf(S); const plan = {};
  for(const [tb, arr] of Object.entries(cur)){
    const prev = LAST[tb] || new Map(); const now = new Map(arr.map(r => [keyOf(tb,r), r]));
    plan[tb] = {up: arr.filter(r => prev.get(keyOf(tb,r)) !== JSON.stringify(r)), del: [...prev.keys()].filter(k => !now.has(k))};
  }
  const dirty = Object.values(plan).some(p => p.up.length || p.del.length);
  if(!dirty){ setSync('ok'); return true; }
  setSync('saving');
  const chk = ({error}) => { if(error) throw error; };
  const up = async (tb, rows, conflict='id') => { for(let i = 0; i < rows.length; i += 200) chk(await sb.from(tb).upsert(rows.slice(i, i+200), {onConflict:conflict})); };
  const delIds = async (tb, ids) => { for(let i = 0; i < ids.length; i += 200) chk(await sb.from(tb).delete().in('id', ids.slice(i, i+200))); };
  const delPairs = async (tb, col, keys) => { const by = {}; keys.forEach(k => { const [a,b] = k.split('|'); (by[a] = by[a] || []).push(b); }); for(const [a, bs] of Object.entries(by)) chk(await sb.from(tb).delete().eq(col, a).in('theme_id', bs)); };
  try {
    await delIds('link_queue', plan.link_queue.del);
    await up('accounts', plan.accounts.up);
    await up('series', plan.series.up);
    await up('themes', plan.themes.up.filter(r => !r.parent_id));
    await up('themes', plan.themes.up.filter(r => r.parent_id));
    await up('posts', plan.posts.up);
    await up('link_queue', plan.link_queue.up);
    await up('packages', plan.packages.up);
    await up('run_logs', plan.run_logs.up);
    await delPairs('post_themes', 'post_id', plan.post_themes.del);
    await delPairs('package_themes', 'package_id', plan.package_themes.del);
    if(plan.post_themes.up.length) await up('post_themes', plan.post_themes.up, 'post_id,theme_id');
    if(plan.package_themes.up.length) await up('package_themes', plan.package_themes.up, 'package_id,theme_id');
    await delIds('posts', plan.posts.del);
    await delIds('run_logs', plan.run_logs.del);
    await delIds('packages', plan.packages.del);
    const thDel = plan.themes.del; const prevTh = LAST.themes;
    const wasSub = id => { try { return !!JSON.parse(prevTh.get(id)).parent_id; } catch(e){ return false; } };
    await delIds('themes', thDel.filter(wasSub));
    await delIds('themes', thDel.filter(id => !wasSub(id)));
    await delIds('series', plan.series.del);
    await delIds('accounts', plan.accounts.del);
    LAST = snapshot(cur);
    setSync('ok');
    return true;
  } catch(err){
    console.error(err);
    setSync('error', err.message || String(err));
    return false;
  }
}
let syncChain = Promise.resolve(true);
function save(){
  updateCounts(); paintPill();
  syncChain = syncChain.then(doSync, doSync);
  return syncChain;
}
let SYNC_STATE = 'ok';
function setSync(state, msg=''){
  SYNC_STATE = state;
  const el = $('#syncPill'); if(!el) return;
  el.dataset.state = state;
  el.innerHTML = {loading:'Memuat…', saving:'Menyimpan…', ok:'Tersimpan di cloud', error:'Gagal menyimpan · <button type="button" class="link-btn" id="syncRetry">coba lagi</button>'}[state];
  el.title = msg;
  if(state === 'error'){ $('#syncRetry').onclick = () => save(); toast('Gagal menyimpan ke database: ' + (msg || 'cek koneksi internet')); }
}

/* ---------- realtime: perubahan dari perangkat lain langsung tampil ---------- */
let RT = null, reloadT = null;
function scheduleReload(delay = 2500){
  clearTimeout(reloadT);
  reloadT = setTimeout(async () => {
    if(!USER) return;
    if(SYNC_STATE !== 'ok' || ENG.busy){ scheduleReload(3000); return; }
    try { await loadAll(); } catch(e){ setSync('error', e.message); return; }
    updateCounts(); paintPill(); safeRerender();
  }, delay);
}
function subscribeRealtime(){
  if(RT) sb.removeChannel(RT);
  RT = sb.channel('bambang-' + TAB_ID)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'activity'}, p => { if(p.new) addActivity(p.new); })
    .on('postgres_changes', {event:'*', schema:'public', table:'engine_state'}, p => {
      if(!p.new || !p.new.owner || !S) return;
      if(ENG.on && p.new.tab_id !== TAB_ID) { ENG.stop = true; ENG.stopBy = 'Mesin dipindahkan ke tab/perangkat lain'; }
      if(!ENG.on) S.engine = p.new;
      paintEngineBox(); if(view === 'beranda') renderAccList();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'link_queue'}, () => scheduleReload())
    .on('postgres_changes', {event:'*', schema:'public', table:'posts'}, () => scheduleReload())
    .on('postgres_changes', {event:'*', schema:'public', table:'post_themes'}, () => scheduleReload())
    .subscribe();
}

});
