<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAMBANG — Demo</title>
<meta name="description" content="BAMBANG (Bot Analisis Materi Belajar, Awam Nan Gamblang) — versi demo dengan data contoh lokal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --sunk:#ebe7df; --ink:#1c1a17; --ink-2:#48443d; --muted:#777166;
  --line:#e2ddd3; --line-2:#cfc8bc;
  --accent:#b5441b; --accent-h:#9c3913; --accent-soft:#f7e4da;
  --ok:#2d7a4b; --ok-soft:#e0f0e5; --warn:#935f00; --warn-soft:#fbeed2; --bad:#b42318; --bad-soft:#fbe2de;
  --r:12px; --r-sm:7px;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{padding:20px 0 14px;display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand h1{font:800 30px/1 var(--f-display);letter-spacing:-.025em;margin:0;display:flex;align-items:center;gap:10px}
.brand h1 i{width:11px;height:11px;background:var(--accent);border-radius:2px;display:inline-block;transform:rotate(45deg);flex:none}
.brand p{margin:7px 0 0;color:var(--muted);font-size:12.5px}
.pill-demo{font:500 10.5px/1 var(--f-mono);background:var(--warn-soft);color:var(--warn);padding:5px 8px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase;align-self:center}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proj{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 4px 4px 10px}
.proj span{font-size:12px;color:var(--muted)}
.proj select{border:0;background:var(--sunk);border-radius:5px;padding:5px 8px;font-weight:600;max-width:190px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(243,241,236,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:12px 11px 11px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font:500 11px/1 var(--f-mono);background:var(--sunk);padding:3px 6px;border-radius:99px;color:var(--ink-2)}
.tab .cnt.hot{background:var(--bad-soft);color:var(--bad)}
.session{display:none;align-items:center;gap:8px;font-size:12.5px;background:var(--ink);color:#fff;border-radius:99px;padding:4px 4px 4px 12px;white-space:nowrap;flex:none}
.session.on{display:flex}
.session b{font-weight:600}
.session .pulse{width:7px;height:7px;border-radius:50%;background:#5fd38d;box-shadow:0 0 0 0 rgba(95,211,141,.6);animation:pulse 1.8s infinite}
.session button{border:0;background:#fff;color:var(--ink);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(95,211,141,0)}100%{box-shadow:0 0 0 0 rgba(95,211,141,0)}}
@media (prefers-reduced-motion:reduce){.session .pulse{animation:none}html{scroll-behavior:auto}}

main{padding:22px 0 80px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{font:700 23px/1.15 var(--f-display);margin:0;letter-spacing:-.015em}
.vh p{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}

/* buttons */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:#e8b9b3}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{appearance:none;border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px}
.link-btn:hover{text-decoration:underline}

/* stat line */
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:-4px 0 18px}
.stats b{font:600 15px var(--f-mono);color:var(--ink);margin-right:4px}
.stats .hot b{color:var(--bad)}

/* account cards */
.acc-list{display:grid;gap:12px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.acc-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px 12px}
.acc-h h3{margin:3px 0 0;font:700 18px/1.2 var(--f-display);letter-spacing:-.01em}
.acc-h h3 a{text-decoration:none}
.acc-h h3 a:hover{text-decoration:underline}
.acc-actions{display:flex;gap:6px;flex:none}
.plat{font:500 11px/1 var(--f-mono);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em}
.plat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc,#999)}
.prog{margin:0 16px;padding:11px 12px;background:var(--sunk);border-radius:var(--r-sm);display:grid;gap:3px}
.prog-main{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.prog-main .k{color:var(--muted);font-size:12.5px}
.prog-main a{font-size:12.5px;color:var(--accent)}
.prog-meta{font-size:12.5px;color:var(--muted)}
.prog-meta .hot{color:var(--bad);font-weight:600}
.series{padding:12px 16px 14px}
.series-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.series-h span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.s-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.s-row:first-of-type{border-top:0}
.s-name{appearance:none;border:0;background:none;padding:0;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.s-name:hover{color:var(--accent)}
.s-desc{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{font:500 11.5px/1 var(--f-mono);min-width:26px;height:24px;display:inline-grid;place-items:center;border-radius:5px;background:var(--ok-soft);color:var(--ok);padding:0 6px}
.chip.miss{background:transparent;border:1.5px dashed var(--bad);color:var(--bad)}
.chip-note{font-size:12px;color:var(--bad);margin-left:4px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* empty */
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.4)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* process steps */
.steps{display:grid;gap:14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:44px 1fr;overflow:hidden}
.step-n{background:var(--sunk);display:flex;justify-content:center;padding-top:16px;font:800 18px/1 var(--f-display);color:var(--ink-2)}
.step-b{padding:15px 16px 16px;min-width:0}
.step-b h3{margin:0;font:700 17px/1.25 var(--f-display)}
.step-b > p.hint{margin:4px 0 12px;color:var(--muted);font-size:13px}
.step.quiet .step-b{padding-bottom:14px}
.snap{display:grid;gap:6px;background:var(--sunk);border-radius:var(--r-sm);padding:11px 12px;font-size:13.5px;margin:12px 0}
.snap div{display:flex;gap:8px;flex-wrap:wrap}
.snap .k{color:var(--muted);min-width:128px}
.snap .hot{color:var(--bad);font-weight:600}
.prompt-box{position:relative;margin-top:10px}
.prompt-box pre{margin:0;background:#1f1d1a;color:#ece6da;border-radius:var(--r-sm);padding:14px 14px 16px;font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.prompt-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 12;min-width:0}
.f.c6{grid-column:span 6}.f.c4{grid-column:span 4}.f.c8{grid-column:span 8}.f.c3{grid-column:span 3}
.f > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f > span em{font-style:normal;font-weight:400;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:8px 10px;font-size:14px}
.f textarea{font:13px/1.55 var(--f-mono);resize:vertical;min-height:210px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f .err{color:var(--bad);font-size:12.5px}
.inline-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.inline-f input{border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;font-size:13px;min-width:180px;flex:1}
.detect{grid-column:span 12;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:#fbfaf7}
.detect-h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.detect-h b{font-size:13px}
.detect-h small{color:var(--muted);font-size:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.fname{font:500 12.5px var(--f-mono);background:var(--sunk);padding:8px 10px;border-radius:6px;word-break:break-all}
.warnbox{grid-column:span 12;border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:#5f3f00;display:none}
.warnbox.on{display:block}
.warnbox.bad{background:var(--bad-soft);color:#7a1a12}
.form-foot{grid-column:span 12;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* results */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-bottom:12px}
.filters .f > span{font-size:11.5px}
.filters .f input,.filters .f select{padding:7px 9px;font-size:13.5px}
.f.search{grid-column:span 12}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 8px;flex-wrap:wrap;font-size:13px}
.toolbar label{display:flex;align-items:center;gap:7px;cursor:pointer}
.toolbar input{accent-color:var(--accent)}
.rlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.r{display:grid;grid-template-columns:28px 1fr auto;gap:8px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.r:first-child{border-top:0}
.r:hover{background:#fcfbf8}
.r input{margin-top:4px;accent-color:var(--accent)}
.r-main{min-width:0;cursor:pointer}
.r-file{font:500 13px/1.4 var(--f-mono);word-break:break-all}
.r-main:hover .r-file{color:var(--accent)}
.r-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.r-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:11.5px;background:var(--sunk);color:var(--ink-2);padding:2px 7px;border-radius:99px}
.badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.badge{font:600 11px/1 var(--f-body);padding:4px 7px;border-radius:5px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.vis{background:#e6e9f7;color:#3947a3}
.r-empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}

/* logs */
.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.log + .log{margin-top:10px}
.log h4{margin:0;font-size:15px}
.log .when{font-size:12.5px;color:var(--muted)}
.log .num{text-align:right}
.log .num b{font:600 20px/1 var(--f-mono);display:block}
.log .num span{font-size:11.5px;color:var(--muted)}
.log .note{grid-column:span 2;font-size:13.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
.log .acts{grid-column:span 2;display:flex;gap:6px;justify-content:flex-end}
.banner{background:var(--ink);color:#f3efe7;border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.banner p{margin:0;font-size:14px}
.banner small{display:block;color:#b9b2a5;font-size:12.5px;margin-top:2px}
.banner .btn{background:#fff;border-color:#fff}

/* dialog */
dialog{border:0;padding:0;border-radius:14px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(20,15,10,.45)}
dialog.wide{width:min(820px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(28,24,20,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font:700 18px/1.25 var(--f-display);word-break:break-word}
.dlg-h p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.x{appearance:none;border:0;background:var(--sunk);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:17px;line-height:1;flex:none}
.dlg-b{padding:16px 18px;overflow:auto}
.dlg-f{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fbfaf7;flex-wrap:wrap}
.dlg-f .r-side{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}

/* md view */
.meta-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin-bottom:14px}
.meta-grid dt{color:var(--muted)}
.meta-grid dd{margin:0;word-break:break-all}
.visual-note{background:#eef0fa;border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:#2c3780;margin-bottom:14px;white-space:pre-wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:7px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:5px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.md{font-size:14.5px;line-height:1.65}
.md h2,.md h3,.md h4,.md h5{font-family:var(--f-display);margin:20px 0 6px;letter-spacing:-.01em}
.md h2{font-size:19px}.md h3{font-size:16.5px}.md h4,.md h5{font-size:15px}
.md > :first-child{margin-top:0}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:2px 0}
.md code{font:12.5px var(--f-mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.md blockquote{margin:0 0 10px;border-left:3px solid var(--line-2);padding:2px 12px;color:var(--ink-2)}
.md a{color:var(--accent);word-break:break-all}
.raw{margin:0;font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;background:var(--sunk);padding:12px;border-radius:var(--r-sm)}

/* toast */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}

footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@media (max-width:720px){
  .f.c6,.f.c4,.f.c8,.f.c3{grid-column:span 12}
  .filters .f.c4,.filters .f.c3{grid-column:span 6}
  .acc-h{flex-direction:column}
  .step{grid-template-columns:1fr}
  .step-n{justify-content:flex-start;padding:12px 16px 0;background:none;font-size:13px;color:var(--accent)}
  .step-n::before{content:"Langkah "}
  .snap .k{min-width:0;width:100%}
  .brand h1{font-size:26px}
  .r{grid-template-columns:24px 1fr}
  .badges{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .nav .wrap{flex-direction:column;align-items:stretch;gap:0}
  .session{margin:0 0 8px;align-self:flex-start}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><i aria-hidden="true"></i>BAMBANG <span class="pill-demo">Demo · data contoh</span></h1>
      <p>Bot Analisis Materi Belajar, Awam Nan Gamblang</p>
    </div>
    <div class="top-r">
      <label class="proj"><span>Project</span><select id="projSel" aria-label="Pilih project aktif"></select></label>
      <button class="btn ghost sm" id="resetBtn" title="Kembalikan semua data ke data contoh awal">Reset demo</button>
    </div>
  </header>
</div>

<nav class="nav" aria-label="Menu utama">
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="akun">Akun &amp; Series <span class="cnt" id="cAkun">0</span></button>
      <button class="tab" role="tab" data-view="proses">Project Baru</button>
      <button class="tab" role="tab" data-view="hasil">Hasil MD <span class="cnt" id="cHasil">0</span></button>
      <button class="tab" role="tab" data-view="log">Run Log <span class="cnt" id="cLog">0</span></button>
    </div>
    <div class="session" id="session" role="status">
      <span class="pulse" aria-hidden="true"></span>
      <span>Sesi <b id="sessAcc"></b> · <span id="sessTime"></span></span>
      <button id="sessEnd">Akhiri</button>
    </div>
  </div>
</nav>

<main class="wrap" id="view" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <span>Versi demo — semua data tersimpan di browser ini saja, belum terhubung Supabase.</span>
    <span>BAMBANG v0.1-demo</span>
  </div>
</footer>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   BAMBANG — demo lokal (tanpa login, tanpa Supabase)
   Data disimpan di localStorage browser, kunci: bambang-demo-v1
   ========================================================= */

function progress(accId){
  const ps = S.posts.filter(p => p.account_id === accId).sort((a,b) => (a.post_date||'').localeCompare(b.post_date||''));
  const last = ps[ps.length-1] || null;
  const lastProcessed = ps.reduce((m,p) => (p.processed_at||'') > m ? p.processed_at : m, '');
  const series = seriesOf(accId).map(s => {
    const parts = ps.filter(p => p.series_id === s.id && p.part_number).map(p => p.part_number);
    const max = parts.length ? Math.max(...parts) : 0;
    const missing = []; for(let i=1;i<=max;i++) if(!parts.includes(i)) missing.push(i);
    return {...s, parts, max, missing, count: ps.filter(p => p.series_id === s.id).length};
  });
  return {count:ps.length, last, lastProcessed, series, reprocess:ps.filter(p=>p.reprocess), unvalidated:ps.filter(p=>!p.validated).length};
}

/* ---------- parser hasil Gemini ---------- */
function parseMD(md){
  const r = {}; let m;
  if((m = md.match(/title_slug\s*[:：]\s*`?([A-Za-z0-9 _-]+?)`?\s*$/im))) r.title_slug = slugify(m[1]);
  if((m = md.match(/^\s*[-*]?\s*\**tags\**\s*[:：]\s*(.+)$/im))) r.tags = m[1].split(/[,;]/).map(t => t.replace(/[#\[\]`*]/g,'').trim().toLowerCase()).filter(t => t && t !== '-');
  if((m = md.match(/^\s*[-*]?\s*\**series\**\s*[:：]\s*(.+)$/im))){ const v = m[1].replace(/[`"*]/g,'').trim(); if(v && !/^(-|—|tidak ada|none|tidak)$/i.test(v)) r.series = v; }
  if((m = md.match(/^\s*[-*]?\s*\**part\**\s*[:：]\s*(\d+)/im))) r.part = +m[1];
  if((m = md.match(/^\s*[-*]?\s*\**link asli\**\s*[:：]\s*(https?:\/\/\S+)/im))) r.url = m[1];
  if((m = md.match(/^#{1,4}\s*(?:8[.)]?\s*)?Momen Visual Penting[^\n]*\n([\s\S]*?)(?=^#{1,4}\s|(?![\s\S]))/im))){
    const body = m[1].trim();
    r.has_visual = !!body && !/^[-*\s]*(tidak ada|tidak|none|-)(\b|$)/i.test(body);
    r.visual_notes = r.has_visual ? body.slice(0,500) : '';
  }
  return r;
}

/* ---------- markdown → html (sederhana) ---------- */
function mdToHtml(md){
  const lines = esc(md).split('\n'); const out = []; let list = null, para = [];
  const inline = s => s
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const fP = () => { if(para.length){ out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
  const fL = () => { if(list){ out.push(`<${list.t}>` + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`); list = null; } };
  for(const raw of lines){
    const l = raw.trimEnd(); let m;
    if(!l.trim()){ fP(); fL(); continue; }
    if((m = l.match(/^(#{1,4})\s+(.*)$/))){ fP(); fL(); const n = Math.min(m[1].length + 1, 5); out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if((m = l.match(/^&gt;\s?(.*)$/))){ fP(); fL(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
    if((m = l.match(/^\s*[-*]\s+(.*)$/))){ fP(); if(!list || list.t !== 'ul'){ fL(); list = {t:'ul',items:[]}; } list.items.push(m[1]); continue; }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ fP(); if(!list || list.t !== 'ol'){ fL(); list = {t:'ol',items:[]}; } list.items.push(m[1]); continue; }
    fL(); para.push(l.trim());
  }
  fP(); fL(); return out.join('');
}

const CRC_T = (() => { const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

  for(const f of files){

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dt,true); lh.setUint16(12,dd,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,dt,true); ch.setUint16(14,dd,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true);
    ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true);
    ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s,c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], {type:'application/zip'});
}
function downloadBlob(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

  ['fSlug','fTags','fVisNote','fUrl','fDate','fPart'].forEach(id => $('#'+id).addEventListener('input', () => touched.add(id)));
  $('#fVis').addEventListener('change', () => { touched.add('fVis'); $('#fVisWrap').hidden = !$('#fVis').checked; refresh(); });
  $('#fSeries').addEventListener('change', () => { touched.add('fSeries'); $('#fNewWrap').hidden = $('#fSeries').value !== '__new'; refresh(); });

  function detect(){
    const md = $('#fMd').value; if(!md.trim()){ $('#detectNote').textContent = 'Tempel hasil Gemini untuk mengisi otomatis'; refresh(); return; }
    const m = parseMD(md); const found = [];
    if(m.title_slug && !touched.has('fSlug')){ $('#fSlug').value = m.title_slug; found.push('judul'); }
    if(m.tags && !touched.has('fTags')){ $('#fTags').value = m.tags.join(', '); found.push('tag'); }
    if(m.url && !touched.has('fUrl') && !$('#fUrl').value){ $('#fUrl').value = m.url; found.push('link'); }
    if(m.part && !touched.has('fPart') && !$('#fPart').value){ $('#fPart').value = m.part; found.push('part'); }
    if(m.series && !touched.has('fSeries')){
      const ex = sers.find(s => s.name.toLowerCase() === m.series.toLowerCase());
      if(ex){ $('#fSeries').value = ex.id; $('#fNewWrap').hidden = true; }
      else { $('#fSeries').value = '__new'; $('#fNewWrap').hidden = false; $('#fSeriesNew').value = m.series; }
      found.push('series');
    }
    if(m.has_visual !== undefined && !touched.has('fVis')){ $('#fVis').checked = m.has_visual; $('#fVisWrap').hidden = !m.has_visual; if(!touched.has('fVisNote')) $('#fVisNote').value = m.visual_notes || ''; found.push('visual'); }
    $('#detectNote').textContent = found.length ? `Terisi otomatis: ${found.join(', ')}` : 'Bagian Metadata tidak ditemukan — isi manual';
    refresh();
  }
  function current(){
    const sv = $('#fSeries').value;
    let series_id = sv && sv !== '__new' ? sv : null;
    const newName = sv === '__new' ? $('#fSeriesNew').value.trim() : '';
    return {account_id:a.id, series_id, newName, part_number: +$('#fPart').value || null, original_url:$('#fUrl').value.trim(), post_date:$('#fDate').value,
      title_slug: slugify($('#fSlug').value) || '', tags: $('#fTags').value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean),
      has_visual: $('#fVis').checked, visual_notes: $('#fVis').checked ? $('#fVisNote').value.trim() : '', md_content: $('#fMd').value.trim()};
  }
  function refresh(){
    const c = current();
    const tmp = {...c}; if(c.newName){ tmp.series_id = null; tmp.title_slug = slugify(c.newName); }
    $('#fName').textContent = fileName(tmp);
    const box = $('#dupBox'); const norm = u => u.replace(/[?#].*$/,'').replace(/\/+$/,'').toLowerCase();
    const dup = c.original_url ? S.posts.find(p => norm(p.original_url) === norm(c.original_url)) : null;
    box.className = 'warnbox'; $('#fSave').textContent = 'Simpan hasil';
    if(dup){
      const da = accById(dup.account_id);
      if(dup.reprocess){ box.className = 'warnbox on'; box.innerHTML = `Link ini sudah tersimpan dan <b>ditandai proses ulang</b>. Menyimpan akan <b>mengganti</b> isi MD lamanya.`; $('#fSave').textContent = 'Ganti hasil lama'; }
      else { box.className = 'warnbox on bad'; box.innerHTML = `Link ini sudah tersimpan (${esc(da?da.handle:'')} · ${fmtD(dup.post_date)}). Kalau hasil lamanya kurang bagus, tandai dulu “Perlu diproses ulang” di tab Hasil MD. <button type="button" class="link-btn" data-open="${dup.id}">Buka hasil lama</button>`; }
      const ob = $('[data-open]', box); if(ob) ob.onclick = () => openPost(dup.id);
    }
    return dup;
  }
  $('#fMd').addEventListener('input', () => { clearTimeout(parseT); parseT = setTimeout(detect, 250); });
  ['fUrl','fDate','fPart','fSlug','fSeriesNew'].forEach(id => $('#'+id).addEventListener('input', refresh));
  $('#fClear').onclick = () => renderAddForm();
  f.onsubmit = e => {
    e.preventDefault();
    const c = current(); const errs = [];
    if(!c.md_content) errs.push('hasil MD');
    if(!/^https?:\/\//i.test(c.original_url)) errs.push('link asli (harus diawali https://)');
    if(!c.post_date) errs.push('tanggal postingan');
    if($('#fSeries').value === '__new' && !c.newName) errs.push('nama series baru');
    if(!c.title_slug && !c.series_id && !c.newName) errs.push('title_slug');
    if(errs.length){ toast('Belum lengkap: ' + errs.join(', ')); return; }
    const dup = refresh();
    if(dup && !dup.reprocess){ toast('Link ini sudah tersimpan'); return; }
    if(c.newName){
      const ex = sers.find(s => s.name.toLowerCase() === c.newName.toLowerCase());
      if(ex) c.series_id = ex.id; else { const ns = {id:uid(), account_id:a.id, name:c.newName, description:''}; S.series.push(ns); c.series_id = ns.id; }
    }
    if(!c.series_id) c.part_number = null;
    const rec = {account_id:a.id, series_id:c.series_id, part_number:c.part_number, platform:a.platform, post_date:c.post_date, processed_at:new Date().toISOString(),
      original_url:c.original_url, title_slug:c.title_slug || slugify(c.newName) || 'tanpa-judul', tags:c.tags, has_visual:c.has_visual, visual_notes:c.visual_notes, md_content:c.md_content};
    if(dup){ Object.assign(dup, rec, {validated:false, reprocess:false}); toast('Hasil lama diganti dengan versi baru'); }
    else { S.posts.push({id:uid(), ...rec, validated:false, reprocess:false}); toast(`Tersimpan: ${fileName(rec)}`); }
    save(); renderPromptPanel(); renderAddForm();
    $('#fMd').focus();
  };
  refresh();
}

/* =========================================================
   TAB 3 — MANAJEMEN HASIL MD
   ========================================================= */
const F = {q:'',platform:'',acc:'',series:'',status:'',from:'',to:''};
const sel = new Set();
function filtered(){
  const q = F.q.trim().toLowerCase();
  return postsInProject().filter(p => {
    if(F.platform && p.platform !== F.platform) return false;
    if(F.acc && p.account_id !== F.acc) return false;
    if(F.series === '__none' && p.series_id) return false;
    if(F.series && F.series !== '__none' && p.series_id !== F.series) return false;
    if(F.status === 'unvalidated' && p.validated) return false;
    if(F.status === 'validated' && !p.validated) return false;
    if(F.status === 'reprocess' && !p.reprocess) return false;
    if(F.status === 'visual' && !p.has_visual) return false;
    if(F.from && (p.post_date||'') < F.from) return false;
    if(F.to && (p.post_date||'') > F.to) return false;
    if(q){ const hay = (p.md_content + ' ' + fileName(p) + ' ' + (p.tags||[]).join(' ') + ' ' + p.original_url).toLowerCase(); if(!q.split(/\s+/).every(w => hay.includes(w))) return false; }
    return true;
  }).sort((a,b) => (b.post_date||'').localeCompare(a.post_date||''));
}
function renderHasil(){
  const accs = accsInProject();
  if(F.acc && !accs.find(a => a.id === F.acc)) F.acc = '';
  const plats = [...new Set(accs.map(a => a.platform))];
  const sers = F.acc ? seriesOf(F.acc) : S.series.filter(s => accs.find(a => a.id === s.account_id));
  if(F.series && F.series !== '__none' && !sers.find(s => s.id === F.series)) F.series = '';
  $('#view').innerHTML = `
  <div class="vh"><div><h2>Hasil MD</h2><p>Semua catatan hasil Gemini. Pencarian membaca isi MD, bukan cuma judul.</p></div></div>
  <div class="filters">
    <label class="f search"><span>Cari isi MD</span><input id="qIn" type="search" value="${esc(F.q)}" placeholder="contoh: kontras, thumb zone, gutter"></label>
    <label class="f c3"><span>Platform</span><select data-f="platform"><option value="">Semua</option>${plats.map(p => `<option ${p===F.platform?'selected':''}>${p}</option>`).join('')}</select></label>
    <label class="f c3"><span>Akun</span><select data-f="acc"><option value="">Semua</option>${accs.map(a => `<option value="${a.id}" ${a.id===F.acc?'selected':''}>${esc(a.handle)}</option>`).join('')}</select></label>
    <label class="f c3"><span>Series</span><select data-f="series"><option value="">Semua</option><option value="__none" ${F.series==='__none'?'selected':''}>Tanpa series</option>${sers.map(s => `<option value="${s.id}" ${s.id===F.series?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
    <label class="f c3"><span>Status</span><select data-f="status">
      ${[['','Semua'],['unvalidated','Belum divalidasi'],['validated','Sudah divalidasi'],['reprocess','Perlu diproses ulang'],['visual','Ada momen visual']].map(([v,l]) => `<option value="${v}" ${v===F.status?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f c6"><span>Tanggal post dari</span><input type="date" data-f="from" value="${F.from}"></label>
    <label class="f c6"><span>sampai</span><input type="date" data-f="to" value="${F.to}"></label>
  </div>
  <div class="toolbar"><label><input type="checkbox" id="selAll"> <span id="selInfo"></span></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ghost" id="resetF">Hapus filter</button><button class="btn sm" id="zipBtn">Download ZIP</button></div></div>
  <div class="rlist" id="rlist"></div>`;
  $('#qIn').oninput = e => { F.q = e.target.value; renderList(); };
  $$('[data-f]').forEach(el => el.onchange = e => { F[el.dataset.f] = e.target.value; if(el.dataset.f === 'acc'){ F.series=''; renderHasil(); } else renderList(); });
  $('#resetF').onclick = () => { Object.assign(F,{q:'',platform:'',acc:'',series:'',status:'',from:'',to:''}); renderHasil(); };
  $('#selAll').onchange = e => { const list = filtered(); if(e.target.checked) list.forEach(p => sel.add(p.id)); else list.forEach(p => sel.delete(p.id)); renderList(); };
  $('#zipBtn').onclick = () => {
    const list = filtered(); const chosen = list.filter(p => sel.has(p.id)); const pick = chosen.length ? chosen : list;
    if(!pick.length){ toast('Tidak ada MD untuk didownload'); return; }
    const used = {}; const files = pick.map(p => { let n = fileName(p); if(used[n]){ used[n]++; n = n.replace(/\.md$/, `-${used[n]}.md`); } else used[n] = 1; return {name:n, text:p.md_content}; });
    downloadBlob(makeZip(files), `bambang_${slugify(projName())}_${today()}.zip`);
    toast(`${files.length} file MD dimasukkan ke ZIP`);
  };
  renderList();
}
function renderList(){
  const list = filtered(); const ids = new Set(list.map(p => p.id));
  [...sel].forEach(id => { if(!S.posts.find(p => p.id === id)) sel.delete(id); });
  const nSel = list.filter(p => sel.has(p.id)).length;
  $('#selInfo').textContent = nSel ? `${nSel} dipilih dari ${list.length} MD` : `${list.length} MD`;
  $('#selAll').checked = list.length > 0 && nSel === list.length;
  $('#selAll').indeterminate = nSel > 0 && nSel < list.length;
  $('#zipBtn').textContent = nSel ? `Download ZIP (${nSel})` : `Download ZIP (semua ${list.length})`;
  $('#zipBtn').disabled = !list.length;
  if(!list.length){ $('#rlist').innerHTML = `<div class="r-empty">${postsInProject().length ? 'Tidak ada MD yang cocok dengan filter.' : 'Belum ada hasil MD. Tambahkan dari tab Project Baru.'}</div>`; return; }
  $('#rlist').innerHTML = list.map(p => {
    const a = accById(p.account_id); const s = p.series_id ? serById(p.series_id) : null;
    const b = [];
    if(p.reprocess) b.push('<span class="badge bad">Perlu diproses ulang</span>');
    b.push(p.validated ? '<span class="badge ok">Tervalidasi</span>' : '<span class="badge warn">Belum divalidasi</span>');
    if(p.has_visual) b.push('<span class="badge vis">Momen visual</span>');
    return `<div class="r"><input type="checkbox" data-sel="${p.id}" ${sel.has(p.id)?'checked':''} aria-label="Pilih ${esc(fileName(p))}">
      <div class="r-main" data-open="${p.id}" role="button" tabindex="0"><div class="r-file">${esc(fileName(p))}</div>
        <div class="r-meta">${esc(a?a.handle:'?')} · ${p.platform} · post ${fmtD(p.post_date)}${s?` · ${esc(s.name)}${p.part_number?` part ${p.part_number}`:''}`:''}</div>
        ${(p.tags||[]).length?`<div class="r-tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}</div>
      <div class="badges">${b.join('')}</div></div>`;
  }).join('');
  $$('[data-sel]', $('#rlist')).forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.sel) : sel.delete(c.dataset.sel); renderList(); });
  $$('[data-open]', $('#rlist')).forEach(el => { el.onclick = () => openPost(el.dataset.open); el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openPost(el.dataset.open); } }; });
}
function openPost(id, mode='rendered'){
  const p = S.posts.find(x => x.id === id); if(!p) return;
  const a = accById(p.account_id); const s = p.series_id ? serById(p.series_id) : null;
  dlg.className = 'wide';
  dlg.innerHTML = `<div class="dlg">
    <div class="dlg-h"><div><h3 style="font:600 15px/1.4 var(--f-mono)">${esc(fileName(p))}</h3><p>${esc(a?a.handle:'')} · ${p.platform}</p></div><button class="x" data-close aria-label="Tutup">×</button></div>
    <div class="dlg-b">
      <dl class="meta-grid">
        <dt>Link asli</dt><dd><a href="${esc(p.original_url)}" target="_blank" rel="noopener">${esc(p.original_url)}</a></dd>
        <dt>Tanggal post</dt><dd>${fmtD(p.post_date)}</dd>
        <dt>Diproses</dt><dd>${fmtDT(p.processed_at)}</dd>
        <dt>Series</dt><dd>${s ? `${esc(s.name)}${p.part_number?` · part ${p.part_number}`:''}` : '—'}</dd>
        <dt>Tag</dt><dd>${(p.tags||[]).map(esc).join(', ') || '—'}</dd>
        <dt>Status</dt><dd>${p.validated?'Tervalidasi':'Belum divalidasi'}${p.reprocess?' · <b style="color:var(--bad)">perlu diproses ulang</b>':''}</dd>
      </dl>
      ${p.has_visual ? `<div class="visual-note"><b>Momen visual penting</b>\n${esc(p.visual_notes||'(tanpa catatan)')}</div>` : ''}
      <div class="seg" role="group" aria-label="Tampilan"><button data-mode="rendered" aria-pressed="${mode==='rendered'}">Tampilan baca</button><button data-mode="raw" aria-pressed="${mode==='raw'}">Teks MD</button></div>
      ${mode === 'raw' ? `<pre class="raw">${esc(p.md_content)}</pre>` : `<div class="md">${mdToHtml(p.md_content)}</div>`}
    </div>
    <div class="dlg-f"><button class="btn danger sm" data-act="del">Hapus</button>
      <div class="r-side">
        <button class="btn sm" data-act="copy">Salin MD</button>
        <button class="btn sm" data-act="dl">Download .md</button>
        <button class="btn sm ${p.reprocess?'danger':''}" data-act="re">${p.reprocess?'Batalkan proses ulang':'Tandai proses ulang'}</button>
        <button class="btn sm ${p.validated?'':'pri'}" data-act="val">${p.validated?'Batalkan validasi':'Tandai tervalidasi'}</button>
      </div></div></div>`;
  $$('[data-close]', dlg).forEach(b => b.onclick = () => dlg.close());
  $$('[data-mode]', dlg).forEach(b => b.onclick = () => openPost(id, b.dataset.mode));
  const after = msg => { save(); if(view==='hasil') renderList(); else if(view==='akun') renderAkun(); else if(view==='proses'){ renderPromptPanel(); } openPost(id, mode); toast(msg); };
  $('[data-act="val"]', dlg).onclick = () => { p.validated = !p.validated; if(p.validated) p.reprocess = false; after(p.validated ? 'Ditandai tervalidasi' : 'Validasi dibatalkan'); };
  $('[data-act="re"]', dlg).onclick = () => { p.reprocess = !p.reprocess; if(p.reprocess) p.validated = false; after(p.reprocess ? 'Masuk antrian proses ulang — akan ikut di perintah Claude berikutnya' : 'Dikeluarkan dari antrian proses ulang'); };
  $('[data-act="copy"]', dlg).onclick = async () => toast(await copyText(p.md_content) ? 'Isi MD disalin' : 'Gagal menyalin');
  $('[data-act="dl"]', dlg).onclick = () => downloadBlob(new Blob([p.md_content],{type:'text/markdown;charset=utf-8'}), fileName(p));
  $('[data-act="del"]', dlg).onclick = () => { if(!confirm(`Hapus ${fileName(p)}? Tindakan ini tidak bisa dibatalkan.`)) return; S.posts = S.posts.filter(x => x.id !== id); sel.delete(id); save(); dlg.close(); go(view, {scroll:false}); toast('Hasil MD dihapus'); };
  if(!dlg.open) dlg.showModal();
}

/* =========================================================
   TAB 4 — RUN LOG
   ========================================================= */
const REASON = {selesai:['ok','Selesai'], limit:['warn','Kena limit'], error:['bad','Error']};
function renderLog(){
  const runs = runsInProject().sort((a,b) => b.started_at.localeCompare(a.started_at));
  const pr = S.pendingRun && accById(S.pendingRun.account_id) ? S.pendingRun : null;
  let h = `<div class="vh"><div><h2>Run Log</h2><p>Catatan tiap sesi kerja Claude in Chrome. Opsional — berguna untuk tahu kenapa sesi terakhir berhenti.</p></div>
    <button class="btn" data-a="add-run">+ Catat sesi manual</button></div>`;
  if(pr){
    const n = S.posts.filter(p => p.account_id === pr.account_id && p.processed_at >= pr.started_at).length;
    h += `<div class="banner"><p>Sesi <b>${esc(accById(pr.account_id).handle)}</b> berjalan sejak ${fmtDT(pr.started_at)}<small>${n} hasil MD tersimpan selama sesi ini</small></p>
      <div style="display:flex;gap:6px"><button class="btn ghost sm" data-a="cancel-run" style="color:#f3efe7">Batalkan</button><button class="btn sm" data-a="end-run">Akhiri &amp; catat</button></div></div>`;
  }
  h += runs.length ? runs.map(r => {
    const a = accById(r.account_id); const [cls, lbl] = REASON[r.reason] || ['warn', r.reason];
    return `<article class="log"><div><h4>${esc(a?a.handle:'?')} <span class="badge ${cls}" style="margin-left:6px;vertical-align:2px">${lbl}</span></h4>
      <div class="when">${fmtDT(r.started_at)} → ${r.ended_at ? fmtDT(r.ended_at) : '—'}${r.ended_at?` · ${dur(r.started_at, r.ended_at)}`:''}</div></div>
      <div class="num"><b>${r.count}</b><span>postingan</span></div>
      ${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}
      <div class="acts"><button class="link-btn" data-a="edit-run" data-id="${r.id}">Edit</button></div></article>`;
  }).join('') : `<div class="empty"><strong>Belum ada log</strong>Log otomatis dimulai saat kamu menyalin perintah di tab Project Baru.</div>`;
  $('#view').innerHTML = h;
}
function openRunDialog(r, fromPending=false){
  const accs = accsInProject(); if(!accs.length){ toast('Belum ada akun'); return; }
  const pr = fromPending && S.pendingRun ? S.pendingRun : null;
  const nowIso = new Date().toISOString();
  const v = r || (pr ? {account_id:pr.account_id, started_at:pr.started_at, ended_at:nowIso, reason:'selesai', count:S.posts.filter(p => p.account_id === pr.account_id && p.processed_at >= pr.started_at).length, notes:''}
                     : {account_id:accs[0].id, started_at:nowIso, ended_at:nowIso, reason:'selesai', count:0, notes:''});
  openDialog({title: r ? 'Edit log sesi' : (pr ? 'Akhiri sesi' : 'Catat sesi'), sub: pr ? 'Jumlah postingan dihitung dari hasil MD yang tersimpan selama sesi. Ubah kalau perlu.' : '',
    body:`<div class="fgrid">
      <label class="f"><span>Akun</span><select name="acc">${accs.map(a => `<option value="${a.id}" ${a.id===v.account_id?'selected':''}>${esc(a.handle)} · ${a.platform}</option>`).join('')}</select></label>
      <label class="f c6"><span>Mulai</span><input type="datetime-local" name="start" value="${toLocalInput(v.started_at)}" required></label>
      <label class="f c6"><span>Selesai</span><input type="datetime-local" name="end" value="${toLocalInput(v.ended_at)}"></label>
      <label class="f c6"><span>Alasan berhenti</span><select name="reason">${Object.entries(REASON).map(([k,[,l]]) => `<option value="${k}" ${k===v.reason?'selected':''}>${l}</option>`).join('')}</select></label>
      <label class="f c6"><span>Jumlah postingan diproses</span><input type="number" min="0" name="count" value="${v.count}"></label>
      <label class="f"><span>Catatan <em>(opsional)</em></span><input name="notes" value="${esc(v.notes||'')}" placeholder="contoh: berhenti di postingan 12 Sep, situs downloader down"></label></div>`,
    submit: r ? 'Simpan' : 'Simpan log',
    danger: r ? {label:'Hapus log', fn:() => { if(!confirm('Hapus log ini?')) return false; S.runs = S.runs.filter(x => x.id !== r.id); save(); renderLog(); toast('Log dihapus'); }} : null,
    onSubmit:fd => {
      const start = fd.get('start'); if(!start){ toast('Waktu mulai belum diisi'); return false; }
      const end = fd.get('end');
      if(end && new Date(end) < new Date(start)){ toast('Waktu selesai lebih awal dari waktu mulai'); return false; }
      const rec = {account_id:fd.get('acc'), started_at:new Date(start).toISOString(), ended_at:end ? new Date(end).toISOString() : null, reason:fd.get('reason'), count:Math.max(0, +fd.get('count')||0), notes:(fd.get('notes')||'').trim()};
      if(r) Object.assign(r, rec); else S.runs.push({id:uid(), ...rec});
      if(pr) S.pendingRun = null;
      save(); if(view==='log') renderLog(); toast('Log sesi disimpan');
    }});
}

/* ---------- aksi global (event delegation) ---------- */
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const id = b.dataset.id;
  switch(b.dataset.a){
    case 'add-acc': accDialog(null); break;
    case 'edit-acc': accDialog(accById(id)); break;
    case 'add-series': seriesDialog(id, null); break;
    case 'edit-series': { const s = serById(id); seriesDialog(s.account_id, s); break; }
    case 'start': procAcc = id; go('proses'); break;
    case 'go-akun': go('akun'); break;
    case 'add-run': openRunDialog(null); break;
    case 'edit-run': openRunDialog(S.runs.find(r => r.id === id)); break;
    case 'end-run': openRunDialog(null, true); break;
    case 'cancel-run': if(confirm('Batalkan sesi berjalan tanpa mencatat log?')){ S.pendingRun = null; save(); renderLog(); } break;
  }
});

/* ---------- mulai ---------- */
S = load();
save();
renderProjSel();
go((location.hash || '#akun').slice(1));
</script>
