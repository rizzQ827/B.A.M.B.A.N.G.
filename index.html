<!DOCTYPE html>
<!-- BAMBANG index.html v0.6 · 2026-09-26 · single file (manifest.webmanifest + icon-192/512.png untuk tombol Bagikan) -->
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="bambang-app" content="main">
<meta name="theme-color" content="#f4f1ea">
<title>BAMBANG</title>
<meta name="description" content="BAMBANG (Bot Analisis Materi Belajar, Awam Nan Gamblang) — pustakawan konten sosmed: kumpulkan, baca, rapikan, jadikan bacaan.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1d1b16; --muted:#5f5a4f; --soft:#3a372f;
  --line:#e2dccf; --line2:#efe9dd; --edge:#d6cfbf; --chip:#e6e0d3;
  --acc:#0e6b58; --acc-h:#094a3d; --acc-soft:#e3f1ec; --acc-soft2:#d7ece5; --acc-ink:#0a4a3d; --acc-glow:#9ff0d4;
  --warn:#a4460c; --warn-soft:#fbe9dc; --warn-ink:#7a3208;
  --cl:#a8431f; --cl-soft:#f5e0d6; --fab:#f0a78a;
  --f-title:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-read:"Source Serif 4",Georgia,serif;
  --side:232px; --navh:72px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);min-height:100vh}
a{color:var(--acc)}a:hover{color:var(--acc-h)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
.warn-t{color:var(--warn)}.acc-t{color:var(--acc)}

/* ---------- kerangka ---------- */
#side{display:none}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--navh) + env(safe-area-inset-bottom));padding:4px 8px calc(12px + env(safe-area-inset-bottom));display:flex;border-top:1px solid var(--line);background:var(--card)}
#bnav a{flex:1 1 0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted);text-decoration:none}
#bnav a[aria-current="page"]{color:var(--acc);font-weight:600}
#bnav svg{width:22px;height:22px}
#fab{position:fixed;right:20px;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));z-index:41;width:52px;height:52px;border-radius:26px;border:0;background:var(--ink);color:var(--fab);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(29,27,22,.22);cursor:pointer;text-decoration:none}
#fab svg{width:24px;height:24px}
#fab .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--acc);color:#fff;font:600 11px/20px var(--f-body);text-align:center}
#fab .fl{display:none}
#main{min-height:100vh;padding-bottom:calc(var(--navh) + 90px)}
#strip{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--ink);color:var(--bg);font:500 12px/1.3 var(--f-mono);text-decoration:none;min-height:38px}
#strip .dot{width:8px;height:8px;border-radius:4px;background:#9a948a;flex:none}
#strip.jalan{background:var(--acc);color:var(--card)}#strip.jalan .dot{background:var(--acc-glow)}
#strip.jeda{background:#6b5a2c;color:#fff4dc}#strip.jeda .dot{background:#f0c46c}
#strip.stop{background:var(--warn);color:#fff}#strip.stop .dot{background:#ffd2b8}
#strip .grow{flex:1}
#strip b{font-weight:600}
#fresh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 20px;background:var(--acc);color:#fff;font-size:13px;font-weight:600}
#fresh button{border:0;background:#fff;color:var(--acc-ink);border-radius:999px;min-height:32px;padding:0 12px;font-weight:600;cursor:pointer}
#view{display:block;padding:0 0 12px;max-width:1180px;margin:0 auto}
#view:focus{outline:none}

@media (min-width:1024px){
  #side{display:flex;flex-direction:column;gap:6px;position:fixed;left:0;top:0;bottom:0;width:var(--side);padding:24px 16px;background:var(--card);border-right:1px solid var(--line);z-index:30}
  #side .brand{padding:0 12px 18px;font:700 22px/1 var(--f-title);letter-spacing:1px}
  #side nav{display:flex;flex-direction:column;gap:6px}
  #side a.m{min-height:44px;padding:0 12px;display:flex;align-items:center;gap:10px;border-radius:12px;color:var(--muted);font-size:15px;text-decoration:none}
  #side a.m[aria-current="page"]{background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
  #side a.m:hover{background:var(--line2)}
  #side .grow{flex:1}
  #side .st{margin-top:8px;padding:12px;border-radius:12px;background:var(--bg);font-size:12px;color:var(--muted);line-height:1.6}
  #side .st b{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}
  #side .st .dot{width:8px;height:8px;border-radius:4px;background:#9a948a;flex:none}
  #bnav{display:none}
  #main{margin-left:var(--side);padding-bottom:90px}
  #fab{width:auto;height:52px;padding:0 18px 0 14px;gap:10px;border-radius:14px;bottom:24px;right:24px;color:var(--bg);font-weight:600;font-size:14px}
  #fab svg{color:var(--fab)}
  #fab .fl{display:inline}
  #fab .n{position:static;background:var(--acc);min-width:24px;height:24px;line-height:24px;border-radius:12px;font-size:12px}
  body.full #side,body.full #fab{display:none}
  body.full #main{margin-left:0}
}
body.full #bnav,body.full #fab{display:none}
body.full #view{max-width:none}
body.full #main{padding-bottom:0}

/* ---------- tipografi & blok ---------- */
.page{padding:0 20px}
.hd{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd h1,.h1{margin:0;font:700 30px/1.1 var(--f-title);letter-spacing:-.5px}
.hd .sub{font-size:14px;color:var(--muted);margin-top:4px}
.back{min-height:44px;padding:0 8px;margin:10px 12px 0;display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-size:14px;text-decoration:none;border:0;background:none;cursor:pointer}
.back svg{width:20px;height:20px;stroke-width:2}
.h2{margin:0;font:700 18px/1.25 var(--f-title)}
.lbl{font:500 12px/1.3 var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card + .card,.stack > * + *{margin-top:10px}
.mx{margin-left:20px;margin-right:20px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.row{min-height:48px;padding:0 14px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line2);font-size:14px;color:var(--ink);text-decoration:none;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
a.row:hover,button.row:hover{background:#faf7f0}
.row .grow{flex:1;min-width:0}
.row .end{font-weight:600;white-space:nowrap}
.cardhd{padding:14px 14px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.kv > :last-child{text-align:right}
.ok-t{color:var(--acc-ink);font-weight:600}
.dark-card{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.dark-card .lbl{color:#bdb6a8}
.note{padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn-ink);font-size:13px;line-height:1.45}
.note.info{background:var(--acc-soft);color:var(--acc-ink)}
.note.plain{background:var(--bg);color:var(--ink)}
.note a{color:inherit;font-weight:600}
.dash{padding:12px 14px;border:1.5px dashed #c9c1b0;border-radius:14px;font-size:13px;color:var(--muted);line-height:1.5}
.empty{margin:16px 20px;padding:24px 18px;border:1.5px dashed #c9c1b0;border-radius:18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;font-family:var(--f-title)}

/* ---------- tombol ---------- */
.btn{appearance:none;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--edge);background:transparent;color:var(--ink);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--card)}
.btn.pri:hover{background:var(--acc-h);border-color:var(--acc-h);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.dark:hover{color:#fff}
.btn.light{background:var(--bg);border-color:var(--bg);color:var(--ink)}
.btn.wout{border:1.5px solid var(--warn);color:var(--warn)}
.btn.wout:hover{background:var(--warn-soft)}
.btn.ghost{border-color:transparent;color:var(--acc)}
.btn.ghost:hover{background:var(--acc-soft)}
.btn.lg{min-height:52px;font-size:16px;border-radius:14px}
.btn.block{display:flex;width:100%}
.btn.icon{width:44px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns > .btn.grow{flex:1}
.link{appearance:none;border:0;background:none;padding:0;min-height:44px;color:var(--acc);font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.link:hover{text-decoration:underline}

/* ---------- pill, chip, badge ---------- */
.pills{display:flex;padding:4px;background:var(--chip);border-radius:999px;gap:2px}
.pills a,.pills button{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px;text-decoration:none;border:0;background:none;cursor:pointer;padding:0 10px}
.pills [aria-current="page"],.pills [aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{min-height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--edge);background:transparent;color:var(--ink);font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
.chipbtn.soft{border:0;background:var(--chip)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.5;white-space:nowrap;background:var(--chip);color:var(--ink)}
.badge.belum{background:var(--chip);color:var(--ink)}
.badge.revisi{background:var(--warn-soft);color:var(--warn-ink)}
.badge.sudah{background:var(--acc-soft2);color:var(--acc-ink)}
.badge.hasil{background:var(--ink);color:var(--bg)}
.badge.acc{background:var(--acc-soft);color:var(--acc-ink)}
.badge.cl{background:var(--cl-soft);color:#7a2f14}
.badge.warn{background:var(--warn-soft);color:var(--warn-ink)}
.tag{font:500 11px/1 var(--f-mono);color:var(--muted)}

/* ---------- ikon pelaku, PP, thumbnail ---------- */
.who{width:30px;height:30px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.who svg{width:18px;height:18px}
.who.mesin{background:var(--ink);color:var(--bg)}
.who.claude{background:var(--cl-soft);color:var(--cl)}
.who.kamu{background:var(--acc-soft2);color:var(--acc-ink)}
.pp{width:40px;height:40px;border-radius:999px;background:#c9bfa9 center/cover no-repeat;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:700 15px/1 var(--f-title);overflow:hidden}
.pp.sm{width:24px;height:24px;font-size:10px}.pp.lg{width:60px;height:60px;font-size:22px}
.thumb{position:relative;display:block;border-radius:12px;background:#8f8676 center/cover no-repeat;overflow:hidden}
.thumb .tb{position:absolute;left:8px;top:8px}
.thumb .no{position:absolute;right:8px;bottom:8px;font:500 11px/1 var(--f-mono);color:#fffdf8;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,253,248,.7)}
.thumb .ph svg{width:28px;height:28px}
.hscroll{display:flex;gap:10px;padding:0 20px 4px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tcard{width:128px;flex:none;display:flex;flex-direction:column;gap:6px;color:var(--ink);text-decoration:none;scroll-snap-align:start}
.tcard .thumb{height:160px}
.tcard .t{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.plist{display:flex;flex-direction:column}
.prow{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);color:var(--ink);text-decoration:none;align-items:flex-start}
.prow:first-child{border-top:0}
.prow:hover{background:#faf7f0}
.prow .thumb{width:56px;height:70px;flex:none;border-radius:10px}
.prow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prow .t{font-weight:600;font-size:14px;line-height:1.35}
.prow .s{font-size:13px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.bar3{height:6px;border-radius:3px;background:var(--chip);display:flex;overflow:hidden}
.bar3 i{display:block;height:100%}
.bar3 .s{background:var(--acc)}.bar3 .r{background:var(--warn)}.bar3 .b{background:#bdb4a2}
.pbar{height:6px;border-radius:3px;background:#3a372f;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc-glow);border-radius:3px}
.qbar{height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,#e6e0d3 0 6px,#f4f1ea 6px 10px);overflow:hidden}
.qbar.known{background:var(--chip)}
.qbar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat3 > *{padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.stat3 b{display:block;font-size:18px;font-weight:700}
.stat3 span{font-size:12px;color:var(--muted)}

/* ---------- form ---------- */
.fld{display:flex;flex-direction:column;gap:6px}
.fld > span{font-size:13px;font-weight:600}
.fld .help{font-size:12px;color:var(--muted);font-weight:400;line-height:1.45}
.inp,.fld input:not([type=checkbox]):not([type=radio]):not([type=range]),.fld select,.fld textarea{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--edge);border-radius:12px;background:var(--card);font-size:14px}
.fld textarea{padding:12px 14px;min-height:110px;resize:vertical;line-height:1.55}
.fld textarea.big{border:1.5px solid var(--ink);border-radius:14px;font:13px/1.6 var(--f-mono);min-height:116px}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.chk{min-height:44px;display:flex;align-items:center;gap:12px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--acc);flex:none}
.chk + .chk{border-top:1px solid var(--line2)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted)}
.search input{padding-left:40px!important}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kind label{display:flex;flex-direction:column;gap:4px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-size:12px;color:var(--muted);line-height:1.4}
.kind label b{font-size:14px;color:var(--ink)}
.kind input{position:absolute;opacity:0;pointer-events:none}
.kind label:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.cmd{padding:14px;border-radius:12px;background:#141310;color:#e8e2d6;font:500 14px/1.5 var(--f-mono);word-break:break-word}
.light .cmd,.card .cmd{background:var(--ink)}
.done-msg{font-size:13px;color:var(--acc)}

/* ---------- baca MD ---------- */
.md{font-size:15px;line-height:1.65;overflow-wrap:anywhere}
.md > :first-child{margin-top:0}
.md h2,.md h3,.md h4{font-family:var(--f-title);margin:18px 0 6px;line-height:1.3}
.md h2{font-size:19px}.md h3{font-size:16.5px}.md h4{font-size:15px}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:2px 0}
.md code{font:13px var(--f-mono);background:var(--line2);padding:1px 5px;border-radius:4px}
.md blockquote{margin:0 0 10px;border-left:3px solid var(--edge);padding:2px 12px;color:var(--soft)}
.md table{border-collapse:collapse;margin:0 0 12px;font-size:14px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md .ts{font:500 12px/1 var(--f-mono);color:var(--acc);background:none;border:0;padding:2px 0;cursor:pointer}
.md .ts.vis{color:var(--muted)}
.md .seg{padding:2px 0;border-radius:10px;transition:background .2s}
.md .seg.on{background:var(--acc-soft);margin:0 -10px;padding:6px 10px}
.md .src{font:500 11px/1 var(--f-mono);color:var(--acc);text-decoration:none;vertical-align:super}
.md sup.fn a{font:500 11px/1 var(--f-mono);color:var(--acc);text-decoration:none}
.md .fns{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--soft)}
.md .fns ol{padding-left:20px}
.md mark{background:#fff0a8;padding:0 2px;border-radius:3px}
.read{font-family:var(--f-read);font-size:17px;line-height:1.7}
.read h2,.read h3{font-family:var(--f-title)}
.read .fns{font-family:var(--f-body)}
.raw{margin:0;font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;background:var(--line2);padding:12px;border-radius:12px}
.diff{font:12.5px/1.55 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.diff .a{background:#e3f1ec;display:block}.diff .d{background:#fbe9dc;display:block;text-decoration:line-through;color:#7a3208}

/* ---------- sheet & toast ---------- */
dialog{border:0;padding:0;background:transparent;max-width:100vw;max-height:100dvh;margin:0;color:var(--ink)}
dialog::backdrop{background:rgba(29,27,22,.45)}
dialog.sheet{position:fixed;inset:auto 0 0 0;width:100%}
.sh{background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sh .grab{width:40px;height:4px;border-radius:2px;background:var(--edge);margin:0 auto 4px}
.sh h3{margin:0;font:700 18px/1.3 var(--f-title)}
.sh .x{position:absolute;right:12px;top:10px}
@media (min-width:720px){
  dialog.sheet{inset:0;margin:auto;width:min(560px,calc(100vw - 32px));height:fit-content}
  .sh{border-radius:20px;max-height:86dvh}
}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 84px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:1024px){#toast{bottom:92px}}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth form{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.auth .logo{font:700 34px/1 var(--f-title);letter-spacing:1px}
.auth .err{color:var(--warn);font-size:13px;min-height:1em;margin:0}

/* ---------- grid laptop ---------- */
.cols{display:grid;gap:12px}
@media (min-width:1024px){
  .hd{padding:28px 28px 0}
  .page{padding:0 28px}
  .mx{margin-left:28px;margin-right:28px}
  .hscroll{padding:0 28px 4px}
  .cols.two{grid-template-columns:1fr 1fr;align-items:start}
  .cols.three{grid-template-columns:1.05fr 1fr 1fr;align-items:start}
  .empty{margin:16px 28px}
}
.panes{display:block}
@media (min-width:1200px){
  .panes{display:grid;grid-template-columns:300px minmax(0,1fr) minmax(0,1.15fr);gap:0;height:calc(100vh - 38px)}
  .panes > section{overflow:auto;border-right:1px solid var(--line);padding-bottom:24px}
  .panes > section:last-child{border-right:0;background:var(--card)}
  .panes .hd{padding:20px 20px 0}.panes .page{padding:0 20px}.panes .mx{margin-left:20px;margin-right:20px}.panes .hscroll{padding:0 20px 4px}
}

/* ---------- Ruang Cek ---------- */
.cek{display:flex;flex-direction:column;min-height:100vh;background:var(--bg)}
.cek-top{min-height:64px;padding:8px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.cek-top .t{flex:1;min-width:0}
.cek-top .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cek-body{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px}
.player{display:flex;flex-direction:column;gap:10px}
.stage{position:relative;border-radius:18px;background:var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#9a948a;font-size:13px;aspect-ratio:9/12;max-height:52vh}
.stage video,.stage img{width:100%;height:100%;object-fit:contain;background:#000}
.stage .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,253,248,.9);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.stage .nav.l{left:8px}.stage .nav.r{right:8px}
.ctrl{display:flex;align-items:center;gap:12px;font:500 12px var(--f-mono)}
.ctrl .play{width:44px;height:44px;border-radius:22px;border:0;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ctrl input[type=range]{flex:1;accent-color:var(--acc)}
.mdbox{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-width:0;min-height:0}
.mdbox .md{padding:18px 20px;overflow:auto;flex:1}
.actbar{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--card);border-radius:0 0 18px 18px}
.actbar .fld{flex:1 1 220px}
@media (min-width:1024px){
  .cek-body{flex-direction:row;padding:24px;gap:24px;height:calc(100vh - 64px)}
  .player{width:400px;flex:none}
  .stage{aspect-ratio:auto;flex:1;max-height:none}
  .mdbox{flex:1}
}

/* ---------- Ruang Claude (gelap) ---------- */
body.dark{background:var(--ink);color:var(--bg)}
body.dark a{color:var(--acc-glow)}
.rc{max-width:1000px;margin:0 auto;padding-bottom:40px}
.rc .hd h1{color:var(--bg)}
.rc .back{color:var(--bg)}
.rc .btn{border-color:#4a463d;color:var(--bg)}
.rc .btn:hover{border-color:var(--bg)}
.rc .btn.light{background:var(--bg);border-color:var(--bg);color:var(--ink)}
.rc .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.rc .card,.rc .rcard{background:#2a2720;border:1px solid #3a372f;color:var(--bg);border-radius:16px}
.rc .muted,.rc .help{color:#bdb6a8}
.rc .lbl{color:#bdb6a8}
.rc .row{color:var(--bg);border-top-color:#3a372f}
.rc a.row:hover,.rc button.row:hover{background:#34302a}
.rc .inp,.rc .fld input:not([type=checkbox]),.rc .fld select,.rc .fld textarea{background:#141310;border-color:#4a463d;color:var(--bg)}
.rc .note.plain{background:#141310;color:#e8e2d6}
.rc .chipbtn{border-color:#4a463d;color:var(--bg)}
.rc .chipbtn[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.rc .raw{background:#141310;color:#e8e2d6}
.rc .badge.belum{background:#3a372f;color:var(--bg)}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.tasks{grid-template-columns:repeat(4,minmax(0,1fr))}}
body.dark .task,body.dark .tech a{color:var(--bg)}
.task{padding:14px;border-radius:16px;background:#2a2720;border:1.5px solid transparent;display:flex;flex-direction:column;gap:6px;color:var(--bg);text-decoration:none;cursor:pointer;text-align:left}
.task[aria-current="true"]{border-color:var(--acc-glow)}
.task .n{font:700 28px/1 var(--f-title)}
.task .t{font-weight:600;font-size:14px;line-height:1.3}
.tech{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.tech{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tech a{min-height:64px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-radius:12px;border:1px solid #4a463d;color:var(--bg);text-decoration:none}
.tech a b{font-size:14px}.tech a span{font:500 11px var(--f-mono);color:#bdb6a8}

/* ---------- lain-lain ---------- */
.chart{display:flex;align-items:flex-end;gap:3px;height:90px;padding-top:6px}
.chart i{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.chart i.f{background:var(--warn)}
.chart-x{display:flex;justify-content:space-between;font:500 10px var(--f-mono);color:var(--muted)}
.feed{display:flex;flex-direction:column}
.feed .it{padding:8px 14px;display:flex;gap:10px;align-items:center}
.feed .it .grow{flex:1;min-width:0;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.feed .it time{font-size:12px;color:var(--muted);flex:none}
.feed .it.warn .grow{color:var(--warn-ink)}.feed .it.error .grow{color:var(--warn);font-weight:500}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.sticky-foot{position:sticky;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.toc a{display:flex;align-items:center;gap:10px}
.toc .no{font:500 12px var(--f-mono);color:var(--muted);width:22px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
</style>
</head>

<script>
const EXT_FILES = {"manifest.json": "{\n  \"manifest_version\": 3,\n  \"name\": \"BAMBANG Helper\",\n  \"version\": \"0.3.0\",\n  \"description\": \"Pembantu BAMBANG: mengambil postingan Instagram (video/foto, caption, tanggal, thumbnail), daftar postingan sebuah akun (grid + tab Reels), dan cek postingan baru, memakai login Instagram di Chrome ini.\",\n  \"permissions\": [\"scripting\"],\n  \"host_permissions\": [\n    \"https://www.instagram.com/*\",\n    \"https://*.cdninstagram.com/*\",\n    \"https://*.fbcdn.net/*\",\n    \"https://*.supabase.co/*\"\n  ],\n  \"background\": { \"service_worker\": \"background.js\" },\n  \"content_scripts\": [\n    {\n      \"matches\": [\"https://*.github.io/*\", \"http://localhost/*\", \"http://127.0.0.1/*\"],\n      \"js\": [\"bridge.js\"],\n      \"run_at\": \"document_start\"\n    }\n  ]\n}\n", "background.js": "// BAMBANG Helper — background (v0.3)\n// 1. ig-fetch     : ambil satu postingan Instagram (media asli + caption + tanggal) memakai login Instagram di Chrome,\n//                   lalu titipkan file medianya di Supabase Storage (bucket tmp-media) untuk dibaca server BAMBANG.\n//                   v0.3: sekalian simpan thumbnail kecil (+ foto profil kalau diminta) ke bucket thumbs.\n// 2. ig-profile   : kumpulkan SEMUA link postingan sebuah akun Instagram, diurutkan dari yang paling lama.\n//                   v0.3: + tab Reels (reels yang disembunyikan dari grid ikut terkumpul), + foto profil, + thumbnail.\n// 3. ig-check-new : (baru v0.3) cek postingan baru saja: baca halaman terbaru sampai ketemu link yang sudah ada.\n//                   Biasanya cukup 1–2 permintaan ke Instagram.\n\nconst IG_APP_ID = '936619743392459';\nconst ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';\nconst BUCKET = 'tmp-media';\nconst THUMBS = 'thumbs';\nconst MAX_FILE = 50 * 1024 * 1024; // batas file Supabase (paket gratis)\nconst MAX_THUMB = 2 * 1024 * 1024;\nconst IG_HEADERS = { 'x-ig-app-id': IG_APP_ID, 'x-requested-with': 'XMLHttpRequest', 'accept': 'application/json' };\n\n/* ---------- util ---------- */\nfunction shortcodeOf(url) {\n  const m = String(url || '').match(/instagram\\.com\\/(?:[\\w.]+\\/)?(?:p|reel|reels|tv)\\/([A-Za-z0-9_-]+)/i);\n  return m ? m[1] : null;\n}\nfunction mediaIdOf(shortcode) {\n  let n = 0n;\n  for (const ch of shortcode.slice(0, 11)) {\n    const i = ALPHA.indexOf(ch);\n    if (i < 0) throw new Error('Kode link Instagram tidak valid');\n    n = n * 64n + BigInt(i);\n  }\n  return n.toString();\n}\nfunction usernameOf(input) {\n  const s = String(input || '').trim();\n  const m = s.match(/instagram\\.com\\/([A-Za-z0-9_.]+)/i);\n  const u = (m ? m[1] : s).replace(/^@/, '').replace(/\\/.*$/, '').trim();\n  if (!u || /^(p|reel|reels|tv|stories|explore)$/i.test(u) || !/^[A-Za-z0-9_.]{1,30}$/.test(u)) return null;\n  return u.toLowerCase();\n}\nconst sleep = (ms) => new Promise((r) => setTimeout(r, ms));\nconst jitter = (a, b) => a + Math.floor(Math.random() * (b - a));\nfunction extOf(mime) {\n  if (/mp4/.test(mime)) return 'mp4';\n  if (/webm/.test(mime)) return 'webm';\n  if (/png/.test(mime)) return 'png';\n  if (/webp/.test(mime)) return 'webp';\n  if (/heic/.test(mime)) return 'heic';\n  return mime.startsWith('video/') ? 'mp4' : 'jpg';\n}\nconst best = (arr) => (arr || []).slice().sort((a, b) => (b.width * b.height) - (a.width * a.height))[0];\n// gambar kecil untuk thumbnail: yang paling kecil tapi lebarnya minimal 240 px\nfunction smallImage(item) {\n  const src = (item && item.image_versions2 && item.image_versions2.candidates && item.image_versions2.candidates.length)\n    ? item.image_versions2.candidates\n    : (item && item.carousel_media && item.carousel_media[0] && item.carousel_media[0].image_versions2\n      ? item.carousel_media[0].image_versions2.candidates : []);\n  const list = (src || []).filter((c) => c && c.url).sort((a, b) => a.width - b.width);\n  return (list.find((c) => c.width >= 240) || list[list.length - 1] || {}).url || null;\n}\nfunction typeOf(it) {\n  return it.media_type === 8 ? 'carousel' : it.media_type === 2 ? (it.product_type === 'clips' ? 'reels' : 'video') : 'gambar';\n}\nfunction linkOf(it) {\n  const isVideo = it.product_type === 'clips' || it.media_type === 2;\n  return `https://www.instagram.com/${isVideo ? 'reel' : 'p'}/${it.code}/`;\n}\n\n/* ---------- Instagram: permintaan data ---------- */\nfunction parseJson(text, status) {\n  let j;\n  try { j = JSON.parse(text); } catch { j = null; }\n  if (status === 429 || /please wait a few minutes/i.test(text || '')) throw new Error('Instagram membatasi permintaan (terlalu cepat). Tunggu 10–15 menit.');\n  if (!j) throw new Error(status === 404 ? 'Tidak ditemukan (mungkin sudah dihapus)' : `Instagram tidak mengembalikan data (HTTP ${status}). Pastikan kamu login Instagram di Chrome.`);\n  if (j.require_login || j.message === 'login_required') throw new Error('Instagram minta login. Buka instagram.com di Chrome dan login dulu.');\n  if (j.status === 'fail' && j.message) throw new Error(`Instagram: ${j.message}`);\n  return j;\n}\nasync function getDirect(path) {\n  const r = await fetch(`https://www.instagram.com${path}`, { credentials: 'include', headers: IG_HEADERS });\n  return parseJson(await r.text(), r.status);\n}\nfunction waitComplete(tabId, timeout = 20000) {\n  return new Promise((resolve) => {\n    const t = setTimeout(() => { chrome.tabs.onUpdated.removeListener(on); resolve(); }, timeout);\n    function on(id, info) { if (id === tabId && info.status === 'complete') { clearTimeout(t); chrome.tabs.onUpdated.removeListener(on); resolve(); } }\n    chrome.tabs.onUpdated.addListener(on);\n  });\n}\n// jalankan permintaan dari dalam tab instagram.com (pasti membawa login). body != null → POST (form) dengan csrftoken.\nasync function runInIgTab(path, body) {\n  let [tab] = await chrome.tabs.query({ url: 'https://www.instagram.com/*' });\n  let created = false;\n  if (!tab) { tab = await chrome.tabs.create({ url: 'https://www.instagram.com/', active: false }); created = true; await waitComplete(tab.id); }\n  try {\n    const [res] = await chrome.scripting.executeScript({\n      target: { tabId: tab.id }, world: 'MAIN',\n      func: async (p, headers, form) => {\n        try {\n          const h = Object.assign({}, headers);\n          const opt = { credentials: 'include', headers: h };\n          if (form != null) {\n            const m = document.cookie.match(/(?:^|;\\s*)csrftoken=([^;]+)/);\n            if (m) h['x-csrftoken'] = decodeURIComponent(m[1]);\n            h['content-type'] = 'application/x-www-form-urlencoded';\n            opt.method = 'POST';\n            opt.body = form;\n          }\n          const r = await fetch(p, opt);\n          return { status: r.status, text: await r.text() };\n        } catch (e) { return { status: 0, text: '', error: String(e) }; }\n      },\n      args: [path, IG_HEADERS, body == null ? null : body],\n    });\n    const out = res && res.result;\n    if (!out || out.error) throw new Error(out && out.error ? out.error : 'Gagal menjalankan permintaan di tab Instagram');\n    return parseJson(out.text, out.status);\n  } finally {\n    if (created) chrome.tabs.remove(tab.id).catch(() => {});\n  }\n}\n// coba langsung dulu; kalau gagal, lewat tab instagram.com. Pilihan yang berhasil diingat selama satu tugas.\nasync function igGet(path, ctx, report) {\n  if (!ctx.viaTab) {\n    try { return await getDirect(path); }\n    catch (e1) {\n      if (/membatasi|dihapus|Tidak ditemukan/i.test(e1.message)) throw e1;\n      ctx.viaTab = true;\n      if (report) report('Mencoba lewat tab Instagram…');\n      try { return await runInIgTab(path, null); }\n      catch (e2) {\n        const friendly = (m) => /error page|Cannot access|No tab/i.test(m) ? 'instagram.com tidak bisa dibuka di Chrome (cek koneksi internet)' : m;\n        throw new Error(`${friendly(e1.message)}. Cara cadangan juga gagal: ${friendly(e2.message)}`);\n      }\n    }\n  }\n  return runInIgTab(path, null);\n}\n\n/* ---------- Supabase Storage ---------- */\nfunction needSb(sb) {\n  if (!sb || !sb.url || !sb.key || !sb.token || !sb.uid) throw new Error('Data login Supabase tidak dikirim oleh halaman BAMBANG');\n}\nasync function uploadTo(sb, bucket, path, buf, mime) {\n  const r = await fetch(`${sb.url}/storage/v1/object/${bucket}/${path}`, {\n    method: 'POST',\n    headers: { 'Authorization': `Bearer ${sb.token}`, 'apikey': sb.key, 'Content-Type': mime, 'x-upsert': 'true', 'cache-control': 'max-age=31536000' },\n    body: buf,\n  });\n  if (!r.ok) throw new Error(`Gagal menitipkan file ke Supabase (HTTP ${r.status}): ${(await r.text()).slice(0, 200)}`);\n}\nasync function fetchMedia(url, max = MAX_FILE) {\n  const r = await fetch(url, { credentials: 'omit' });\n  if (!r.ok) throw new Error(`Gagal mengunduh media (HTTP ${r.status})`);\n  const mime = (r.headers.get('content-type') || '').split(';')[0] || 'application/octet-stream';\n  const buf = await r.arrayBuffer();\n  if (buf.byteLength > max) throw new Error(`File terlalu besar (${(buf.byteLength / 1048576).toFixed(1)} MB)`);\n  return { buf, mime };\n}\n// simpan gambar kecil ke bucket thumbs. Gagal = tidak apa-apa (thumbnail hanya pelengkap).\nasync function saveImage(sb, url, path) {\n  if (!url) return null;\n  try {\n    const { buf, mime } = await fetchMedia(url, MAX_THUMB);\n    const m = /png/.test(mime) ? 'image/png' : /webp/.test(mime) ? 'image/webp' : 'image/jpeg';\n    await uploadTo(sb, THUMBS, path, buf, m);\n    return path;\n  } catch { return null; }\n}\nconst thumbPath = (sb, code) => `${sb.uid}/t/${code}.jpg`;\nconst ppPath = (sb, username) => `${sb.uid}/pp/${String(username).replace(/^@/, '')}.jpg`;\n\n/* ---------- ig-fetch: satu postingan ---------- */\nfunction normalize(item, shortcode) {\n  const pick = (m) => {\n    if (m.video_versions && m.video_versions.length) { const v = best(m.video_versions); return { kind: 'video', url: v.url }; }\n    const img = best(m.image_versions2 && m.image_versions2.candidates);\n    return img ? { kind: 'image', url: img.url } : null;\n  };\n  const media = (item.carousel_media && item.carousel_media.length ? item.carousel_media.map(pick) : [pick(item)]).filter(Boolean);\n  const d = item.taken_at ? new Date(item.taken_at * 1000) : null;\n  const pad = (n) => String(n).padStart(2, '0');\n  const user = item.user || {};\n  return {\n    platform: 'Instagram',\n    shortcode,\n    username: user.username ? '@' + user.username : '',\n    full_name: user.full_name || '',\n    user_id: user.pk || user.id ? String(user.pk || user.id) : '',\n    caption: (item.caption && item.caption.text) || '',\n    taken_at: d ? d.toISOString() : null,\n    post_date: d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : null,\n    type: typeOf(item),\n    duration: item.video_duration || null,\n    media,\n    _thumb: smallImage(item),\n    _pp: user.profile_pic_url || null,\n  };\n}\nasync function igFetch(payload, report) {\n  const shortcode = shortcodeOf(payload.url);\n  if (!shortcode) throw new Error('Ini bukan link postingan Instagram (/p/, /reel/, atau /tv/)');\n  const id = mediaIdOf(shortcode);\n  const ctx = {};\n\n  report('Membaca data postingan dari Instagram…');\n  const j = await igGet(`/api/v1/media/${id}/info/`, ctx, report);\n  if (!j.items || !j.items.length) throw new Error(j.message ? `Instagram: ${j.message}` : 'Data postingan kosong (mungkin sudah dihapus atau akun private)');\n  const meta = normalize(j.items[0], shortcode);\n  if (!meta.media.length) throw new Error('Postingan tidak punya file video/foto yang bisa diambil');\n  const thumbUrl = meta._thumb; const ppUrl = meta._pp;\n  delete meta._thumb; delete meta._pp;\n  if (payload.metaOnly) { meta.media = meta.media.map(({ kind }) => ({ kind })); return { ok: true, meta, paths: [] }; }\n\n  const sb = payload.sb; needSb(sb);\n  let thumb_path = null; let pp_path = null;\n  if (payload.thumb !== false) thumb_path = await saveImage(sb, thumbUrl, thumbPath(sb, shortcode));\n  if (payload.pp && meta.username) pp_path = await saveImage(sb, ppUrl, ppPath(sb, meta.username));\n  if (payload.thumbOnly) { meta.media = meta.media.map(({ kind }) => ({ kind })); return { ok: true, meta, paths: [], thumb_path, pp_path }; }\n\n  const paths = []; let bytes = 0;\n  for (let i = 0; i < meta.media.length; i++) {\n    report(`Mengunduh file ${i + 1} dari ${meta.media.length}…`);\n    const { buf, mime } = await fetchMedia(meta.media[i].url);\n    const path = `${sb.uid}/${shortcode}-${Date.now()}-${String(i + 1).padStart(2, '0')}.${extOf(mime)}`;\n    report(`Menitipkan file ${i + 1} dari ${meta.media.length}…`);\n    await uploadTo(sb, BUCKET, path, buf, mime);\n    paths.push(path); bytes += buf.byteLength;\n    if (i < meta.media.length - 1) await sleep(400);\n  }\n  meta.media = meta.media.map(({ kind }) => ({ kind })); // link CDN tidak perlu dikirim balik\n  return { ok: true, meta, paths, bytes, mb: +(bytes / 1048576).toFixed(2), thumb_path, pp_path };\n}\n\n/* ---------- bersama: ubah item Instagram jadi baris link ---------- */\nfunction toLink(it, userId) {\n  const pinned = [].concat(it.timeline_pinned_user_ids || [], it.clips_tab_pinned_user_ids || []).map(String).includes(String(userId));\n  return {\n    code: it.code,\n    url: linkOf(it),\n    taken_at: it.taken_at ? new Date(it.taken_at * 1000).toISOString() : null,\n    type: typeOf(it),\n    pinned,\n    _thumb: smallImage(it),\n  };\n}\nasync function profileInfo(username, ctx, report) {\n  const pj = await igGet(`/api/v1/users/web_profile_info/?username=${encodeURIComponent(username)}`, ctx, report);\n  const u = pj && pj.data && pj.data.user;\n  if (!u || !u.id) throw new Error(`Akun @${username} tidak ditemukan`);\n  if (u.is_private && !u.followed_by_viewer) throw new Error(`Akun @${username} private dan kamu belum mengikutinya`);\n  return u;\n}\nfunction profileOut(u, username, pp_path) {\n  return {\n    username: '@' + (u.username || username),\n    full_name: u.full_name || '',\n    id: String(u.id),\n    post_count: (u.edge_owner_to_timeline_media && u.edge_owner_to_timeline_media.count) || 0,\n    is_private: !!u.is_private,\n    profile_url: `https://www.instagram.com/${u.username || username}/`,\n    pp_path: pp_path || null,\n  };\n}\n// tab Reels: reels yang disembunyikan dari grid hanya ada di sini\nasync function clipsPage(userId, maxId) {\n  const form = `target_user_id=${encodeURIComponent(userId)}&page_size=12&include_feed_video=true${maxId ? `&max_id=${encodeURIComponent(maxId)}` : ''}`;\n  const j = await runInIgTab('/api/v1/clips/user/', form);\n  const items = (j.items || []).map((x) => x && x.media).filter((m) => m && m.code);\n  const p = j.paging_info || {};\n  return { items, more: !!p.more_available, next: p.max_id || '' };\n}\nasync function saveThumbs(sb, links, skip, report) {\n  const todo = links.filter((l) => l._thumb && !skip.has(l.code));\n  let n = 0;\n  for (const l of todo) {\n    n++;\n    // report() juga menjaga service worker tetap hidup selama tugas panjang\n    if (n % 5 === 1) report(`Menyimpan thumbnail ${n} dari ${todo.length}…`);\n    l.thumb_path = await saveImage(sb, l._thumb, thumbPath(sb, l.code));\n    await sleep(120);\n  }\n  for (const l of links) delete l._thumb;\n}\n\n/* ---------- ig-profile: semua link postingan satu akun ---------- */\nasync function igProfile(payload, report) {\n  const username = usernameOf(payload.username || payload.url);\n  if (!username) throw new Error('Tulis username Instagram (contoh: @ux.anjar) atau link profilnya');\n  const ctx = {};\n  report(`Membuka profil @${username}…`);\n  const u = await profileInfo(username, ctx, report);\n  const expected = (u.edge_owner_to_timeline_media && u.edge_owner_to_timeline_media.count) || 0;\n  const sb = payload.sb;\n  let pp_path = null;\n  if (sb && payload.thumbs !== false) { needSb(sb); pp_path = await saveImage(sb, u.profile_pic_url, ppPath(sb, u.username || username)); }\n\n  const seen = new Map();\n  let maxId = '';\n  let pages = 0;\n  const limit = Math.max(1, Math.min(+payload.limit || 5000, 5000));\n  while (pages < 250) {\n    const j = await igGet(`/api/v1/feed/user/${u.id}/?count=33${maxId ? `&max_id=${encodeURIComponent(maxId)}` : ''}`, ctx, report);\n    pages++;\n    for (const it of j.items || []) {\n      if (!it.code || seen.has(it.code)) continue;\n      seen.set(it.code, toLink(it, u.id));\n    }\n    report(`Mengumpulkan link… ${seen.size}${expected ? ` dari ${expected}` : ''}`);\n    if (seen.size >= limit || !j.more_available || !j.next_max_id) break;\n    maxId = j.next_max_id;\n    await sleep(jitter(1500, 2800)); // pelan supaya akun Instagram aman\n  }\n\n  // tab Reels (v0.3)\n  let reelsAdded = 0; let reelsError = null;\n  if (payload.reels !== false && seen.size < limit) {\n    try {\n      let next = ''; let rp = 0;\n      while (rp < 120) {\n        await sleep(jitter(1500, 2800));\n        const page = await clipsPage(u.id, next);\n        rp++;\n        for (const it of page.items) {\n          if (seen.has(it.code)) continue;\n          seen.set(it.code, toLink(it, u.id)); reelsAdded++;\n        }\n        report(`Memeriksa tab Reels… +${reelsAdded} reels yang tidak ada di grid`);\n        if (!page.more || !page.next) break;\n        next = page.next;\n      }\n    } catch (e) { reelsError = e && e.message ? e.message : String(e); }\n  }\n\n  const items = [...seen.values()].sort((a, b) => (a.taken_at || '').localeCompare(b.taken_at || ''));\n  if (sb && payload.thumbs !== false) await saveThumbs(sb, items, new Set(payload.skipThumbs || []), report);\n  else for (const l of items) delete l._thumb;\n  return { ok: true, profile: profileOut(u, username, pp_path), items, reels_added: reelsAdded, reels_error: reelsError };\n}\n\n/* ---------- ig-check-new: hanya postingan terbaru ---------- */\nasync function igCheckNew(payload, report) {\n  const username = usernameOf(payload.username || payload.url);\n  if (!username) throw new Error('Username Instagram tidak valid');\n  const known = new Set(payload.known || []);\n  const ctx = {};\n  let userId = payload.user_id ? String(payload.user_id) : '';\n  let u = null; let pp_path = null;\n  const sb = payload.sb;\n  if (!userId || payload.refreshProfile) {\n    report(`Membuka profil @${username}…`);\n    u = await profileInfo(username, ctx, report);\n    userId = String(u.id);\n    if (sb && payload.pp) { needSb(sb); pp_path = await saveImage(sb, u.profile_pic_url, ppPath(sb, u.username || username)); }\n  }\n  const found = new Map();\n  let requests = 0;\n  // grid: berhenti begitu ketemu link yang sudah ada (postingan yang dipin bisa lama, jadi dilewati)\n  let maxId = ''; let stop = false;\n  for (let p = 0; p < 4 && !stop; p++) {\n    const j = await igGet(`/api/v1/feed/user/${userId}/?count=12${maxId ? `&max_id=${encodeURIComponent(maxId)}` : ''}`, ctx, report);\n    requests++;\n    for (const it of j.items || []) {\n      if (!it.code) continue;\n      const l = toLink(it, userId);\n      if (known.has(it.code)) { if (!l.pinned) { stop = true; break; } continue; }\n      if (!found.has(it.code)) found.set(it.code, l);\n    }\n    if (stop || !j.more_available || !j.next_max_id) break;\n    maxId = j.next_max_id;\n    await sleep(jitter(1200, 2200));\n  }\n  // tab Reels halaman pertama saja\n  let reelsError = null;\n  if (payload.reels !== false) {\n    try {\n      await sleep(jitter(1200, 2200));\n      const page = await clipsPage(userId, '');\n      requests++;\n      for (const it of page.items) {\n        if (known.has(it.code) || found.has(it.code)) continue;\n        found.set(it.code, toLink(it, userId));\n      }\n    } catch (e) { reelsError = e && e.message ? e.message : String(e); }\n  }\n  const items = [...found.values()].sort((a, b) => (a.taken_at || '').localeCompare(b.taken_at || ''));\n  if (sb && items.length) { needSb(sb); await saveThumbs(sb, items, new Set(), report); }\n  else for (const l of items) delete l._thumb;\n  report(items.length ? `${items.length} postingan baru` : 'Tidak ada postingan baru');\n  return { ok: true, items, requests, user_id: userId, profile: u ? profileOut(u, username, pp_path) : null, reels_error: reelsError };\n}\n\n/* ---------- pesan dari halaman BAMBANG ---------- */\nchrome.runtime.onMessage.addListener((msg, sender, sendResponse) => {\n  const tabId = sender.tab && sender.tab.id;\n  const pid = msg && msg.payload && msg.payload.progressId;\n  const report = (text) => { if (tabId != null) chrome.tabs.sendMessage(tabId, { type: 'progress', id: pid, text }).catch(() => {}); };\n  (async () => {\n    try {\n      if (msg.type === 'ig-fetch') return sendResponse(await igFetch(msg.payload || {}, report));\n      if (msg.type === 'ig-profile') return sendResponse(await igProfile(msg.payload || {}, report));\n      if (msg.type === 'ig-check-new') return sendResponse(await igCheckNew(msg.payload || {}, report));\n      if (msg.type === 'version') return sendResponse({ ok: true, version: chrome.runtime.getManifest().version });\n      sendResponse({ ok: false, error: `Perintah tidak dikenal: ${msg.type}` });\n    } catch (e) {\n      sendResponse({ ok: false, error: e && e.message ? e.message : String(e) });\n    }\n  })();\n  return true; // jawaban dikirim belakangan\n});\n", "bridge.js": "// BAMBANG Helper — jembatan halaman ↔ extension (tidak berubah sejak v0.2)\n// Hanya aktif di halaman yang punya <meta name=\"bambang-app\"> (BAMBANG dan halaman tesnya).\n// Halaman mengirim: window.postMessage({source:'bambang-page', id, type, payload})\n// Extension menjawab: window.postMessage({source:'bambang-ext', id, ...hasil})\n// Kabar progres:      window.postMessage({source:'bambang-ext', type:'progress', id, text})\n(() => {\n  const VERSION = chrome.runtime.getManifest().version;\n  let enabled = false;\n  const queue = [];\n\n  const post = (data) => window.postMessage({ source: 'bamb function upsertLocal(table, row){
  if(table === 'engine_state'){ S.engine = {...(S.engine || {}), ...row}; return; }
  if(table === 'settings'){ S.settings = {...(S.settings || {}), ...row}; return; }
  const k = TKEY[table]; if(!k || !S[k]) return;

  if(i >= 0) arr[i] = {...arr[i], ...row};
  else { if(table === 'posts') row.theme_ids = row.theme_ids || []; if(table === 'activity'){ arr.unshift(row); if(arr.length > 300) arr.length = 300; } else arr.push(row); }

   MD: baca frontmatter hasil Gemini, tampilkan MD, ZIP tanpa library

function splitFM(md){
  let s = String(md || '').replace(/\r\n/g, '\n').trim();
  s = s.replace(/^```[a-z]*\s*\n/i, '').replace(/\n```\s*$/, '');
  const m = s.match(/^---\s*\n([\s\S]*?)\n---\s*(?:\n|$)/);
  if(!m) return {fm:{}, body:s, has:false};
  const fm = {};
  m[1].split('\n').forEach(line => {
    const mm = line.match(/^\s*([A-Za-z_]+)\s*:\s*(.*)$/); if(!mm) return;
    fm[mm[1].toLowerCase()] = mm[2].trim().replace(/^["']|["']$/g, '');
  });
  return {fm, body:s.slice(m[0].length).trim(), has:true};
}
const emptyV = v => !v || /^(-|—|tidak ada|none|null|tidak)$/i.test(String(v).trim());
function penutupFirst(body){
  const m = String(body || '').match(/##\s*Penutup\s*\n+\s*[-*]\s*([^\n]+)/i);
  if(!m) return '';
  return m[1].replace(/^\**\s*Inti( konten)?(\s+dalam[^:]*)?\s*:?\s*\**\s*:?\s*/i, '').trim();
}
function parseMD(md){
  const {fm, body} = splitFM(md); const r = {};
  if(!emptyV(fm.judul)) r.title = fm.judul;
  if(!emptyV(fm.judul_slug)) r.title_slug = slugify(fm.judul_slug);
  else if(r.title) r.title_slug = slugify(r.title).split('-').slice(0, 6).join('-');
  if(/^https?:\/\//i.test(fm.sumber || '')) r.url = fm.sumber.split(/\s/)[0];
  if(!emptyV(fm.tags)) r.tags = fm.tags.replace(/^\[|\]$/g, '').split(/[,;]/).map(t => slugify(t.replace(/#/g, ''))).filter(Boolean);
  if(!emptyV(fm.series_terdeteksi)) r.series = fm.series_terdeteksi;
  if(/^\d+/.test(fm.part_terdeteksi || '')) r.part = parseInt(fm.part_terdeteksi, 10);
  if('momen_visual' in fm){ r.has_visual = !emptyV(fm.momen_visual); r.visual_notes = r.has_visual ? fm.momen_visual : ''; }
  if(!emptyV(fm.audio)) r.audio = fm.audio;
  if(!emptyV(fm.jenis)){ let j = lc(fm.jenis); if(j === 'reel') j = 'reels'; r.jenis = j; }
  if(!emptyV(fm.mode)) r.mode = lc(fm.mode);
  const pj = String(fm.panjang || '').match(/^(\d{1,2}):(\d{2})/);
  if(pj) r.duration = +pj[1] * 60 + +pj[2];
  r.inti = !emptyV(fm.inti) ? fm.inti : penutupFirst(body);
  return r;
}
function computeRisk(md, promptVersion){
  const s = String(md || ''); const r = [];
  if(promptVersion && promptVersion < 'v2.3') r.push('versi_lama');
  if(/\naudio:\s*tidak terdengar/i.test(s)) r.push('audio');
  if(/\(tidak yakin\)/i.test(s)) r.push('tidak_yakin');
  if(/terlalu cepat|buram/i.test(s)) r.push('buram');
  return r;
}

/* penanda waktu/slide di awal baris: [00:12], [Slide 3], dan gaya lama (00:00 - 00:15, **00:00 | Judul**, Slide 1:) */
const TS_RE = /^(?:#{1,4}\s+)?(?:\d+[.)]\s+)?(?:[-*•]\s+)?(?:\*\*)?\s*(?:\[(?:Visual[^\]]*)\]\s*)?\[?(\d{1,2}):(\d{2})(?:\]|\b)/;
const SL_RE = /^(?:#{1,4}\s+)?(?:\d+[.)]\s+)?(?:[-*•]\s+)?(?:\*\*)?\s*\[?Slide\s+(\d+)\]?/i;
function markerOf(line){
  let m = line.match(TS_RE); if(m) return {t:+m[1] * 60 + +m[2]};
  m = line.match(SL_RE); if(m) return {slide:+m[1]};
  return null;
}
function mdToHtml(md, opt = {}){
  const fns = {}; const lines = [];
  String(md || '').replace(/\r\n/g, '\n').split('\n').forEach(l => {
    const f = l.match(/^\[\^(\d+)\]:\s*(.*)$/);
    if(f && opt.fn !== false) fns[f[1]] = f[2]; else lines.push(l);
  });
  const out = []; let list = null, para = [], paraMk = null, table = null;
  const inline = s => {
    let t = esc(s);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    if(opt.fn !== false) t = t.replace(/\[\^(\d+)\]/g, '<sup class="fn"><a href="#fn-$1" id="fnr-$1">$1</a></sup>');
    if(opt.src) t = t.replace(/\[((?:S\d+\s*,?\s*)+)\]/g, (all, g) => g.split(/\s*,\s*/).filter(Boolean).map(x => { const n = x.replace(/\D/g, ''); return `<a class="src" href="#src-${n}" data-src="${n}">[${n}]</a>`; }).join(''));
    if(opt.ts){
      t = t.replace(/^((?:\d+[.)]\s+)?(?:<strong>)?\s*)\[(\d{1,2}):(\d{2})\]/, (a, pre, m, s2) => `${pre}<button type="button" class="ts" data-t="${+m * 60 + +s2}">[${m}:${s2}]</button>`)
        .replace(/^((?:<strong>)?\s*)\[Slide (\d+)\]/i, (a, pre, n) => `${pre}<button type="button" class="ts" data-slide="${n}">[Slide ${n}]</button>`)
        .replace(/\[Visual(-dekoratif)?\]/g, '<span class="ts vis">[Visual$1]</span>');
    }
    return t;
  };
  const mkAttr = mk => !opt.ts || !mk ? '' : ` class="seg" ${mk.t != null ? `data-t="${mk.t}"` : `data-slide="${mk.slide}"`}`;
  const fP = () => { if(para.length){ out.push(`<p${mkAttr(paraMk)}>` + para.map(inline).join('<br>') + '</p>'); para = []; paraMk = null; } };
  const fL = () => { if(list){ out.push(`<${list.t}>` + list.items.map(i => `<li${mkAttr(i.mk)}>${inline(i.s)}</li>`).join('') + `</${list.t}>`); list = null; } };
  const fT = () => { if(table){ const [h, ...b] = table; out.push('<table><thead><tr>' + h.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' + b.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'); table = null; } };
  const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  for(const raw of lines){
    const l = raw.trimEnd(); let m;
    if(!l.trim()){ fP(); fL(); fT(); continue; }
    if(/^\s*\|.*\|\s*$/.test(l)){ fP(); fL(); if(/^\s*\|?\s*:?-{2,}/.test(l.replace(/\|/g, '|'))  && table){ continue; } (table = table || []).push(cells(l)); continue; } else fT();
    const mk = opt.ts ? markerOf(l.trim()) : null;
    if((m = l.match(/^(#{1,4})\s+(.*)$/))){ fP(); fL(); const n = Math.min(m[1].length + 1, 5); out.push(`<h${n}${mkAttr(mk)}>${inline(m[2])}</h${n}>`); continue; }
    if((m = l.match(/^>\s?(.*)$/))){ fP(); fL(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
    if((m = l.match(/^\s*[-*•]\s+(.*)$/))){ fP(); if(!list || list.t !== 'ul'){ fL(); list = {t:'ul', items:[]}; } list.items.push({s:m[1], mk}); continue; }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ fP(); if(!list || list.t !== 'ol'){ fL(); list = {t:'ol', items:[]}; } list.items.push({s:m[1], mk}); continue; }
    fL();
    if(mk && para.length){ fP(); }
    if(mk && !para.length) paraMk = mk;
    para.push(l.trim());
    if(mk) fP();
  }
  fP(); fL(); fT();
  const keys = Object.keys(fns);
  if(keys.length) out.push('<div class="fns"><div class="lbl">Catatan kaki</div><ol>' + keys.sort((a, b) => a - b).map(k => `<li id="fn-${k}" value="${k}">${inline(fns[k])} <a href="#fnr-${k}" aria-label="kembali ke teks">↩</a></li>`).join('') + '</ol></div>');
  return out.join('');
}
/* tandai kata yang dicari (setelah HTML dipasang) */
function markText(root, q){
  const words = String(q || '').trim().split(/\s+/).filter(w => w.length >= 2).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if(!root || !words.length) return;
  const re = new RegExp(`(${words.join('|')})`, 'gi');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    if(!re.test(n.nodeValue)) return; re.lastIndex = 0;
    const span = document.createElement('span');
    span.innerHTML = esc(n.nodeValue).replace(re, '<mark>$1</mark>');
    n.replaceWith(...span.childNodes);
  });
}
/* perbandingan sederhana per baris (untuk riwayat versi & hasil revisi) */
function lineDiff(a, b){
  const A = String(a || '').split('\n'), B = String(b || '').split('\n');
  const n = A.length, m = B.length;
  if(n * m > 400000) return B.map(l => `<span>${esc(l)}</span>`).join('\n');
  const dp = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while(i < n && j < m){
    if(A[i] === B[j]){ out.push(`<span>${esc(A[i])}</span>`); i++; j++; }
    else if(dp[i + 1][j] >= dp[i][j + 1]){ out.push(`<span class="d">${esc(A[i])}</span>`); i++; }
    else { out.push(`<span class="a">${esc(B[j])}</span>`); j++; }
  }
  while(i < n) out.push(`<span class="d">${esc(A[i++])}</span>`);
  while(j < m) out.push(`<span class="a">${esc(B[j++])}</span>`);
  return out.join('\n');
}

/* ---------- ZIP tanpa library (teks atau biner) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for(let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files){
  const enc = new TextEncoder(), chunks = [], central = []; let offset = 0;
  const d = new Date();
  const dt = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dd = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for(const f of files){
    const name = enc.encode(f.name), data = f.bytes || enc.encode(f.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], {type:'application/zip'});
}

}
function buildVault(posts, meta){
  const root = `BAMBANG - ${fsafe(meta.name)}/`;
  const files = []; const names = new Map(); const used = {};
  posts.forEach(p => { let n = fileName(p).replace(/\.md$/, ''); if(used[n]){ used[n]++; n += '-' + used[n]; } else used[n] = 1; names.set(p.id, n); });
  const line = p => `- ${wl(names.get(p.id), titleOf(p))} — ${handleOf(p.account_id)}, ${fmtD(p.post_date)} · ${STATUS_TXT(p)}`;
  const byDate = arr => arr.slice().sort((a, b) => (a.post_date || '').localeCompare(b.post_date || ''));
  posts.forEach(p => files.push({name:root + 'Catatan/' + names.get(p.id) + '.md', text:noteContent(p, MD.get(p.id) || '', names.get(p.id))}));
  const tIds = new Set(); posts.forEach(p => postThemeSet(p).forEach(id => tIds.add(id)));
  const inExp = id => posts.filter(p => postThemeSet(p).has(id));
  const direct = id => posts.filter(p => (p.theme_ids || []).includes(id));
  [...tIds].map(thById).filter(Boolean).forEach(t => {
    const L = ['---', `jenis: ${t.parent_id ? 'subtema' : 'tema'}`];
    if(t.parent_id) L.push(`induk: ${yq(wl(thById(t.parent_id).name))}`);
    L.push('---', '', `# ${t.name}`, '');
    if(t.description) L.push(t.description, '');
    if(!t.parent_id){
      const subs = subsOf(t.id).filter(s => tIds.has(s.id));
      if(subs.length){ L.push('## Subtema'); subs.forEach(s => L.push(`- ${wl(s.name)} (${inExp(s.id).length} catatan)`)); L.push(''); }
      const d = direct(t.id);
      if(d.length){ L.push('## Catatan langsung di tema ini'); byDate(d).forEach(p => L.push(line(p))); L.push(''); }
    } else { L.push(`Bagian dari ${wl(thById(t.parent_id).name)}.`, '', '## Catatan'); byDate(direct(t.id)).forEach(p => L.push(line(p))); L.push(''); }
    files.push({name:root + 'Tema/' + fsafe(t.name) + '.md', text:L.join('\n')});
  });
  const aIds = [...new Set(posts.map(p => p.account_id))];
  aIds.forEach(id => {
    const a = accById(id); const ps = byDate(posts.filter(p => p.account_id === id));
    const L = ['---', 'jenis: kreator', `platform: ${a ? a.platform : ''}`, `profil: ${a && a.profile_url || ''}`, '---', '', `# ${handleOf(id)}`, '', `${ps.length} catatan dalam paket ini.`, '', '## Catatan'];
    ps.forEach(p => L.push(line(p)));
    files.push({name:root + 'Kreator/' + fsafe(handleOf(id)) + '.md', text:L.join('\n') + '\n'});
  });
  [...new Set(posts.map(p => p.series_id).filter(Boolean))].map(serById).filter(Boolean).forEach(s => {
    const ps = posts.filter(p => p.series_id === s.id).sort((x, y) => (x.part_number || 999) - (y.part_number || 999));
    const L = ['---', 'jenis: series', `kreator: ${yq(wl(handleOf(s.account_id)))}`, '---', '', `# ${s.name}`, ''];
    if(s.description) L.push(s.description, '');
    L.push('## Urutan'); ps.forEach(p => L.push(`${p.part_number ? p.part_number + '.' : '-'} ${wl(names.get(p.id), titleOf(p))}`));
    files.push({name:root + 'Series/' + fsafe(s.name) + '.md', text:L.join('\n') + '\n'});
  });
  const c = {sudah:posts.filter(p => p.check_status === 'sudah').length, revisi:posts.filter(p => p.check_status === 'revisi').length};
  const R = [`# Paket: ${meta.name}`, ''];
  if(meta.description) R.push(meta.description, '');
  R.push(`Diexport dari BAMBANG pada ${fmtD(todayWIB())}. Isi: **${posts.length} catatan** dari **${aIds.length} kreator**.`, '');
  if(meta.filter) R.push(`Cakupan: ${meta.filter}`, '');
  R.push('## Untuk Claude: cara membaca paket ini', '');
  R.push('- Setiap file di `Catatan/` adalah penjelasan **satu postingan sosmed** yang ditulis Gemini untuk pembaca yang tidak bisa melihat dan mendengar kontennya. Link asli ada di `sumber`.');
  R.push('- `status: sudah dicek` = Reyhan sudah membandingkan catatan dengan video aslinya. `belum dicek` = belum dibandingkan. `perlu revisi` = ada kesalahan yang diketahui, hati-hati.');
  R.push('- Penanda `[00:12]` = detik di video, `[Slide 3]` = nomor slide carousel. **(tidak yakin)** = Gemini ragu, jangan dijadikan fakta. **[Tambahan]** = penjelasan Gemini sendiri.');
  R.push('- Folder `Tema/`, `Kreator/`, `Series/` berisi halaman indeks dengan tautan Obsidian `[[nama-file]]`.', '');
  R.push('## Kualitas', '', `- Sudah dicek: ${c.sudah} dari ${posts.length}`, `- Perlu revisi: ${c.revisi}`, '');
  R.push('## Peta tema', '');
  temas().filter(t => tIds.has(t.id)).forEach(t => { R.push(`- ${wl(t.name)} (${inExp(t.id).length})`); subsOf(t.id).filter(s => tIds.has(s.id)).forEach(s => R.push(`  - ${wl(s.name)} (${inExp(s.id).length})`)); });
  R.push('', '## Daftar catatan', '', '| Tanggal | Kreator | Judul | Status |', '|---|---|---|---|');
  byDate(posts).forEach(p => R.push(`| ${p.post_date || '-'} | ${handleOf(p.account_id)} | ${wl(names.get(p.id), titleOf(p).replace(/\|/g, '/')).replace('|', '\\|')} | ${STATUS_TXT(p)} |`));
  files.unshift({name:root + '_BACA-DULU.md', text:R.join('\n') + '\n'});
  return files;
}
async function exportZip(posts, meta, btn){
  if(!posts.length){ toast('Tidak ada catatan untuk diexport'); return; }

}

/* =========================================================
   EXTENSION BAMBANG Helper — jembatan lewat window.postMessage
   ========================================================= */
const EXT = {ready:false, version:null, old:false, ancient:false, progress:{}};
const verNum = v => String(v || '0').split('.').map(Number).reduce((s, n, i) => s + (n || 0) * [10000, 100, 1][i], 0);
window.addEventListener('message', e => {
  if(e.source !== window || !e.data || e.data.source !== 'bambang-ext') return;
  if(e.data.type === 'hello'){
    const first = !EXT.ready;
    Object.assign(EXT, {ready:true, version:e.data.version, old:verNum(e.data.version) < verNum(EXT_LATEST), ancient:verNum(e.data.version) < verNum('0.2.0')});
    paintChrome(); if(first && USER && BOOTED) engineBoot(); bump('ext');
  }
  if(e.data.type === 'progress' && EXT.progress[e.data.id]) EXT.progress[e.data.id](e.data.text);
});
function extCall(type, payload, onProgress, timeout = 240000){
  return new Promise((resolve, reject) => {
    const id = uid(); payload = {...payload, progressId:id};
    if(onProgress) EXT.progress[id] = onProgress;
    const done = () => { window.removeEventListener('message', on); clearTimeout(t); delete EXT.progress[id]; };
    const on = e => { if(e.source !== window || !e.data || e.data.source !== 'bambang-ext' || e.data.id !== id || e.data.type === 'progress') return; done(); resolve(e.data); };
    window.addEventListener('message', on);
    const t = setTimeout(() => { done(); reject(new Error(`Extension tidak menjawab (lebih dari ${Math.round(timeout / 60000)} menit)`)); }, timeout);
    window.postMessage({source:'bambang-page', id, type, payload}, location.origin);
  });
}

/* =========================================================
   MESIN — berjalan di tab Chrome laptop yang ada extension-nya
   status di database: siaga (laptop siap) · jalan · jeda · mati
   ========================================================= */
const GAP = [20000, 30000];                    // jeda aman antar postingan (acak)
const BUSY_WAIT = [120000, 240000, 480000];    // Gemini penuh: tunggu 2, 4, 8 menit
const QUOTA_WAIT = 30 * 60000;                 // kuota Gemini habis: coba lagi tiap 30 menit
const IG_LIMIT_WAIT = 15 * 60000;              // Instagram minta jeda
const STALE_MS = 150000;
const ENG = {role:'none', on:false, paused:false, stop:false, stopBy:'', scope:null, current:'', message:'', nextAt:null, busyPost:null,
  saved:0, failed:0, done:0, failStreak:0, tries:{}, durs:[], skip:new Set(), lastPush:0, collectAt:0, runId:null, revDone:0,
  extra:[], lastCheck:null, other:null, wake:null, health:{}, lastClean:0, cmdBusy:false};
const canHost = () => EXT.ready && !EXT.ancient;
const scopeOk = (accId, sc = ENG.scope) => !sc || sc.kind !== 'akun' || accId === sc.account_id;

function engView(){
  if(ENG.role !== 'none') return {local:true, status:ENG.on ? (ENG.paused ? 'jeda' : 'jalan') : 'siaga', current:ENG.current, message:ENG.message,
    next_at:ENG.nextAt ? new Date(ENG.nextAt).toISOString() : null, heartbeat_at:new Date().toISOString(), device:'laptop ini', done:ENG.done, total:ENG.done + pendingCount(),
    account_id:ENG.curAcc || null, command:null, health:{...ENG.health, ext:EXT.version}};
  const e = S.engine;
  if(!e) return {status:'mati'};
  const age = e.heartbeat_at ? Date.now() - Date.parse(e.heartbeat_at) : Infinity;
  if(age > STALE_MS) return {...e, status:(e.status === 'jalan' || e.status === 'jeda') ? 'hilang' : 'mati', stale:true, age};
  return {...e, age};
}
const laptopReady = () => { const v = engView(); return ['siaga', 'jalan', 'jeda'].includes(v.status); };

/* ---------- pekerjaan yang menunggu ---------- */
function pendingJobs(sc = ENG.scope){
  const collect = S.accounts.filter(a => a.collect_status === 'menunggu' && scopeOk(a.id, sc));
  const rev = S.posts.filter(p => p.job === 'revisi' && scopeOk(p.account_id, sc) && !ENG.skip.has(p.id));
  const re = S.posts.filter(p => p.job === 'ulang' && scopeOk(p.account_id, sc) && !ENG.skip.has(p.id));
  const q = S.queue.filter(x => x.status === 'antri' && (x.account_id ? scopeOk(x.account_id, sc) : (!sc || sc.kind !== 'akun')) && !ENG.skip.has(x.id))
    .sort((a, b) => (a.account_id ? 1 : 0) - (b.account_id ? 1 : 0) || String(a.account_id).localeCompare(String(b.account_id)) || a.position - b.position);
  return {collect, rev, re, q};
}
const pendingCount = sc => { const j = pendingJobs(sc); return j.collect.length + j.rev.length + j.re.length + j.q.length + ENG.extra.length; };
function igCountToday(){
  const st = S.engine && S.engine.session_stats || {};
  return st.date === todayWIB() ? (st.ig || 0) : 0;
}
async function bumpIg(){
  const d = todayWIB(); const st = {...(S.engine && S.engine.session_stats || {})};
  if(st.date !== d){ st.date = d; st.ig = 0; }
  st.ig = (st.ig || 0) + 1;
  S.engine = {...(S.engine || {}), session_stats:st};
  sb.from('engine_state').update({session_stats:st}).eq('owner', USER.id).eq('tab_id', TAB_ID).then(() => {});
}
function nextJob(){
  const j = pendingJobs();
  if(ENG.extra.length) return ENG.extra[0];
  const limit = S.settings ? S.settings.ig_daily_limit || 150 : 150;
  const igBlocked = igCountToday() >= limit;
  if(j.collect.length && Date.now() >= ENG.collectAt) return {kind:'collect', id:j.collect[0].id, key:'c:' + j.collect[0].id};
  const post = j.rev[0] ? {kind:'revisi', id:j.rev[0].id} : j.re[0] ? {kind:'ulang', id:j.re[0].id} : j.q[0] ? {kind:'q', id:j.q[0].id} : null;
  if(post){
    const url = post.kind === 'q' ? qById(post.id).url : postById(post.id).original_url;
    if(isIG(url) && igBlocked) return {kind:'limit'};
    return {...post, key:post.kind + ':' + post.id};
  }
  if(j.collect.length) return {kind:'wait', until:ENG.collectAt};
  return null;
}

/* ---------- status ke database ---------- */
async function pushEngine(force = false, claim = false){
  if(!USER || ENG.role === 'none') return;
  if(!force && !claim && Date.now() - ENG.lastPush < 4000) return;
  ENG.lastPush = Date.now();
  const row = {owner:USER.id, status:ENG.on ? (ENG.paused ? 'jeda' : 'jalan') : 'siaga', account_id:ENG.curAcc || null, tab_id:TAB_ID, device:DEVICE,
    current:ENG.current || null, message:ENG.message || null, done:ENG.done, total:ENG.done + pendingCount(),
    next_at:ENG.nextAt ? new Date(ENG.nextAt).toISOString() : null, heartbeat_at:new Date().toISOString(), updated_at:new Date().toISOString(),
    health:{...ENG.health, ext:EXT.version}};
  S.engine = {...(S.engine || {}), ...row};
  try {
    if(claim){ await sb.from('engine_state').upsert(row, {onConflict:'owner'}); return; }
    const {data, error} = await sb.from('engine_state').update(row).eq('owner', USER.id).eq('tab_id', TAB_ID).select('owner');
    if(!error && data && !data.length) lostHost('Mesin dipindahkan ke tab/perangkat lain');
  } catch(e){}
  paintChrome();
}
function lostHost(why){
  if(ENG.role === 'none') return;
  if(ENG.on){ ENG.stop = true; ENG.stopBy = why; }
  ENG.role = 'none'; ENG.other = why;
  toast(why); paintChrome(); bump('engine');
}
function onEngineRow(row){
  if(ENG.role !== 'none'){
    if(row.tab_id && row.tab_id !== TAB_ID){ S.engine = {...(S.engine || {}), ...row}; lostHost('Mesin dipindahkan ke tab/perangkat lain'); return; }
    if(row.command && !ENG.cmdBusy) handleCommand(row.command, row.command_payload);
    return;
  }
  S.engine = {...(S.engine || {}), ...row};
}
async function engineBoot(){
  if(!canHost() || ENG.role !== 'none' || !USER) return;
  const {data:e} = await sb.from('engine_state').select('*').maybeSingle();
  if(e) S.engine = e;
  const fresh = e && e.tab_id && e.tab_id !== TAB_ID && e.heartbeat_at && Date.now() - Date.parse(e.heartbeat_at) < STALE_MS && e.status !== 'mati';
  if(fresh){ ENG.other = `Mesin aktif di ${e.device || 'tab lain'}`; paintChrome(); bump('engine'); return; }
  await claimHost(e);
}
async function claimHost(prev){
  ENG.role = 'siaga'; ENG.other = null; ENG.current = ''; ENG.message = '';
  await pushEngine(true, true);
  logAct('mesin', 'info', `Laptop siaga (${DEVICE}, extension v${EXT.version}).`);
  paintChrome(); bump('engine');
  if(prev && prev.command && prev.command_at && Date.now() - Date.parse(prev.command_at) < 24 * 3600e3) handleCommand(prev.command, prev.command_payload);
}
async function takeOver(){
  if(!canHost()){ toast('Tab ini butuh extension BAMBANG Helper'); return; }
  const {data:e} = await sb.from('engine_state').select('*').maybeSingle();
  await claimHost(e && e.command ? e : null);
  toast('Tab ini sekarang jadi mesin');
}
setInterval(() => {

}, 20000);
setInterval(() => { if(ENG.role !== 'none' && !ENG.on) checkCommand(); }, 6000);
async function checkCommand(){
  if(ENG.cmdBusy || ENG.role === 'none') return;
  try {
    const {data} = await sb.from('engine_state').select('command,command_payload,tab_id').maybeSingle();
    if(!data) return;
    if(data.tab_id && data.tab_id !== TAB_ID){ lostHost('Mesin dipindahkan ke tab/perangkat lain'); return; }
    if(data.command) await handleCommand(data.command, data.command_payload);
  } catch(e){}
}
async function handleCommand(cmd, payload){
  if(ENG.cmdBusy) return;
  ENG.cmdBusy = true;
  try {
    await sb.from('engine_state').update({command:null, command_payload:null}).eq('owner', USER.id);
    if(S.engine){ S.engine.command = null; S.engine.command_payload = null; }
    const from = ' dari perangkat lain';
    if(cmd === 'jeda' && ENG.on && !ENG.paused){ ENG.paused = true; ENG.message = 'Dijeda' + from + '.'; logAct('kamu', 'info', 'Mesin dijeda' + from + '.'); }
    else if(cmd === 'lanjut' && ENG.on && ENG.paused){ ENG.paused = false; ENG.message = ''; ENG.failStreak = 0; ENG.tries = {}; logAct('kamu', 'info', 'Mesin dilanjutkan' + from + '.'); }
    else if(cmd === 'stop' && ENG.on){ ENG.stop = true; ENG.paused = false; ENG.stopBy = 'Dihentikan' + from; }
    else if(cmd === 'mulai' && !ENG.on){ engineRun(payload && payload.account_id ? {kind:'akun', account_id:payload.account_id} : {kind:'semua'}, 'HP'); }
    else if(cmd === 'mulai' && ENG.on && payload && !payload.account_id){ ENG.scope = {kind:'semua'}; }
    else if(cmd === 'cek_baru' && !ENG.on){ const n = await checkNew(payload && payload.account_id ? [payload.account_id] : null); if(n && payload && payload.proses) engineRun({kind:'semua'}, 'HP'); }
    pushEngine(true); paintChrome(); bump('engine');
  } finally { ENG.cmdBusy = false; }
}
/* perintah dari perangkat mana pun: laptop siaga menjalankannya; kalau laptop belum siaga, perintah menunggu */
async function sendCommand(cmd, payload = null){
  if(ENG.role !== 'none'){ return handleCommand(cmd, payload); }
  const row = {command:cmd, command_payload:payload, command_at:new Date().toISOString()};
  const {data, error} = await sb.from('engine_state').update(row).eq('owner', USER.id).select('owner');
  if(error){ fail('Gagal mengirim perintah', error); return false; }
  if(!data || !data.length){ const {error:e2} = await sb.from('engine_state').upsert({owner:USER.id, status:'mati', ...row}, {onConflict:'owner'}); if(e2){ fail('Gagal mengirim perintah', e2); return false; } }
  S.engine = {...(S.engine || {}), ...row};
  const label = {mulai:'mulai proses', jeda:'jeda', lanjut:'lanjutkan', stop:'hentikan', cek_baru:'cek postingan baru'}[cmd] || cmd;
  logAct('kamu', 'info', `Perintah "${label}" dikirim dari ${DEVICE}${laptopReady() ? '' : ' (menunggu laptop siaga)'}.`);
  toast(laptopReady() ? 'Perintah terkirim ke laptop. Berlaku dalam beberapa detik.' : 'Perintah disimpan. Dijalankan begitu laptop siaga.');
  paintChrome(); bump('engine');
  return true;
}
async function cancelCommand(){
  await sb.from('engine_state').update({command:null, command_payload:null}).eq('owner', USER.id);

}

function startProcessing(accountId = null){
  const payload = accountId ? {account_id:accountId} : null;

}
