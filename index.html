<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="bambang-app" content="main">
<title>BAMBANG</title>
<meta name="description" content="BAMBANG (Bot Analisis Materi Belajar, Awam Nan Gamblang) — gudang ide dari konten sosmed. Tersimpan di Supabase.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --sunk:#ebe7df; --ink:#1c1a17; --ink-2:#48443d; --muted:#736d62;
  --line:#e2ddd3; --line-2:#cfc8bc;
  --accent:#b5441b; --accent-h:#9c3913; --accent-soft:#f7e4da;
  --ok:#2d7a4b; --ok-soft:#e0f0e5; --warn:#8a5a00; --warn-soft:#fbeed2; --bad:#b42318; --bad-soft:#fbe2de;
  --vis:#3947a3; --vis-soft:#e6e9f7;
  --r:12px; --r-sm:7px;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* header */
.top{padding:20px 0 14px;display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand h1{font:800 30px/1 var(--f-display);letter-spacing:-.025em;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1 i{width:11px;height:11px;background:var(--accent);border-radius:2px;display:inline-block;transform:rotate(45deg);flex:none}
.brand p{margin:7px 0 0;color:var(--muted);font-size:12.5px}
.top-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sync{font:500 12px/1 var(--f-body);padding:6px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);display:inline-flex;gap:6px;align-items:center}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sync[data-state="saving"],.sync[data-state="loading"]{background:var(--warn-soft);color:var(--warn)}
.sync[data-state="error"]{background:var(--bad-soft);color:var(--bad)}
.sync .link-btn{font-size:12px;color:inherit;text-decoration:underline}
.ext{font:500 12px/1 var(--f-body);padding:6px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.ext.on{background:var(--ok-soft);color:var(--ok)}
.auth{min-height:60vh;display:grid;place-items:center;padding:24px 16px 60px}
.auth-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:12px}
.auth-card h2{margin:0;font:700 22px/1.2 var(--f-display)}
.auth-card > p{margin:-4px 0 4px;color:var(--muted);font-size:13px}
.auth-msg{margin:0;color:var(--bad);font-size:13px;min-height:1em}
.auth-card .btn{justify-content:center}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(243,241,236,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px;align-items:center}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:12px 10px 11px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab.home{font-weight:600;color:var(--ink-2)}
.tab .cnt{font:500 11px/1 var(--f-mono);background:var(--sunk);padding:3px 6px;border-radius:99px;color:var(--ink-2)}
.tab .cnt.hot{background:var(--bad-soft);color:var(--bad)}
.tab .cnt.acc{background:var(--accent-soft);color:var(--accent-h)}
.tab-sep{display:flex;align-items:center;gap:6px;padding:0 6px 0 14px;margin-left:6px;border-left:1px solid var(--line-2);font:600 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;height:18px}
.eng-pill{display:none;align-items:center;gap:8px;font-size:12.5px;background:var(--ink);color:#fff;border-radius:99px;padding:5px 12px;white-space:nowrap;flex:none;border:0;cursor:pointer}
.eng-pill.on{display:flex}
.eng-pill .pulse{width:7px;height:7px;border-radius:50%;background:#5fd38d;animation:pulse 1.8s infinite}
.eng-pill.jeda .pulse{background:#f0b44c;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,211,141,.6)}70%{box-shadow:0 0 0 7px rgba(95,211,141,0)}100%{box-shadow:0 0 0 0 rgba(95,211,141,0)}}
@media (prefers-reduced-motion:reduce){.eng-pill .pulse,.dot.run{animation:none}}

main{padding:22px 0 80px}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.vh h2{font:700 23px/1.15 var(--f-display);margin:0;letter-spacing:-.015em}
.vh p{margin:5px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}

/* buttons */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:#e8b9b3}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:11px 18px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{appearance:none;border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px}
.link-btn:hover{text-decoration:underline}

/* segmented */
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .cnt{font:500 11px/1 var(--f-mono);color:var(--muted)}

.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:0 0 16px}
.stats b{font:600 15px var(--f-mono);color:var(--ink);margin-right:4px}
.stats .hot b,.stats .hot{color:var(--bad)}

/* platform badge */
.pb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--pc,#777);color:#fff;font:600 9.5px/1 var(--f-mono);letter-spacing:.02em;flex:none}
.pb.lg{width:34px;height:34px;border-radius:9px;font-size:12px}

/* ============ BERANDA ============ */
.hello{font:800 clamp(26px,4.6vw,38px)/1.05 var(--f-display);letter-spacing:-.03em;margin:4px 0 6px}
.hello-sub{color:var(--muted);font-size:14px;margin:0 0 20px;max-width:60ch}
.choices{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-bottom:14px}
.choice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.choice h3{margin:0;font:700 19px/1.2 var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.choice h3 .n{font:600 11px/1 var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:4px 6px}
.choice > p{margin:-4px 0 0;color:var(--muted);font-size:13px}
.inrow{display:flex;gap:8px;flex-wrap:wrap}
.inrow input{flex:1;min-width:180px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:10px 12px;font-size:15px;background:#fff}
.inrow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.found{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfaf7;display:grid;gap:8px;font-size:13.5px}
.found .who{display:flex;gap:10px;align-items:center}
.found .who b{font:700 16px var(--f-display)}
.found .nums{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12.5px}
.found .nums b{font:600 13.5px var(--f-mono);color:var(--ink)}
.found .acts{display:flex;gap:6px;flex-wrap:wrap}
.status-line{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.status-line.bad{color:var(--bad)}
.acc-list{display:grid;gap:2px}
.acc-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px dashed var(--line)}
.acc-row:first-child{border-top:0}
.acc-row .nm{font-weight:600;font-size:14.5px;word-break:break-word}
.acc-row .sm{font-size:12px;color:var(--muted)}
.mini-bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:5px 0 3px;display:flex}
.mini-bar i{display:block;height:100%}
.mini-bar .s{background:var(--ok)}.mini-bar .g{background:var(--bad)}.mini-bar .l{background:var(--line-2)}

/* mesin */
.engine{background:var(--ink);color:#f3efe7;border-radius:14px;padding:16px 18px;display:grid;gap:12px;margin-bottom:14px}
.engine-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.engine-h .ttl{display:flex;align-items:center;gap:10px;font:700 17px/1.2 var(--f-display)}
.dot{width:10px;height:10px;border-radius:50%;background:#6b655b;flex:none}
.dot.run{background:#5fd38d;animation:pulse 1.8s infinite}
.dot.pause{background:#f0b44c}
.dot.dead{background:#e0705f}
.engine-h small{color:#b9b2a5;font-size:12.5px;font-weight:400;font-family:var(--f-body)}
.engine-now{font-size:14px;line-height:1.5}
.engine-now b{color:#fff}
.engine-now .sub{display:block;color:#b9b2a5;font-size:12.5px;margin-top:2px}
.eng-bar{height:8px;border-radius:99px;background:#3a3631;overflow:hidden;display:flex}
.eng-bar i{display:block;height:100%}
.eng-bar .s{background:#5fd38d}.eng-bar .g{background:#e0705f}.eng-bar .l{background:#6b655b}
.eng-nums{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:#b9b2a5}
.eng-nums b{font:600 14px var(--f-mono);color:#fff;margin-right:3px}
.eng-acts{display:flex;gap:6px;flex-wrap:wrap}
.engine .btn{background:#fff;border-color:#fff;color:var(--ink)}
.engine .btn.ghost{background:transparent;border-color:#5c574f;color:#f3efe7}
.engine .btn.ghost:hover{background:#2c2925}
.engine .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.engine .note{font-size:12.5px;color:#b9b2a5;margin:0}
.engine .warnmsg{background:#3d2f16;color:#f5d596;border-radius:8px;padding:9px 11px;font-size:13px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.panel-h h3{margin:0;font:700 16px/1.2 var(--f-display)}
.feed{list-style:none;margin:0;padding:0;display:grid;max-height:440px;overflow:auto}
.feed li{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.feed li:first-child{border-top:0}
.feed .who{font:600 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;padding:4px 6px;border-radius:5px;background:var(--sunk);color:var(--ink-2);align-self:start;margin-top:1px}
.feed .who.claude{background:var(--vis-soft);color:var(--vis)}
.feed .who.kamu{background:var(--accent-soft);color:var(--accent-h)}
.feed .t{word-break:break-word}
.feed .t.ok::before{content:"✓ ";color:var(--ok);font-weight:700}
.feed .t.error::before{content:"✗ ";color:var(--bad);font-weight:700}
.feed .t.warn::before{content:"! ";color:var(--warn);font-weight:700}
.feed time{grid-column:2;font-size:11.5px;color:var(--muted)}
.feed .t .link-btn{font-size:13.5px}
.res{display:grid}
.res button{appearance:none;border:0;background:none;text-align:left;padding:9px 0;border-top:1px dashed var(--line);cursor:pointer;display:grid;gap:2px}
.res button:first-child{border-top:0}
.res button:hover .rt{color:var(--accent)}
.res .rt{font-weight:600;font-size:14px;line-height:1.35}
.res .rm{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ============ BERI TEMA ============ */
.tnext{background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;overflow:hidden}
.tnext-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.tnext-h .k{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.tnext-h h3{margin:0;font:700 20px/1.25 var(--f-display);letter-spacing:-.01em}
.tnext-h .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tnext-b{padding:14px 16px;max-height:52vh;overflow:auto;background:#fdfcfa}
.tnext-f{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px;background:#fbfaf7}
.tnext-f .acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wait-list{margin-top:14px}
.wait-list ol{margin:6px 0 0;padding-left:22px;font-size:13.5px;color:var(--ink-2)}
.wait-list li{margin:3px 0}
details.prompt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
details.prompt summary{cursor:pointer;font-weight:600;font-size:14px}
.prompt-box pre{margin:10px 0 0;background:#1f1d1a;color:#ece6da;border-radius:var(--r-sm);padding:14px 14px 16px;font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.prompt-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}

/* cards (katalog) */
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px 12px}
.who{display:flex;gap:11px;align-items:center;min-width:0}
.who h3{margin:0;font:700 18px/1.2 var(--f-display);letter-spacing:-.01em;word-break:break-word}
.who h3 a{text-decoration:none}
.who h3 a:hover{text-decoration:underline}
.who small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.card-actions{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.prog{margin:0 16px;padding:11px 12px;background:var(--sunk);border-radius:var(--r-sm);display:grid;gap:3px}
.prog-main{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.prog-main .k{color:var(--muted);font-size:12.5px}
.prog-main a{font-size:12.5px;color:var(--accent)}
.prog-meta{font-size:12.5px;color:var(--muted)}
.prog-meta .hot{color:var(--bad);font-weight:600}
.sec{padding:12px 16px 14px}
.sec + .sec{padding-top:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.sec-h span{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.s-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.s-row:first-of-type{border-top:0}
.s-name{appearance:none;border:0;background:none;padding:0;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.s-name:hover{color:var(--accent)}
.s-desc{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{font:500 11.5px/1 var(--f-mono);min-width:26px;height:24px;display:inline-grid;place-items:center;border-radius:5px;background:var(--ok-soft);color:var(--ok);padding:0 6px}
.chip.miss{background:transparent;border:1.5px dashed var(--bad);color:var(--bad)}
.chip-note{font-size:12px;color:var(--bad);margin-left:4px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* theme chips */
.tc{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1;padding:5px 8px;border-radius:99px;background:#efe9df;color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.tc b{font-weight:600;color:var(--ink)}
.tc .sep{color:var(--muted)}
.tc.new{background:var(--accent-soft);color:var(--accent-h)}
.tc.new::after{content:"baru";font:600 9.5px/1 var(--f-mono);text-transform:uppercase;background:var(--accent);color:#fff;border-radius:4px;padding:2px 4px}
.tc.warn{background:var(--warn-soft);color:var(--warn)}
button.tc{cursor:pointer;font-family:inherit}
button.tc:hover{border-color:var(--line-2)}
.tcs{display:flex;flex-wrap:wrap;gap:5px}

/* theme tree */
.tree{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.t-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px;display:flex;flex-direction:column}
.t-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.t-name{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:left;font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.t-name:hover{color:var(--accent)}
.t-meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.t-num{font:600 22px/1 var(--f-mono);color:var(--ink)}
.t-desc{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.t-subs{margin-top:10px;border-top:1px solid var(--line);flex:1}
.t-sub{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.t-sub:last-child{border-bottom:0}
.t-sub button.s-name{font-weight:500}
.t-sub .n{font:500 12px var(--f-mono);color:var(--muted);display:flex;gap:10px;align-items:center}
.t-foot{display:flex;justify-content:space-between;align-items:center;padding-top:8px;gap:8px;flex-wrap:wrap}
.kr{display:flex;gap:3px;align-items:center}
.kr .pb{width:18px;height:18px;border-radius:5px;font-size:8px}
.icon-btn{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:600;padding:2px 4px;border-radius:5px}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.orphan{background:var(--warn-soft);border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;font-size:14px;color:#5f3f00}

/* empty */
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.4)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* langkah (antrian) */
.steps{display:grid;gap:14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:44px 1fr;overflow:hidden}
.step-n{background:var(--sunk);display:flex;justify-content:center;padding-top:16px;font:800 18px/1 var(--f-display);color:var(--ink-2)}
.step-b{padding:15px 16px 16px;min-width:0}
.step-b h3{margin:0;font:700 17px/1.25 var(--f-display)}
.step-b > p.hint{margin:4px 0 12px;color:var(--muted);font-size:13px}
details.step-more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
details.step-more > summary{cursor:pointer;font:700 16px/1.3 var(--f-display)}
details.step-more > p.hint{margin:6px 0 12px;color:var(--muted);font-size:13px}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 12;min-width:0}
.f.c6{grid-column:span 6}.f.c4{grid-column:span 4}.f.c8{grid-column:span 8}.f.c3{grid-column:span 3}.f.c9{grid-column:span 9}
.f > span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f > span em{font-style:normal;font-weight:400;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:8px 10px;font-size:14px}
.f textarea{font:13px/1.55 var(--f-mono);resize:vertical;min-height:210px}
.f input[type=checkbox],.f input[type=radio]{width:auto;padding:0;border:0;flex:none;box-shadow:none}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f .help{font-size:12px;color:var(--muted)}
.inline-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.inline-f input{border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;font-size:13px;min-width:170px;flex:1}
.box{grid-column:span 12;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:#fbfaf7}
.box-h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.box-h b{font-size:13px}
.box-h small{color:var(--muted);font-size:12px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.fname{font:500 12.5px var(--f-mono);background:var(--sunk);padding:8px 10px;border-radius:6px;word-break:break-all}
.warnbox{grid-column:span 12;border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:#5f3f00}
.warnbox.bad{background:var(--bad-soft);color:#7a1a12}
.form-foot{grid-column:span 12;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.tpick{margin-top:2px}
.tpick summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600;list-style:none;display:inline-block}
.tpick summary::-webkit-details-marker{display:none}
.tpick summary::before{content:"+ "}
.tpick[open] summary::before{content:"− "}
.tpick .tpg{margin-top:8px;display:grid;gap:8px;max-height:220px;overflow:auto;padding:8px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm)}
.tpick .tpg > div{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tpv{display:flex;flex-wrap:wrap;gap:5px;min-height:24px;align-items:center}

/* notes list */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-bottom:12px}
.filters .f > span{font-size:11.5px}
.filters .f input,.filters .f select{padding:7px 9px;font-size:13.5px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 8px;flex-wrap:wrap;font-size:13px}
.toolbar label{display:flex;align-items:center;gap:7px;cursor:pointer}
.toolbar input{accent-color:var(--accent)}
.rlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.r{display:grid;grid-template-columns:28px 1fr auto;gap:8px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.r:first-child{border-top:0}
.r:hover{background:#fcfbf8}
.r input{margin-top:4px;accent-color:var(--accent)}
.r-main{min-width:0;cursor:pointer}
.r-title{font-weight:600;font-size:15px;line-height:1.35}
.r-main:hover .r-title{color:var(--accent)}
.r-meta{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.r-meta .pb,.rm .pb{width:16px;height:16px;border-radius:4px;font-size:7.5px}
.r .tcs{margin-top:7px}
.badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.badge{font:600 11px/1 var(--f-body);padding:4px 7px;border-radius:5px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.vis{background:var(--vis-soft);color:var(--vis)}
.badge.acc{background:var(--accent-soft);color:var(--accent-h)}
.badge.skip{background:var(--sunk);color:var(--muted)}

/* antrian link */
.qbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line);margin:8px 0 6px}
.qbar i{display:block;height:100%}
.qbar .s{background:var(--ok)}.qbar .g{background:var(--bad)}.qbar .l{background:var(--line-2)}
.qnums{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.qnums b{font:600 13.5px var(--f-mono);color:var(--ink);margin-right:3px}
.qnext{margin-top:12px;border:1.5px solid var(--accent);border-radius:var(--r-sm);padding:11px 12px;display:grid;gap:8px;background:#fffaf6}
.qnext .k{font-size:11.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.07em}
.qnext .u{font:500 13px/1.4 var(--f-mono);word-break:break-all}
.qnext .u a{color:inherit}
.qnext .m{font-size:12.5px;color:var(--muted)}
.qacts{display:flex;gap:6px;flex-wrap:wrap}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qlist{border:1px solid var(--line);border-radius:var(--r-sm);max-height:56vh;overflow:auto;background:#fff}
.q-row{display:grid;grid-template-columns:46px 1fr auto;gap:4px 10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);font-size:13px}
.q-row:first-child{border-top:0}
.q-row.is-next{background:#fffaf6}
.q-n{font:600 12.5px var(--f-mono);color:var(--muted)}
.q-main{min-width:0}
.q-main a{font:500 12.5px/1.4 var(--f-mono);word-break:break-all;text-decoration:none}
.q-main a:hover{text-decoration:underline}
.q-meta{font-size:12px;color:var(--muted)}
.q-side{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.qprev{font-size:13px;background:var(--sunk);border-radius:var(--r-sm);padding:9px 11px}
.radio{display:grid;gap:6px;font-size:13.5px}
.radio label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio label.off{opacity:.5;cursor:not-allowed}
.r-empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}

/* packages */
.pk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.pk-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.pk-h h3{margin:0;font:700 19px/1.2 var(--f-display)}
.pk-h p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.pk-nums{display:flex;gap:18px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pk-nums b{font:600 16px var(--f-mono);color:var(--ink);margin-right:3px}
.pk-foot{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.ctree{display:grid;gap:4px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;background:#fff}
.ctree label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;padding:3px 0}
.ctree label.sub{padding-left:24px;font-size:13.5px}
.ctree label.top{font-weight:600;margin-top:4px}
.ctree label:first-child{margin-top:0}
.ctree input{accent-color:var(--accent)}
.ctree .n{font:500 11.5px var(--f-mono);color:var(--muted);margin-left:auto}
.live{font-size:13px;background:var(--sunk);border-radius:var(--r-sm);padding:9px 11px}

/* logs */
.log{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 14px}
.log + .log{margin-top:10px}
.log h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.log .when{font-size:12.5px;color:var(--muted)}
.log .num{text-align:right}
.log .num b{font:600 20px/1 var(--f-mono);display:block}
.log .num span{font-size:11.5px;color:var(--muted)}
.log .note{grid-column:span 2;font-size:13.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
.log .acts{grid-column:span 2;display:flex;justify-content:flex-end}

/* dialog */
dialog{border:0;padding:0;border-radius:14px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(20,15,10,.45)}
dialog.wide{width:min(820px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(28,24,20,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font:700 18px/1.25 var(--f-display);word-break:break-word}
.dlg-h p{margin:4px 0 0;font-size:12.5px;color:var(--muted);word-break:break-all}
.x{appearance:none;border:0;background:var(--sunk);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:17px;line-height:1;flex:none}
.dlg-b{padding:16px 18px;overflow:auto}
.dlg-f{display:flex;justify-content:space-between;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fbfaf7;flex-wrap:wrap}
.dlg-f .r-side{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}

/* note view */
.meta-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px;margin:0 0 14px}
.meta-grid dt{color:var(--muted)}
.meta-grid dd{margin:0;word-break:break-word}
.meta-grid dd a{word-break:break-all}
.visual-note{background:var(--vis-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:#2c3780;margin-bottom:14px;white-space:pre-wrap}
.md{font-size:14.5px;line-height:1.65}
.md h2,.md h3,.md h4,.md h5{font-family:var(--f-display);margin:20px 0 6px;letter-spacing:-.01em}
.md h2{font-size:19px}.md h3{font-size:16.5px}.md h4,.md h5{font-size:15px}
.md > :first-child{margin-top:0}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:2px 0}
.md code{font:12.5px var(--f-mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
.md blockquote{margin:0 0 10px;border-left:3px solid var(--line-2);padding:2px 12px;color:var(--ink-2)}
.md a{color:var(--accent);word-break:break-all}
.raw{margin:0;font:12.5px/1.6 var(--f-mono);white-space:pre-wrap;word-break:break-word;background:var(--sunk);padding:12px;border-radius:var(--r-sm)}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fresh{position:fixed;right:16px;bottom:22px;z-index:90;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}

footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--muted);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

@media (max-width:820px){
  .choices,.two{grid-template-columns:1fr}
}
@media (max-width:720px){
  .f.c6,.f.c4,.f.c8,.f.c3,.f.c9{grid-column:span 12}
  .filters .f.c4,.filters .f.c3{grid-column:span 6}
  .card-h{flex-direction:column}
  .step{grid-template-columns:1fr}
  .step-n{justify-content:flex-start;padding:12px 16px 0;background:none;font-size:13px;color:var(--accent)}
  .step-n::before{content:"Langkah\00a0"}
  .brand h1{font-size:26px}
  .r{grid-template-columns:24px 1fr}
  .badges{grid-column:2;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
  .nav .wrap{flex-direction:column;align-items:stretch;gap:0}
  .eng-pill{margin:0 0 8px;align-self:flex-start}
  .tree{grid-template-columns:1fr}
  .q-row{grid-template-columns:40px 1fr}
  .q-side{grid-column:2;justify-content:flex-start}
  .acc-row{grid-template-columns:auto 1fr}
  .acc-row > .btn,.acc-row > span.small{grid-column:2;justify-self:start}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><i aria-hidden="true"></i>BAMBANG</h1>
      <p>Bot Analisis Materi Belajar, Awam Nan Gamblang — gudang ide dari konten sosmed</p>
    </div>
    <div class="top-r app-only" hidden>
      <span class="ext" id="extChip" title="Extension BAMBANG Helper hanya ada di Chrome laptop">Extension: mencari…</span>
      <span class="sync" id="syncPill" data-state="loading" role="status">Memuat…</span>
      <button class="btn ghost sm" id="reloadBtn" title="Ambil ulang data terbaru dari cloud">Muat ulang</button>
    </div>
  </header>
</div>

<section class="auth" id="authScreen" hidden>
  <form class="auth-card" id="authForm">
    <h2>Masuk ke BAMBANG</h2>
    <p>Pakai email &amp; password user yang dibuat di Supabase (Authentication → Users).</p>
    <label class="f"><span>Email</span><input id="authEmail" type="email" autocomplete="username" required></label>
    <label class="f"><span>Password</span><input id="authPass" type="password" autocomplete="current-password" required></label>
    <p class="auth-msg" id="authMsg" role="alert"></p>
    <button class="btn pri" id="authBtn" type="submit">Masuk</button>
  </form>
</section>

<nav class="nav app-only" aria-label="Menu utama" hidden>
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab home" role="tab" data-view="beranda">Beranda</button>
      <span class="tab-sep" aria-hidden="true">Ruang kerja Claude</span>
      <button class="tab" role="tab" data-view="tema">Beri tema <span class="cnt acc" id="cTema">0</span></button>
      <button class="tab" role="tab" data-view="antrian">Antrian</button>
      <button class="tab" role="tab" data-view="katalog">Katalog</button>
      <button class="tab" role="tab" data-view="catatan">Catatan <span class="cnt" id="cCat">0</span></button>
      <button class="tab" role="tab" data-view="paket">Paket <span class="cnt" id="cPkt">0</span></button>
      <button class="tab" role="tab" data-view="log">Run Log</button>
    </div>
    <button class="eng-pill" id="engPill" type="button" title="Buka status mesin"><span class="pulse" aria-hidden="true"></span><span id="engPillTxt"></span></button>
  </div>
</nav>

<main class="wrap app-only" id="view" tabindex="-1" hidden></main>

<footer class="app-only" hidden>
  <div class="wrap">
    <span>Masuk sebagai <b id="userEmail"></b> · <button class="link-btn" id="logoutBtn">Keluar</button></span>
    <span>Tersambung ke Supabase · v0.5</span>
  </div>
</footer>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<button class="fresh" id="freshBtn" type="button" hidden>Ada data baru · tampilkan</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   BAMBANG v0.5 — dashboard simpel + ruang kerja Claude + mesin otomatis
   Mesin: extension BAMBANG Helper (ambil postingan) → server gemini-read (Gemini) → simpan catatan
   ========================================================= */
const PLATFORMS = ['Instagram','TikTok','YouTube','Threads','X','LinkedIn'];
const PMETA = {Instagram:['IG','#c92a6b'],TikTok:['TT','#161616'],YouTube:['YT','#d62a2a'],Threads:['TH','#3d434a'],X:['X','#26292d'],LinkedIn:['IN','#1864ab']};

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c === 'x' ? r : (r&3|8)).toString(16); }));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify = s => String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/^@/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
const fsafe = s => String(s||'').replace(/[\\/:*?"<>|#^\[\]]/g,'-').replace(/\s+/g,' ').trim() || 'tanpa-nama';
const fmtD = iso => { if(!iso) return '—'; const d = new Date(iso.length===10 ? iso+'T00:00:00' : iso); return isNaN(d) ? '—' : d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); };
const fmtDT = iso => { if(!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('id-ID',{day:'numeric',month:'short'}) + ', ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); };
const pad = n => String(n).padStart(2,'0');
const toLocalInput = iso => { if(!iso) return ''; const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const localDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => localDate(new Date());
const dur = (a,b) => { const m = Math.max(0, Math.round((new Date(b) - new Date(a))/60000)); return m < 60 ? `${m} mnt` : `${Math.floor(m/60)} j ${m%60} mnt`; };
const durMin = m => { m = Math.max(0, Math.round(m)); return m < 60 ? `${m} menit` : `${Math.floor(m/60)} jam ${m%60} menit`; };
const ago = iso => { if(!iso) return ''; const s = Math.round((Date.now() - new Date(iso)) / 1000); if(s < 45) return 'baru saja'; if(s < 3600) return `${Math.round(s/60)} mnt lalu`; if(s < 86400) return `${Math.round(s/3600)} jam lalu`; return fmtDT(iso); };
const lc = s => String(s||'').trim().toLowerCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* Instagram: kode link (shortcode) dan tanggal posting yang tersimpan di dalamnya */
const IG_ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
const igCode = url => { const m = String(url||'').match(/instagram\.com\/(?:[\w.]+\/)?(?:p|reel|reels|tv)\/([A-Za-z0-9_-]{5,})/i); return m ? m[1] : null; };
const isIG = url => !!igCode(url);
const isYT = url => /^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(String(url||''));
/* kunci pembanding link: /reel/KODE dan /p/KODE dianggap sama */
const ukey = u => { const c = igCode(u); return c ? 'ig:' + c : String(u||'').replace(/[?#].*$/,'').replace(/\/+$/,'').toLowerCase(); };
function igTime(url){
  const code = igCode(url);
  if(!code || code.length < 8 || code.length > 14 || typeof BigInt === 'undefined') return null;
  let n = 0n;
  for(const ch of code){ const i = IG_ALPHA.indexOf(ch); if(i < 0) return null; n = n * 64n + BigInt(i); }
  const ms = Number(n >> 23n) + 1314220021721;
  if(!isFinite(ms) || ms < 1314220021721 || ms > Date.now() + 864e5) return null;
  return ms;
}
function igDate(url){ const ms = igTime(url); return ms == null ? '' : localDate(new Date(ms)); }
const shortUrl = u => String(u||'').replace(/^https?:\/\/(www\.)?/i,'');

let S;

/* =========================================================

function progress(accId){
  const ps = S.posts.filter(p => p.account_id === accId).sort((a,b) => (a.post_date||'').localeCompare(b.post_date||''));
  const last = ps[ps.length-1] || null;
  const lastProcessed = ps.reduce((m,p) => (p.processed_at||'') > m ? p.processed_at : m, '');
  const series = seriesOf(accId).map(s => {
    const parts = ps.filter(p => p.series_id === s.id && p.part_number).map(p => p.part_number);
    const max = parts.length ? Math.max(...parts) : 0;
    const missing = []; for(let i=1;i<=max;i++) if(!parts.includes(i)) missing.push(i);
    return {...s, parts, max, missing, count: ps.filter(p => p.series_id === s.id).length};
  });
  const themeCount = {};
  ps.forEach(p => postThemeSet(p).forEach(id => { const t = thById(id); if(t && !t.parent_id) themeCount[id] = (themeCount[id]||0)+1; }));
  const topThemes = Object.entries(themeCount).sort((a,b) => b[1]-a[1]).map(([id,n]) => ({id,n}));
  return {count:ps.length, last, lastProcessed, series, topThemes, reprocess:ps.filter(p=>p.reprocess), unvalidated:ps.filter(p=>!p.validated).length, untagged:ps.filter(p=>!(p.theme_ids||[]).length).length};
}

function fileName(p){
  const acc = accById(p.account_id); const ser = p.series_id ? serById(p.series_id) : null;
  const parts = [slugify(acc ? acc.handle : 'kreator'), ser ? slugify(ser.name) : (p.title_slug || slugify(p.title) || 'tanpa-judul')];
  if(ser && p.part_number) parts.push('part' + p.part_number);
  parts.push(p.post_date || 'tanpa-tanggal');
  return parts.join('_') + '.md';
}

/* =========================================================
   PARSER hasil Gemini (frontmatter di antara ---)
   ========================================================= */
function splitFM(md){
  let s = String(md||'').replace(/\r\n/g,'\n').trim();
  s = s.replace(/^```[a-z]*\s*\n/i,'').replace(/\n```\s*$/,'');
  const m = s.match(/^---\s*\n([\s\S]*?)\n---\s*(?:\n|$)/);
  if(!m) return {fm:{}, body:s, has:false};
  const fm = {};
  m[1].split('\n').forEach(line => {
    const mm = line.match(/^\s*([A-Za-z_]+)\s*:\s*(.*)$/); if(!mm) return;
    fm[mm[1].toLowerCase()] = mm[2].trim().replace(/^["']|["']$/g,'');
  });
  return {fm, body:s.slice(m[0].length).trim(), has:true};
}
const empty = v => !v || /^(-|—|tidak ada|none|null|tidak)$/i.test(String(v).trim());
function parseMD(md){
  const {fm} = splitFM(md); const r = {};
  if(!empty(fm.judul)) r.title = fm.judul;
  if(!empty(fm.judul_slug)) r.title_slug = slugify(fm.judul_slug);
  else if(r.title) r.title_slug = slugify(r.title).split('-').slice(0,6).join('-');
  if(/^https?:\/\//i.test(fm.sumber||'')) r.url = fm.sumber.split(/\s/)[0];
  if(!empty(fm.tags)) r.tags = fm.tags.replace(/^\[|\]$/g,'').split(/[,;]/).map(t => slugify(t.replace(/#/g,''))).filter(Boolean);
  if(!empty(fm.series_terdeteksi)) r.series = fm.series_terdeteksi;
  if(/^\d+/.test(fm.part_terdeteksi||'')) r.part = parseInt(fm.part_terdeteksi,10);
  if('momen_visual' in fm){ r.has_visual = !empty(fm.momen_visual); r.visual_notes = r.has_visual ? fm.momen_visual : ''; }
  if(!empty(fm.tema)) r.tema = fm.tema;
  if(!empty(fm.audio)) r.audio = fm.audio;
  return r;
}

/* =========================================================
   TEMA — input teks "Tema > Subtema; Tema lain"
   ========================================================= */
function resolveThemes(str, commit=false){
  const items = []; const ids = [];
  const segs = String(str||'').split(/[;\n]/).map(s => s.trim()).filter(Boolean);
  const pending = [];
  const findT = n => thByName(n) || pending.find(t => lc(t.name) === lc(n));
  for(const seg of segs){
    const [rawT, rawS] = seg.split(/\s*(?:>|›|→)\s*/).map(x => (x||'').trim());
    if(!rawT) continue;
    let T = findT(rawT); let tNew = false; let note = '';
    if(!T){ T = {id:uid(), name:rawT, parent_id:null, description:''}; tNew = true; pending.push(T); }
    if(!rawS){
      if(!ids.includes(T.id)){ ids.push(T.id); items.push({id:T.id, label:T.parent_id ? thPath(T) : T.name, isNew:tNew, note}); }
      if(tNew && commit) S.themes.push(T);
      continue;
    }
    if(T.parent_id){ note = `"${T.name}" adalah subtema, dipakai induknya`; T = thById(T.parent_id); }
    let Sb = findT(rawS); let sNew = false;
    if(Sb && Sb.id === T.id) Sb = null;
    if(Sb && !Sb.parent_id){ note = `"${Sb.name}" sudah jadi tema utama, dipakai sebagai tema`; }
    else if(Sb && Sb.parent_id !== T.id){ const op = thById(Sb.parent_id) || pending.find(x => x.id === Sb.parent_id); note = `"${Sb.name}" sudah ada di bawah ${op ? op.name : 'tema lain'}`; }
    if(!Sb){ Sb = {id:uid(), name:rawS, parent_id:T.id, description:''}; sNew = true; pending.push(Sb); }
    if(tNew && commit && !S.themes.includes(T)) S.themes.push(T);
    if(sNew && commit) S.themes.push(Sb);
    if(!ids.includes(Sb.id)){
      ids.push(Sb.id);
      const parent = Sb.parent_id ? (thById(Sb.parent_id) || pending.find(x => x.id === Sb.parent_id)) : null;
      items.push({id:Sb.id, label: parent ? `${parent.name} › ${Sb.name}` : Sb.name, isNew: sNew || tNew, note});
    }
  }
  return {items, ids};
}
const themeInputValue = ids => ids.map(id => { const t = thById(id); if(!t) return ''; const p = t.parent_id ? thById(t.parent_id) : null; return p ? `${p.name} > ${t.name}` : t.name; }).filter(Boolean).join('; ');
function themeFieldHTML(id, value){

    <input id="${id}" name="tema" autocomplete="off" value="${esc(value||'')}" placeholder="contoh: UI > Hierarki Tombol; UX > Ergonomi Mobile"></label>
    <div class="f"><div class="tpv" id="${id}Prev"></div>
    <details class="tpick"><summary>Pilih dari tema yang sudah ada</summary><div class="tpg" id="${id}Pick"></div></details></div>`;
}
function bindThemeField(id, onChange){
  const inp = $('#'+id), prev = $('#'+id+'Prev'), pick = $('#'+id+'Pick');
  const tree = temas();
  pick.innerHTML = tree.length ? tree.map(t => `<div><button type="button" class="tc" data-v="${esc(t.name)}"><b>${esc(t.name)}</b></button>${subsOf(t.id).map(s => `<button type="button" class="tc" data-v="${esc(t.name)} > ${esc(s.name)}">${esc(s.name)}</button>`).join('')}</div>`).join('') : '<span class="small muted">Belum ada tema.</span>';
  const render = () => {
    const {items} = resolveThemes(inp.value);
    prev.innerHTML = items.length ? items.map(i => `<span class="tc ${i.isNew?'new':''} ${i.note?'warn':''}" title="${esc(i.note)}">${esc(i.label)}</span>`).join('') + (items.some(i => i.note) ? `<span class="small" style="color:var(--warn)">${esc(items.find(i => i.note).note)}</span>` : '') : '<span class="small muted">Belum ada tema dipilih</span>';
    if(onChange) onChange(items);
  };
  pick.onclick = e => { const b = e.target.closest('[data-v]'); if(!b) return; const cur = inp.value.split(';').map(s => s.trim()).filter(Boolean); if(!cur.map(lc).includes(lc(b.dataset.v))) cur.push(b.dataset.v); inp.value = cur.join('; '); inp.dispatchEvent(new Event('input')); };
  inp.addEventListener('input', render);
  render();
}

/* =========================================================
   MARKDOWN → HTML (sederhana)
   ========================================================= */
function mdToHtml(md){
  const lines = esc(md).split('\n'); const out = []; let list = null, para = [];
  const inline = s => s
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const fP = () => { if(para.length){ out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
  const fL = () => { if(list){ out.push(`<${list.t}>` + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`); list = null; } };
  for(const raw of lines){
    const l = raw.trimEnd(); let m;
    if(!l.trim()){ fP(); fL(); continue; }
    if((m = l.match(/^(#{1,4})\s+(.*)$/))){ fP(); fL(); const n = Math.min(m[1].length + 1, 5); out.push(`<h${n}>${inline(m[2])}</h${n}>`); continue; }
    if((m = l.match(/^&gt;\s?(.*)$/))){ fP(); fL(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); continue; }
    if((m = l.match(/^\s*[-*•]\s+(.*)$/))){ fP(); if(!list || list.t !== 'ul'){ fL(); list = {t:'ul',items:[]}; } list.items.push(m[1]); continue; }
    if((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ fP(); if(!list || list.t !== 'ol'){ fL(); list = {t:'ol',items:[]}; } list.items.push(m[1]); continue; }
    fL(); para.push(l.trim());
  }
  fP(); fL(); return out.join('');
}

/* =========================================================
   ZIP (tanpa library)
   ========================================================= */
const CRC_T = (() => { const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function makeZip(files){
  const enc = new TextEncoder(), chunks = [], central = []; let offset = 0;
  const d = new Date();
  const dt = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  const dd = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dt,true); lh.setUint16(12,dd,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true);
    lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true); ch.setUint16(12,dt,true); ch.setUint16(14,dd,true); ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true);
    ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true);
    ch.setUint32(38,0,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s,c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true);
  end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], {type:'application/zip'});
}
function downloadBlob(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

/* =========================================================
   EXPORT — vault Obsidian + _BACA-DULU.md untuk Claude
   ========================================================= */
const wl = (name, alias) => { const f = fsafe(name); return alias ? `[[${f}|${alias}]]` : (f === name ? `[[${name}]]` : `[[${f}|${name}]]`); };
const yq = s => JSON.stringify(String(s ?? ''));
const statusOf = p => p.reprocess ? 'perlu diproses ulang' : (p.validated ? 'tervalidasi' : 'belum divalidasi');
function noteContent(p, noteName){
  const a = accById(p.account_id), s = p.series_id ? serById(p.series_id) : null;
  const ts = [...postThemeSet(p)].map(thById).filter(Boolean);
  const top = ts.filter(t => !t.parent_id), sub = ts.filter(t => t.parent_id);
  const L = [];
  L.push('---');
  L.push(`judul: ${yq(p.title || p.title_slug || noteName)}`);
  L.push(`sumber: ${p.original_url}`);
  L.push(`kreator: ${yq(wl(a ? a.handle : 'tanpa-kreator'))}`);
  L.push(`platform: ${p.platform}`);
  L.push(`tanggal_post: ${p.post_date || ''}`);
  L.push(`diproses: ${(p.processed_at||'').slice(0,10)}`);
  L.push('tema:' + (top.length ? '\n' + top.map(t => `  - ${yq(wl(t.name))}`).join('\n') : ' []'));
  L.push('subtema:' + (sub.length ? '\n' + sub.map(t => `  - ${yq(wl(t.name))}`).join('\n') : ' []'));
  if(s){ L.push(`series: ${yq(wl(s.name))}`); if(p.part_number) L.push(`part: ${p.part_number}`); }
  L.push(`tags: [${(p.tags||[]).map(slugify).filter(Boolean).join(', ')}]`);
  L.push(`status: ${statusOf(p)}`);
  if(p.has_visual) L.push(`momen_visual: ${yq(p.visual_notes || 'ada')}`);
  L.push('---', '');
  L.push(`# ${p.title || noteName}`, '');
  L.push(splitFM(p.md_content).body);
  return L.join('\n') + '\n';
}
function buildVault(posts, meta){
  const root = `BAMBANG - ${fsafe(meta.name)}/`;
  const files = [];
  const names = new Map(); const used = {};
  posts.forEach(p => { let n = fileName(p).replace(/\.md$/,''); if(used[n]){ used[n]++; n += '-' + used[n]; } else used[n] = 1; names.set(p.id, n); });
  const line = p => { const a = accById(p.account_id); return `- ${wl(names.get(p.id), p.title || names.get(p.id))} — ${a ? a.handle : '?'}, ${fmtD(p.post_date)}${p.reprocess ? ' ⚠️ perlu diproses ulang' : ''}`; };
  const byDate = arr => arr.slice().sort((a,b) => (a.post_date||'').localeCompare(b.post_date||''));
  posts.forEach(p => files.push({name: root + 'Catatan/' + names.get(p.id) + '.md', text: noteContent(p, names.get(p.id))}));

  const tIds = new Set(); posts.forEach(p => postThemeSet(p).forEach(id => tIds.add(id)));
  const inExp = id => posts.filter(p => postThemeSet(p).has(id));
  const direct = id => posts.filter(p => (p.theme_ids||[]).includes(id));
  [...tIds].map(thById).filter(Boolean).forEach(t => {
    const L = ['---', `jenis: ${t.parent_id ? 'subtema' : 'tema'}`];
    if(t.parent_id) L.push(`induk: ${yq(wl(thById(t.parent_id).name))}`);
    L.push('---', '', `# ${t.name}`, '');
    if(t.description) L.push(t.description, '');
    if(!t.parent_id){
      const subs = subsOf(t.id).filter(s => tIds.has(s.id));
      if(subs.length){ L.push('## Subtema'); subs.forEach(s => L.push(`- ${wl(s.name)} (${inExp(s.id).length} catatan)`)); L.push(''); }
      const d = direct(t.id);
      if(d.length){ L.push('## Catatan langsung di tema ini'); byDate(d).forEach(p => L.push(line(p))); L.push(''); }
    } else {
      L.push(`Bagian dari ${wl(thById(t.parent_id).name)}.`, '', '## Catatan');
      byDate(direct(t.id)).forEach(p => L.push(line(p))); L.push('');
    }
    files.push({name: root + 'Tema/' + fsafe(t.name) + '.md', text: L.join('\n')});
  });

  const aIds = [...new Set(posts.map(p => p.account_id))];
  aIds.map(accById).filter(Boolean).forEach(a => {
    const ps = byDate(posts.filter(p => p.account_id === a.id));
    const L = ['---','jenis: kreator',`platform: ${a.platform}`,`profil: ${a.profile_url||''}`,'---','',`# ${a.handle}`,'',`${ps.length} catatan dalam paket ini.`,''];
    const ss = seriesOf(a.id).filter(s => ps.some(p => p.series_id === s.id));
    if(ss.length){ L.push('## Series'); ss.forEach(s => L.push(`- ${wl(s.name)}`)); L.push(''); }
    L.push('## Catatan'); ps.forEach(p => L.push(line(p)));
    files.push({name: root + 'Kreator/' + fsafe(a.handle) + '.md', text: L.join('\n') + '\n'});
  });

  const sIds = [...new Set(posts.map(p => p.series_id).filter(Boolean))];
  sIds.map(serById).filter(Boolean).forEach(s => {
    const a = accById(s.account_id);
    const ps = posts.filter(p => p.series_id === s.id).sort((x,y) => (x.part_number||999) - (y.part_number||999));
    const pr = progress(s.account_id).series.find(x => x.id === s.id);
    const L = ['---','jenis: series',`kreator: ${yq(wl(a ? a.handle : '?'))}`,'---','',`# ${s.name}`,''];
    if(s.description) L.push(s.description, '');
    if(pr && pr.missing.length) L.push(`⚠️ Part ${pr.missing.join(', ')} belum ada di BAMBANG.`, '');
    L.push('## Urutan');
    ps.forEach(p => L.push(`${p.part_number ? p.part_number + '.' : '-'} ${wl(names.get(p.id), p.title || names.get(p.id))}`));
    files.push({name: root + 'Series/' + fsafe(s.name) + '.md', text: L.join('\n') + '\n'});
  });

  const nVal = posts.filter(p => p.validated).length, nRe = posts.filter(p => p.reprocess).length, nVis = posts.filter(p => p.has_visual).length;
  const R = [];
  R.push(`# Paket: ${meta.name}`, '');
  if(meta.description) R.push(meta.description, '');
  R.push(`Diexport dari BAMBANG pada ${fmtD(today())}. Isi: **${posts.length} catatan** dari **${aIds.length} kreator**, mencakup **${[...tIds].filter(id => { const t = thById(id); return t && !t.parent_id; }).length} tema**.`, '');
  if(meta.filter) R.push(`Cakupan: ${meta.filter}`, '');
  R.push('## Untuk Claude: cara membaca paket ini', '');
  R.push('- Setiap file di folder `Catatan/` adalah penjelasan **satu postingan sosmed** yang ditulis Gemini untuk pembaca yang tidak bisa melihat dan mendengar kontennya. File video/gambar aslinya sudah dihapus, jadi catatan ini satu-satunya sumber. Link asli ada di `sumber`.');
  R.push('- Bagian di antara `---` di atas tiap file (frontmatter) adalah kartu identitas: sumber, kreator, tanggal, tema, subtema, series, tags, status.');
  R.push('- `status: tervalidasi` = sudah dicek manual oleh Reyhan. `belum divalidasi` = belum dicek. `perlu diproses ulang` = diketahui kurang lengkap/akurat, perlakukan dengan hati-hati.');
  R.push('- Tanda **(tidak yakin)** = Gemini tidak yakin soal nama/istilah itu. Jangan dijadikan fakta tanpa konfirmasi.');
  R.push('- Label **[Tambahan]** = penjelasan dari Gemini sendiri, bukan isi asli konten.');
  R.push('- `momen_visual` = bagian yang aslinya visual; teks hanya menggambarkannya.');
  R.push('- Folder `Tema/`, `Kreator/`, `Series/` berisi halaman indeks yang menghubungkan catatan dengan format tautan Obsidian `[[nama-file]]`.');
  R.push('- Tema dan subtema dipilih oleh Claude in Chrome setelah membaca catatan. Kalau ada yang janggal, sampaikan ke Reyhan.', '');
  R.push('## Kualitas', '', `- Tervalidasi: ${nVal} dari ${posts.length}`, `- Perlu diproses ulang: ${nRe}`, `- Punya momen visual: ${nVis}`, '');
  R.push('## Peta tema', '');
  temas().filter(t => tIds.has(t.id)).forEach(t => {
    R.push(`- ${wl(t.name)} (${inExp(t.id).length})`);
    subsOf(t.id).filter(s => tIds.has(s.id)).forEach(s => R.push(`  - ${wl(s.name)} (${inExp(s.id).length})`));
  });
  const noTheme = posts.filter(p => !(p.theme_ids||[]).length).length;
  if(noTheme) R.push(`- Tanpa tema (${noTheme})`);
  R.push('', '## Kreator', '');
  aIds.map(accById).filter(Boolean).forEach(a => R.push(`- ${wl(a.handle)} — ${a.platform} — ${posts.filter(p => p.account_id === a.id).length} catatan`));
  R.push('', '## Daftar catatan', '', '| Tanggal | Kreator | Judul | Tema | Status |', '|---|---|---|---|---|');
  byDate(posts).forEach(p => { const a = accById(p.account_id);
    R.push(`| ${p.post_date||'-'} | ${a ? a.handle : '?'} | ${wl(names.get(p.id), (p.title||names.get(p.id)).replace(/\|/g,'/')).replace('|','\\|')} | ${(p.theme_ids||[]).map(id => thPath(thById(id))).join(', ').replace(/\|/g,'/') || '-'} | ${statusOf(p)} |`); });
  files.unshift({name: root + '_BACA-DULU.md', text: R.join('\n') + '\n'});
  return files;
}

async function addFoundToQueue(start){
  if(!FOUND) return;
  const {profile:pf, items} = FOUND;
  let acc = foundAccount();
  if(!acc){ acc = {id:uid(), handle:pf.username, platform:'Instagram', profile_url:pf.profile_url}; S.accounts.push(acc); }
  const existing = queueOf(acc.id);
  const recs = items.filter(i => !qByUrl(i.url)).map(i => { const post = postByUrl(i.url);
    return {id:uid(), account_id:acc.id, url:i.url, position:0, pinned:!!i.pinned, status: post ? 'selesai' : 'antri', note:null, post_id: post ? post.id : null, _t: i.taken_at ? Date.parse(i.taken_at) : igTime(i.url)}; });
  if(!recs.length){ toast('Tidak ada link baru'); return; }
  const tOf = q => q._t != null ? q._t : igTime(q.url);
  if([...existing, ...recs].every(q => tOf(q) != null)){
    [...existing, ...recs].sort((a,b) => tOf(a) - tOf(b)).forEach((q,i) => { q.position = i + 1; });
  } else {
    let p = existing.reduce((m,q) => Math.max(m, q.position), 0); recs.forEach(r => { r.position = ++p; });
  }
  recs.forEach(r => delete r._t);
  S.queue.push(...recs);
  const ok = await save();
  if(!ok){ toast('Gagal menyimpan antrian. Coba lagi.'); return; }
  logAct('kamu', 'info', `Sasaran baru ${acc.handle}: ${recs.length} link masuk antrian.`, {account_id:acc.id});
  FOUND = null; const inp = $('#newIn'); if(inp) inp.value = '';
  setNewOut(`<p class="status-line">${recs.length} link ${esc(acc.handle)} masuk antrian.</p>`);
  renderBerandaLive(); updateCounts();
  if(start) engineStart(acc.id);
}

  </article>`;

function parseLinks(txt){
  const out = []; const seen = new Set();
  String(txt||'').split(/\r?\n/).forEach(line => {
    const m = line.match(/https?:\/\/[^\s<>"'()\]]+/i); if(!m) return;
    let u = m[0].replace(/[.,;]+$/,'');
    if(!isYT(u)) u = u.replace(/[?#].*$/,'');
    if(/instagram\.com/i.test(u) && !u.endsWith('/')) u += '/';
    const k = ukey(u); if(seen.has(k)) return; seen.add(k);
    out.push({url:u, pinned: /pin|📌/i.test(line.replace(m[0],''))});
  });
  return out;
}
function addLinksDialog(accId){
  const a = accById(accId);
  const form = openDialog({title:`Tambah link ke antrian ${esc(a.handle)}`, sub:'Tempel satu link per baris. Nomor urut, teks lain, dan tanda "(di-pin)" boleh ikut tertempel.', wide:true, submit:'Tambahkan',
    body:`<div class="fgrid">
      <label class="f"><span>Daftar link</span><textarea name="links" id="qLinks" placeholder="1. https://www.instagram.com/reel/.../&#10;2. https://www.youtube.com/watch?v=..."></textarea></label>

        <label><input type="radio" name="mode" value="end" checked><span>Taruh di akhir antrian, sesuai urutan yang ditempel</span></label>
        <label id="qDateOpt"><input type="radio" name="mode" value="date"><span>Urutkan otomatis berdasarkan tanggal posting <em class="muted">(khusus Instagram, cocok untuk menyisipkan link yang terlewat)</em></span></label>
      </div></div>
      <label class="check f" style="flex-direction:row" id="qRevWrap"><input type="checkbox" name="rev"><span style="font-weight:500">Daftar yang ditempel urut dari paling BARU <span class="muted small">(akan dibalik jadi paling lama dulu)</span></span></label>
      <div class="f"><div class="qprev" id="qPrev">Belum ada link terbaca.</div></div>
    </div>`,
    onSubmit: fd => {
      const items = parseLinks(fd.get('links'));
      const fresh = items.filter(i => !qByUrl(i.url));
      if(!items.length){ toast('Tidak ada link yang terbaca'); return false; }
      if(!fresh.length){ toast('Semua link ini sudah ada di antrian'); return false; }
      const mode = fd.get('mode');
      const existing = queueOf(accId);
      if(mode === 'date' && [...existing, ...fresh].some(x => igTime(x.url) == null)){ toast('Ada link yang tanggalnya tidak terbaca. Pilih "Taruh di akhir antrian".'); return false; }
      if(fd.get('rev')) fresh.reverse();
      let firstPos = null;
      const recs = fresh.map(i => { const post = postByUrl(i.url);
        return {id:uid(), account_id:accId, url:i.url, position:0, pinned:i.pinned, status: post ? 'selesai' : 'antri', note:null, post_id: post ? post.id : null}; });
      if(mode === 'date'){
        const all = [...existing, ...recs].sort((x,y) => igTime(x.url) - igTime(y.url));
        all.forEach((q,i) => { q.position = i + 1; });
        firstPos = recs.map(r => r.position).sort((x,y) => x - y)[0];
      } else {
        let p = existing.reduce((m,q) => Math.max(m, q.position), 0);
        recs.forEach(r => { r.position = ++p; }); firstPos = recs[0].position;
      }
      S.queue.push(...recs);
      save(); renderQueuePanel();
      logAct('kamu', 'info', `${recs.length} link ditambahkan manual ke antrian ${a.handle}.`, {account_id:accId});
      toast(`${recs.length} link ditambahkan${mode === 'date' && recs.length === 1 ? ` di posisi #${firstPos}` : ''}${items.length - fresh.length ? ` · ${items.length - fresh.length} sudah ada, dilewati` : ''}`);
    }});
  const ta = $('#qLinks', form);
  const live = () => {
    const items = parseLinks(ta.value);
    const dupQ = items.filter(i => qByUrl(i.url)).length;
    const fresh = items.filter(i => !qByUrl(i.url));
    const done = fresh.filter(i => postByUrl(i.url)).length;
    const pins = fresh.filter(i => i.pinned).length;
    const noDate = [...queueOf(accId), ...fresh].some(x => igTime(x.url) == null);
    const dOpt = $('#qDateOpt', form); const dIn = $('input', dOpt);
    dIn.disabled = noDate; dOpt.classList.toggle('off', noDate);
    if(noDate && dIn.checked){ $('input[value="end"]', form).checked = true; }
    $('#qRevWrap', form).hidden = $('input[name="mode"]:checked', form).value === 'date';
    const times = fresh.map(i => igTime(i.url)).filter(Boolean).sort((x,y) => x - y);
    $('#qPrev', form).innerHTML = items.length
      ? `Terbaca <b>${items.length}</b> link · <b>${fresh.length}</b> baru${dupQ ? ` · ${dupQ} sudah ada di antrian (dilewati)` : ''}${done ? ` · ${done} sudah jadi catatan (langsung ditandai Selesai)` : ''}${pins ? ` · ${pins} di-pin` : ''}${times.length ? `<br><span class="muted">Rentang tanggal: ${fmtD(new Date(times[0]).toISOString())} – ${fmtD(new Date(times[times.length-1]).toISOString())}</span>` : ''}`
      : 'Belum ada link terbaca.';
  };
  ta.addEventListener('input', live);
  $$('input[name="mode"]', form).forEach(r => r.addEventListener('change', live));
  live();
}

    set('fTitle', m.title, 'judul'); set('fTags', m.tags && m.tags.join(', '), 'tag'); set('fUrl', m.url, 'link'); set('fPart', m.part, 'part');
    if(m.tema && !touched.has('fTema')){ $('#fTema').value = m.tema; $('#fTema').dispatchEvent(new Event('input')); found.push('tema'); }
    if(m.series && !touched.has('fSeries')){
      const ex = sers.find(s => lc(s.name) === lc(m.series));
      if(ex){ $('#fSeries').value = ex.id; $('#fNewWrap').hidden = true; }
      else { $('#fSeries').value = '__new'; $('#fNewWrap').hidden = false; $('#fSeriesNew').value = m.series; }
      found.push('series');
    }
    if(m.has_visual !== undefined && !touched.has('fVis')){ $('#fVis').checked = m.has_visual; $('#fVisWrap').hidden = !m.has_visual; if(!touched.has('fVisNote')) $('#fVisNote').value = m.visual_notes || ''; found.push('momen visual'); }
    if(autoDate()) found.push('tanggal');
    $('#detectNote').textContent = found.length ? `Terisi otomatis: ${found.join(', ')}. Periksa sebelum simpan.` : 'Blok metadata (--- judul: ... ---) tidak ditemukan — isi manual.';
    refresh();
  }
  function autoDate(){
    if(touched.has('fDate')) return false;
    const d = igDate($('#fUrl').value.trim()); if(!d || $('#fDate').value === d) return false;
    $('#fDate').value = d; return true;
  }
  function current(){
    const sv = $('#fSeries').value;
    return {series_id: sv && sv !== '__new' ? sv : null, newName: sv === '__new' ? $('#fSeriesNew').value.trim() : '',
      part_number: +$('#fPart').value || null, original_url: $('#fUrl').value.trim(), post_date: $('#fDate').value,
      title: $('#fTitle').value.trim(), tags: $('#fTags').value.split(',').map(slugify).filter(Boolean),
      tema: $('#fTema').value, has_visual: $('#fVis').checked, visual_notes: $('#fVis').checked ? $('#fVisNote').value.trim() : '', md_content: $('#fMd').value.trim()};
  }
  function refresh(){
    const c = current();
    const tmp = {account_id:a.id, series_id:c.series_id, part_number:c.part_number, post_date:c.post_date, title:c.title, title_slug: (parseMD(c.md_content).title_slug) || slugify(c.title).split('-').slice(0,6).join('-')};
    if(c.newName){ S.series.push({id:'__tmp', account_id:a.id, name:c.newName}); tmp.series_id = '__tmp'; }
    $('#fName').textContent = fileName(tmp);
    S.series = S.series.filter(s => s.id !== '__tmp');
    const qi = c.original_url ? qByUrl(c.original_url) : null;
    const qa = qi ? accById(qi.account_id) : null;
    $('#qNote').innerHTML = !c.original_url ? '' : qi
      ? `Antrian #${qi.position}${qa && qa.id !== a.id ? ` (${esc(qa.handle)})` : ''} · ${qi.status === 'selesai' ? 'sudah Selesai' : 'akan dicentang Selesai saat disimpan'}`
      : (queueOf(a.id).length ? '<span style="color:var(--warn)">Link ini tidak ada di antrian</span>' : '');
    const box = $('#dupBox');
    const dup = c.original_url ? postByUrl(c.original_url) : null;
    box.hidden = !dup; box.className = 'warnbox'; $('#fSave').textContent = 'Simpan catatan';
    if(dup){
      const da = accById(dup.account_id);
      if(dup.reprocess){ box.innerHTML = `Link ini sudah tersimpan dan <b>ditandai proses ulang</b>. Menyimpan akan <b>mengganti</b> catatan lamanya.`; $('#fSave').textContent = 'Ganti catatan lama'; }
      else { box.className = 'warnbox bad'; box.innerHTML = `Link ini sudah tersimpan (${esc(da?da.handle:'')} · ${fmtD(dup.post_date)}). Kalau hasil lamanya kurang bagus, tandai dulu "Perlu diproses ulang" di tab Catatan. <button type="button" class="link-btn" id="openDup">Buka catatan lama</button>`; $('#openDup').onclick = () => openPost(dup.id); }
    }
    return dup;
  }
  $('#fMd').addEventListener('input', () => { clearTimeout(parseT); parseT = setTimeout(detect, 250); });
  $('#fUrl').addEventListener('input', autoDate);
  ['fUrl','fDate','fPart','fTitle','fSeriesNew'].forEach(id => $('#'+id).addEventListener('input', refresh));
  $('#fClear').onclick = () => renderAddForm();
  f.onsubmit = async e => {
    e.preventDefault();
    if($('#fSave').disabled) return;
    clearTimeout(parseT); if($('#fMd').value.trim()) detect();
    const c = current(); const errs = [];
    if(!c.md_content) errs.push('hasil Gemini');
    if(!/^https?:\/\//i.test(c.original_url)) errs.push('link asli');
    if(!c.post_date) errs.push('tanggal postingan');
    if(!c.title) errs.push('judul');
    if($('#fSeries').value === '__new' && !c.newName) errs.push('nama series baru');
    if(errs.length){ toast('Belum lengkap: ' + errs.join(', ')); return; }
    const dup = refresh();
    if(dup && !dup.reprocess){ toast('Link ini sudah tersimpan'); return; }
    if(c.newName){
      const ex = sers.find(s => lc(s.name) === lc(c.newName));
      if(ex) c.series_id = ex.id; else { const ns = {id:uid(), account_id:a.id, name:c.newName, description:''}; S.series.push(ns); c.series_id = ns.id; }
    }
    const {ids, items} = resolveThemes(c.tema, true);
    const m = parseMD(c.md_content);
    const rec = {account_id:a.id, series_id:c.series_id, part_number:c.series_id ? c.part_number : null, platform:a.platform, post_date:c.post_date, processed_at:new Date().toISOString(),
      original_url:c.original_url, title:c.title, title_slug: m.title_slug || slugify(c.title).split('-').slice(0,6).join('-'), tags:c.tags, theme_ids:ids,
      has_visual:c.has_visual, visual_notes:c.visual_notes, md_content:c.md_content};
    const newT = items.filter(i => i.isNew).length;
    const backup = dup ? JSON.parse(JSON.stringify(dup)) : null; const newId = uid();
    if(dup) Object.assign(dup, rec, {validated:false, reprocess:false});
    else S.posts.push({id:newId, ...rec, validated:false, reprocess:false});
    const qi = qByUrl(c.original_url); const qBackup = qi ? {...qi} : null;
    if(qi) Object.assign(qi, {status:'selesai', post_id: dup ? dup.id : newId, note:null});
    $('#fSave').disabled = true; $('#fSave').textContent = 'Menyimpan ke cloud…';
    const ok = await save();
    if(!ok){ if(dup) Object.assign(dup, backup); else S.posts = S.posts.filter(x => x.id !== newId); if(qi) Object.assign(qi, qBackup); updateCounts(); $('#fSave').disabled = false; $('#fSave').textContent = 'Simpan catatan'; toast('GAGAL menyimpan ke database — isi form tidak dihapus, klik Simpan lagi'); return; }
    logAct('kamu', 'ok', `Catatan manual disimpan: "${c.title}".`, {post_id: dup ? dup.id : newId, account_id:a.id});
    const qsNow = queueStats(a.id);
    toast((dup ? 'Tersimpan: catatan lama diganti versi baru' : `Tersimpan: ${c.title}${newT ? ` · ${newT} tema baru` : ''}${ids.length ? '' : ' · menunggu tema'}`) + (qi ? ` · antrian #${qi.position} selesai (${qsNow.selesai}/${qsNow.total})` : ''));
    renderQueuePanel(); renderAddForm();
  };
  refresh();
}

      if(isNew) S.series.push({id:uid(), account_id:accId, name, description:(fd.get('description')||'').trim()});
      else Object.assign(s, {name, description:(fd.get('description')||'').trim()});
      save(); rerender(); toast('Series disimpan');
    }});
}

const F = {q:'',acc:'',tema:'',series:'',status:'',from:'',to:''};
const resetF = () => Object.assign(F,{q:'',acc:'',tema:'',series:'',status:'',from:'',to:''});
const sel = new Set();
function filtered(){
  const q = F.q.trim().toLowerCase();
  return S.posts.filter(p => {
    if(F.acc && p.account_id !== F.acc) return false;
    if(F.tema === '__none' && (p.theme_ids||[]).length) return false;
    if(F.tema && F.tema !== '__none' && !postThemeSet(p).has(F.tema)) return false;
    if(F.series && p.series_id !== F.series) return false;
    if(F.status === 'unvalidated' && p.validated) return false;
    if(F.status === 'validated' && !p.validated) return false;
    if(F.status === 'reprocess' && !p.reprocess) return false;
    if(F.status === 'visual' && !p.has_visual) return false;
    if(F.from && (p.post_date||'') < F.from) return false;
    if(F.to && (p.post_date||'') > F.to) return false;
    if(q){ const hay = (p.md_content + ' ' + p.title + ' ' + (p.tags||[]).join(' ') + ' ' + p.original_url + ' ' + (p.theme_ids||[]).map(id => thPath(thById(id))).join(' ')).toLowerCase(); if(!q.split(/\s+/).every(w => hay.includes(w))) return false; }
    return true;
  }).sort((a,b) => (b.post_date||'').localeCompare(a.post_date||''));
}
function filterLabel(){
  const parts = [];
  if(F.tema) parts.push(F.tema === '__none' ? 'menunggu tema' : 'tema ' + thPath(thById(F.tema)));
  if(F.acc) parts.push('kreator ' + (accById(F.acc)||{}).handle);
  if(F.series) parts.push('series ' + (serById(F.series)||{}).name);
  if(F.status) parts.push({unvalidated:'belum divalidasi',validated:'tervalidasi',reprocess:'perlu diproses ulang',visual:'ada momen visual'}[F.status]);
  if(F.from || F.to) parts.push(`tanggal ${F.from||'…'} s/d ${F.to||'…'}`);
  if(F.q) parts.push(`pencarian "${F.q}"`);
  return parts.join(', ');
}
function renderCatatan(){
  if(F.acc && !accById(F.acc)) F.acc = '';

  <div class="vh"><div><h2>Catatan</h2><p>Semua hasil Gemini. Pencarian membaca isi catatan, bukan cuma judul. Export ZIP menghasilkan paket siap dibaca Claude dan bisa dibuka di Obsidian.</p></div></div>
  <div class="filters">
    <label class="f search"><span>Cari isi catatan</span><input id="qIn" type="search" value="${esc(F.q)}" placeholder="contoh: kontras, thumb zone, lenis"></label>
    <label class="f c4"><span>Tema</span><select data-f="tema"><option value="">Semua</option><option value="__none" ${F.tema==='__none'?'selected':''}>Menunggu tema</option>${temaOpts}</select></label>
    <label class="f c4"><span>Kreator</span><select data-f="acc"><option value="">Semua</option>${S.accounts.map(a => `<option value="${a.id}" ${a.id===F.acc?'selected':''}>${esc(a.handle)} · ${a.platform}</option>`).join('')}</select></label>
    <label class="f c4"><span>Series</span><select data-f="series"><option value="">Semua</option>${sers.map(s => `<option value="${s.id}" ${s.id===F.series?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
    <label class="f c4"><span>Status</span><select data-f="status">
      ${[['','Semua'],['unvalidated','Belum divalidasi'],['validated','Sudah divalidasi'],['reprocess','Perlu diproses ulang'],['visual','Ada momen visual']].map(([v,l]) => `<option value="${v}" ${v===F.status?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f c4"><span>Tanggal post dari</span><input type="date" data-f="from" value="${F.from}"></label>
    <label class="f c4"><span>sampai</span><input type="date" data-f="to" value="${F.to}"></label>
  </div>
  <div class="toolbar"><label><input type="checkbox" id="selAll"> <span id="selInfo"></span></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ghost" id="resetF">Hapus filter</button><button class="btn sm" id="zipBtn">Export ZIP</button></div></div>
  <div class="rlist" id="rlist"></div>`;
  $('#qIn').oninput = e => { F.q = e.target.value; renderList(); };
  $$('[data-f]').forEach(el => el.onchange = e => { F[el.dataset.f] = e.target.value; if(el.dataset.f === 'acc'){ F.series=''; renderCatatan(); } else renderList(); });
  $('#resetF').onclick = () => { resetF(); renderCatatan(); };
  $('#selAll').onchange = e => { const list = filtered(); if(e.target.checked) list.forEach(p => sel.add(p.id)); else list.forEach(p => sel.delete(p.id)); renderList(); };
  $('#zipBtn').onclick = () => {
    const list = filtered(); const chosen = list.filter(p => sel.has(p.id)); const pick = chosen.length ? chosen : list;
    const fl = filterLabel();
    exportZip(pick, {name: chosen.length ? 'Pilihan Catatan' : (fl ? 'Hasil Filter' : 'Semua Catatan'), description:'', filter: chosen.length ? `${chosen.length} catatan dipilih manual` : (fl || 'semua catatan')});
  };
  renderList();
}
function renderList(){
  const list = filtered();
  [...sel].forEach(id => { if(!postById(id)) sel.delete(id); });
  const nSel = list.filter(p => sel.has(p.id)).length;
  $('#selInfo').textContent = nSel ? `${nSel} dipilih dari ${list.length}` : `${list.length} catatan`;
  $('#selAll').checked = list.length > 0 && nSel === list.length;
  $('#selAll').indeterminate = nSel > 0 && nSel < list.length;
  $('#zipBtn').textContent = nSel ? `Export ZIP (${nSel})` : `Export ZIP (${list.length})`;
  $('#zipBtn').disabled = !list.length;
  if(!list.length){ $('#rlist').innerHTML = `<div class="r-empty">${S.posts.length ? 'Tidak ada catatan yang cocok dengan filter.' : 'Belum ada catatan. Mulai dari Beranda.'}</div>`; return; }
  $('#rlist').innerHTML = list.map(p => {
    const a = accById(p.account_id); const s = p.series_id ? serById(p.series_id) : null;

    if(p.reprocess) b.push('<span class="badge bad">Perlu diproses ulang</span>');
    b.push(p.validated ? '<span class="badge ok">Tervalidasi</span>' : '<span class="badge warn">Belum divalidasi</span>');

    return `<div class="r"><input type="checkbox" data-sel="${p.id}" ${sel.has(p.id)?'checked':''} aria-label="Pilih ${esc(p.title)}">
      <div class="r-main" data-open="${p.id}" role="button" tabindex="0"><div class="r-title">${esc(p.title || fileName(p))}</div>
        <div class="r-meta">${pbadge(p.platform)}<span>${esc(a?a.handle:'?')} · ${fmtD(p.post_date)}${s?` · ${esc(s.name)}${p.part_number?` part ${p.part_number}`:''}`:''}</span></div>
        <div class="tcs">${themeChips(p)}</div></div>
      <div class="badges">${b.join('')}</div></div>`;
  }).join('');
  $$('[data-sel]', $('#rlist')).forEach(c => c.onchange = () => { c.checked ? sel.add(c.dataset.sel) : sel.delete(c.dataset.sel); renderList(); });
  $$('[data-open]', $('#rlist')).forEach(el => { el.onclick = () => openPost(el.dataset.open); el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openPost(el.dataset.open); } }; });

function renderPaket(){

  if(!S.packages.length) h += `<div class="empty"><strong>Belum ada paket</strong>Buat paket dari tema-tema yang ingin kamu lanjutkan jadi sesuatu.<br><button class="btn pri" data-a="add-pkg">+ Paket baru</button></div>`;
  else h += '<div class="list">' + S.packages.map(k => {
    const ps = pkgPosts(k); const all = S.posts.filter(p => { const s = postThemeSet(p); return k.theme_ids.some(id => s.has(id)); });
    const skipped = all.length - ps.length; const accs = new Set(ps.map(p => p.account_id));

      <div class="pk-nums"><span><b>${ps.length}</b>catatan</span><span><b>${accs.size}</b>kreator</span>${skipped?`<span>${skipped} belum divalidasi tidak ikut</span>`:''}${last?`<span>terbaru ${fmtD(last)}</span>`:''}</div>
      <div class="pk-foot"><button class="btn sm ghost" data-a="edit-pkg" data-id="${k.id}">Edit</button><button class="btn sm pri" data-a="zip-pkg" data-id="${k.id}" ${ps.length?'':'disabled'}>Export ZIP</button></div>

function pkgDialog(k){
